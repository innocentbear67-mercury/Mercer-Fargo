function rsInline(t){
  return tkrs(t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[(\d{1,3})\]/g, '<sup><a href="#rs-cite-$1">$1</a></sup>'));
}

function rsMarkdown(md){
  var tb = mdTables(esc(String(md || '')).split('\n')), lines = tb.lines;
  var out = [], mode = null;
  function close(){
    if(mode === 'ul' || mode === 'ol') out.push('</' + mode + '>');
    else if(mode === 'p') out.push('</p>');
    mode = null;
  }
  lines.forEach(function(raw){
    var line = raw.replace(/\s+$/, ''), m;
    if(!line.trim()){ close(); return; }
    if((m = line.match(/^\u0001T(\d+)\u0001$/))){ close(); out.push(mdTableHTML(tb.tables[+m[1]], rsInline)); return; }
    if((m = line.match(/^(#{1,6})\s+(.*)$/))){ close(); out.push('<h4>' + rsInline(m[2]) + '</h4>'); return; }
    if(/^\s*[-*]\s+/.test(line)){
      if(mode !== 'ul'){ close(); out.push('<ul>'); mode = 'ul'; }
      out.push('<li>' + rsInline(line.replace(/^\s*[-*]\s+/, '')) + '</li>');
      return;
    }
    if(/^\s*\d+\.\s+/.test(line)){
      if(mode !== 'ol'){ close(); out.push('<ol>'); mode = 'ol'; }
      out.push('<li>' + rsInline(line.replace(/^\s*\d+\.\s+/, '')) + '</li>');
      return;
    }
    if(/^-{3,}$/.test(line.trim())){ close(); out.push('<hr>'); return; }
    if(mode !== 'p'){ close(); out.push('<p>'); mode = 'p'; } else { out.push('<br>'); }
    out.push(rsInline(line));
  });
  close();
  return out.join('');
}

  RS.ctl = { abort:function(){ stop.stopped = true; } };
  MH.run({ mode:'research', provider:prov, model:RS.model, key:key, effort:rsEffortKey(), system:aiSystem(true), stop:stop,
    user:'Research question: ' + sk.question + rsFocusBrief() + '\n\nToday is ' + new Date().toISOString().slice(0, 10) + '.',
    onStep:function(st){
      if(st.kind === 'round'){ rsStep('round', st.label, st.detail); if(st.round) rsTaskEvent({ kind:'round_start', round:st.round }); }
      else if(st.ok === undefined){ rsStep('tool', st.label); rsTaskEvent({ kind:'tool_call', name:st.name, label:st.label, args:st.args }); }
      else { for(var i = RS.steps.length - 1; i >= 0; i--){ if(RS.steps[i].kind === 'tool' && RS.steps[i].label === st.label && RS.steps[i].ok === undefined){ RS.steps[i].ok = st.ok; if(st.error) RS.steps[i].detail = st.error.slice(0, 120); break; } } }
      rsPaintSoon();
    },
    onPlan:function(steps){
      if(!steps.length) return;
      RS.tasks = steps.map(function(x, i){ return { id:'p' + i, label:String(x.step || '').slice(0, 90), kw:null, st:x.status === 'completed' ? 'done' : x.status === 'in_progress' ? 'active' : 'todo' }; });
      RS.cur = Math.max(0, RS.tasks.map(function(t){ return t.st; }).lastIndexOf('active'));
      RS.planId = String(Date.now()); rsPaintSoon();
    }
  }).then(function(r){
    if(r.stopped){ rsStep('log', 'Stopped by you'); return; }
    RS.report = r.text; RS.citations = r.sources; RS.meta.rounds = r.rounds;
    if(!r.text) RS.error = 'the model returned an empty report';
    setTimeout(function(){ var el = $('rsResult'); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }, 350);
  }).catch(function(e){
    RS.error = String((e && e.message) || e); rsStep('log', 'Error: ' + RS.error, null, false);
  }).then(function(){
    RS.running = false; RS.tEnd = Date.now(); RS.meta.elapsedSeconds = Math.round((RS.tEnd - RS.t0) / 1000); thinkStop('rs');
    if(RS.tasks) rsTaskFinish(!RS.error && !!RS.report);
    rsLogSave(); rsPaint();
  });
}

function rsCopy(){
  var text = RS.report || RS.tokens || '';
  if(!text){ toast('Nothing to copy yet'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('Report copied'); },
      function(){ toast('Copy failed'); });
  } else { toast('Clipboard not available'); }
}
function rsDownload(){
  var text = RS.report || RS.tokens || '';
  if(!text){ toast('Nothing to download yet'); return; }
  var day = new Date().toISOString().slice(0, 10);
  var slug = (RS.question || 'research').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').split('-').slice(0, 6).join('-') || 'research';
  var head = '# ' + (RS.question || 'Research') + '\n\n_MercerFargo Deep Research · ' + day + ' · focus: ' + rsFocusLabels().join(', ') + '_\n\n';
  var cites = (RS.citations && RS.citations.length) ? '\n\n## Sources\n' + RS.citations.map(function(c){ return c.index + '. ' + (c.title || c.url) + ' — ' + c.url; }).join('\n') : '';
  var foot = '\n\n---\nFor informational purposes only — not financial advice. Do your own research. AI can make mistakes.\n';
  var blob = new Blob([head + text + cites + foot], { type:'text/markdown;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'MercerFargo-Research_' + slug + '_' + day + '.md';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Report saved to your Downloads folder');
}

function doSearch(q){
  var v = String(q || '').trim();
  if(!v) return;
  var sym = v.toUpperCase().replace(/\s+/g, '');
  var known = INSTRUMENTS[sym] || UNIVERSE.filter(function(u){ return u[0] === sym; })[0];
  var looksLikeSymbol = /^[\^A-Z0-9.\-\/]{1,12}$/.test(sym) && !/\s/.test(v);
  if(known || (looksLikeSymbol && v.length <= 6)){
    hsRemember({ sym:sym });
    go('#/quote/' + encodeURIComponent(sym));
    return;
  }
  var byName = UNIVERSE.filter(function(u){ return u[1].toLowerCase().indexOf(v.toLowerCase()) >= 0; })[0];
  if(byName){ go('#/quote/' + encodeURIComponent(byName[0])); return; }
  aiRun('deep', v);
}

/* --- header search: live suggestions (logo, ticker, name, price), typo-tolerant ---
   TradingView's scan matches ticker or name anywhere, so results are re-ranked:
   exact ticker, then ticker/name prefixes, then word starts, by market cap. A typo
   that matches nothing falls back to stockanalysis' fuzzy search ("Did you mean"). */
function hsScan(extra, n){
  var body = { filter:[scC('exchange', 'in_range', ['NASDAQ', 'NYSE', 'AMEX', 'CBOE']), scC('is_primary', 'equal', true), scC('type', 'in_range', ['stock', 'dr', 'fund'])].concat(extra.filter || []),
    columns:['name', 'description', 'close', 'change', 'type'], sort:{ sortBy:'market_cap_basic', sortOrder:'desc', nullsFirst:false }, range:[0, n] };
  if(extra.filter2) body.filter2 = extra.filter2;
  return fetchWithTimeout('https://scanner.tradingview.com/america/scan', 8000, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body:JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(j){ return (j.data || []).map(function(r){ var d = r.d; return { sym:dispSym(d[0]), name:d[1], c:d[2], pct:d[3], etf:d[4] === 'fund' }; }); });
}
function hsRank(q, it){
  var Q = q.toUpperCase(), n = (it.name || '').toUpperCase();
  if(it.sym === Q) return 0;
  if(it.sym.indexOf(Q) === 0 || n.indexOf(Q) === 0) return 1;
  if((' ' + n.replace(/[^A-Z0-9]+/g, ' ')).indexOf(' ' + Q.replace(/[^A-Z0-9]+/g, ' ')) >= 0) return 2;
  return 3;
}
function hsSuggest(q){
  var direct = hsScan({ filter2:{ operator:'and', operands:[{ operation:{ operator:'or', operands:[
    { expression:scC('name', 'match', q) }, { expression:scC('description', 'match', q) }] } }] } }, 40).catch(function(){ return []; });
  return direct.then(function(list){
    list = list.map(function(it, i){ it.r = hsRank(q, it); it.i = i; return it; }).sort(function(a, b){ return a.r - b.r || a.i - b.i; });
    var good = list.filter(function(it){ return it.r < 3; });
    if(good.length >= 3) return good.slice(0, 8);
    /* few or no real matches: likely a typo, ask the fuzzy search and price its picks */
    return searchSymbols(q).then(function(f){
      var syms = f.map(function(x){ return x.sym; }).filter(function(x){ return !good.some(function(g){ return g.sym === x; }); });
      if(!syms.length) return good.length ? good : list.slice(0, 8);
      return hsScan({ filter:[scC('name', 'in_range', syms)] }, 10).catch(function(){ return []; }).then(function(px){
        var fuzzy = syms.map(function(x){
          var p = px.filter(function(y){ return y.sym === x; })[0], src = f.filter(function(y){ return y.sym === x; })[0];
          return p || { sym:x, name:src.name, etf:src.kind === 'etf' };
        }).map(function(it){ it.fuzzy = true; return it; });
        return good.concat(fuzzy).slice(0, 8);
      });
    });
  });
}
function hsRecent(){ return load('fh3_recent_q', []); }
function hsRemember(it){
  var l = hsRecent().filter(function(x){ return x.sym !== it.sym; });
  l.unshift({ sym:it.sym, name:it.name || labelOf(it.sym) || '' }); save('fh3_recent_q', l.slice(0, 5));
}
/* The last five picks, re-priced live (falls back to the stored names if the scan fails). */
function hsRecentItems(){
  var l = hsRecent();
  if(!l.length) return Promise.resolve([]);
  return hsScan({ filter:[scC('name', 'in_range', l.map(function(x){ return x.sym; }))] }, 10).catch(function(){ return []; }).then(function(px){
    return l.map(function(x){ var p = px.filter(function(y){ return y.sym === x.sym; })[0]; return Object.assign({}, x, p || {}, { recent:true }); });
  });
}
function hsBind(form, input){
  var box = document.createElement('div'), items = [], at = -1, timer = 0, seq = 0;
  box.className = 'ins-sug hs-sug'; box.setAttribute('role', 'listbox'); box.hidden = true; box.id = input.id + 'Sug';
  form.appendChild(box);
  input.setAttribute('role', 'combobox'); input.setAttribute('aria-controls', box.id); input.setAttribute('aria-autocomplete', 'list'); input.setAttribute('aria-expanded', 'false');
  function draw(){
    box.hidden = !items.length; input.setAttribute('aria-expanded', String(!!items.length));
    var hdr = false;
    box.innerHTML = items.map(function(it, i){
      var lab = it.recent && !i ? '<div class="hs-hd">Recent searches<button type="button" class="hs-clr" data-clr="1">Clear</button></div>'
        : it.fuzzy && !hdr ? (hdr = true, '<div class="hs-hd">' + (i ? 'Related' : 'No exact match. Did you mean') + '</div>') : '';
      var up = (it.pct || 0) >= 0;
      return lab + '<button type="button" role="option" aria-selected="' + (i === at) + '" class="' + (i === at ? 'on' : '') + '" data-i="' + i + '" style="--d:' + (i * 25) + 'ms">' + guruLogo({ t:it.sym }) +
        '<b>' + esc(it.sym) + '</b><span>' + esc(it.name || '') + (it.etf && !/\bETF\b/.test(it.name || '') ? ' <small class="hs-tag">ETF</small>' : '') + '</span>' +
        '<em class="num">' + (it.c == null ? '' : money(it.c, 'USD') + '<small class="' + (up ? 'up' : 'down') + '">' + pct(it.pct || 0) + '</small>') + '</em></button>';
    }).join('');
  }
  function close(){ items = []; at = -1; draw(); }
  function pick(it){ close(); hsRemember(it); input.value = ''; input.blur(); go('#/quote/' + encodeURIComponent(it.sym)); }
  function recent(){ var my = ++seq; hsRecentItems().then(function(l){ if(my !== seq || input.value.trim() || document.activeElement !== input) return; items = l; at = -1; draw(); }); }
  input.addEventListener('input', function(){
    var v = input.value.trim(), my = ++seq;
    clearTimeout(timer);
    if(!v){ close(); recent(); return; }
    timer = setTimeout(function(){
      hsSuggest(v).then(function(l){
        if(my !== seq) return;
        items = l;
        /* Enter opens the top hit when it really matches, or the closest guess for a one-word typo; a question still goes to Marvell */
        at = l.length && ((l[0].r != null && l[0].r < 2) || (l[0].fuzzy && !/\s/.test(v))) ? 0 : -1;
        draw();
      });
    }, 150);
  });
  input.addEventListener('keydown', function(e){
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ if(!items.length) return; e.preventDefault(); at = (at + (e.key === 'ArrowDown' ? 1 : -1) + items.length + (at < 0 && e.key === 'ArrowUp' ? 1 : 0)) % items.length; draw(); }
    else if(e.key === 'Escape' && items.length){ close(); e.stopPropagation(); }
    else if(e.key === 'Enter' && at >= 0 && items[at]){ e.preventDefault(); e.stopImmediatePropagation(); seq++; pick(items[at]); }
  });
  input.addEventListener('blur', function(){ setTimeout(close, 150); });
  input.addEventListener('focus', function(){ if(input.value.trim()) input.dispatchEvent(new Event('input')); else recent(); });
  box.addEventListener('mousedown', function(e){
    if(e.target.closest('[data-clr]')){ e.preventDefault(); save('fh3_recent_q', []); close(); return; }
    var b = e.target.closest('[data-i]'); if(b){ e.preventDefault(); pick(items[+b.getAttribute('data-i')]); } });
  form.addEventListener('submit', function(){ seq++; close(); });
}

var TAPE_MKT = [['SP:SPX', 'S&P 500', 'indices'], ['NASDAQ:IXIC', 'Nasdaq', 'indices'], ['DJ:DJI', 'Dow', 'indices'], ['TVC:RUT', 'Russell 2000', 'indices'], ['CBOE:VIX', 'VIX', 'futures'],
  ['TVC:GOLD', 'Gold', 'commodities'], ['TVC:SILVER', 'Silver', 'commodities'], ['NYMEX:CL1!', 'WTI Crude', 'commodities'], ['TVC:US10Y', 'US 10Y', 'bonds'],
  ['TVC:DXY', 'Dollar Index', 'forex'], ['FX:EURUSD', 'EUR/USD', 'forex'], ['BITSTAMP:BTCUSD', 'Bitcoin', 'crypto'], ['BITSTAMP:ETHUSD', 'Ether', 'crypto']];
var TAPE = { keys:'', timer:0 };
function tapeScan(market, body){
  return fetchWithTimeout('https://scanner.tradingview.com/' + market + '/scan', 10000, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body:JSON.stringify(body) })
    .then(function(r){ return r.json(); }).then(function(j){ return j.data || []; });
}
function tapeLoad(){
  var cols = ['name', 'close', 'change', 'change_abs'];
  var mkt = tapeScan('global', { symbols:{ tickers:TAPE_MKT.map(function(x){ return x[0]; }) }, columns:cols }).catch(function(){ return []; });
  var hot = tapeScan('america', { filter:[scC('exchange', 'in_range', ['NASDAQ', 'NYSE', 'AMEX']), scC('is_primary', 'equal', true), scC('type', 'equal', 'stock'), scC('market_cap_basic', 'greater', 1e10)],
    columns:cols, sort:{ sortBy:'Value.Traded', sortOrder:'desc' }, range:[0, 12] }).catch(function(){ return []; });
  return Promise.all([mkt, hot]).then(function(r){
    var by = {}; r[0].forEach(function(x){ by[x.s] = x.d; });
    var row = function(k, label, d, href, kind){ return { k:k, label:label, c:d[1], pct:d[2], ch:d[3], href:href, kind:kind }; };
    var m = TAPE_MKT.filter(function(x){ return by[x[0]]; }).map(function(x){ return row(x[0], x[1], by[x[0]], '#/market/' + x[2], x[0] === 'TVC:US10Y' ? 'yield' : /FX:/.test(x[0]) ? 'fx' : ''); });
    var h = r[1].map(function(x){ var sym = dispSym(x.d[0]); return row(x.s, sym, x.d, '#/quote/' + encodeURIComponent(sym), 'stock'); });
    return m.slice(0, 5).concat(h, m.slice(5));
  });
}
function tapeVal(it){
  var dp = it.kind === 'fx' ? 4 : it.kind === 'yield' ? 3 : 2;
  var up = (it.pct || 0) >= 0;
  return { px:num(it.c, dp) + (it.kind === 'yield' ? '%' : ''), cls:up ? 'up' : 'down',
    ch:(up ? '▲ ' : '▼ ') + num(Math.abs(it.ch || 0), dp) + ' (' + (up ? '+' : '') + num(it.pct || 0, 2) + '%)' };
}
function tapePaint(items){
  var el = $('tape'); if(!el || !items.length) return;
  var keys = items.map(function(x){ return x.k; }).join(',');
  if(keys !== TAPE.keys){   // new line-up: rebuild (the loop restarts, which only happens when the hot list changes)
    TAPE.keys = keys;
    var html = items.map(function(it){ var v = tapeVal(it);
      return '<a class="tp-i" href="' + it.href + '" data-k="' + esc(it.k) + '"><b>' + esc(it.label) + '</b><span class="tp-px">' + v.px + '</span><span class="tp-ch ' + v.cls + '">' + v.ch + '</span></a>'; }).join('');
    el.innerHTML = '<div class="tp-track"><div class="tp-run">' + html + '</div><div class="tp-run" aria-hidden="true">' + html.replace(/<a /g, '<a tabindex="-1" ') + '</div></div>';
    var run = el.querySelector('.tp-run');
    el.querySelector('.tp-track').style.animationDuration = Math.max(30, run.scrollWidth / 55) + 's';   // ~55px a second whatever the width
    return;
  }
  items.forEach(function(it){
    var v = tapeVal(it);
    [].forEach.call(el.querySelectorAll('[data-k="' + it.k + '"]'), function(a){
      var px = a.querySelector('.tp-px'), ch = a.querySelector('.tp-ch');
      if(px.textContent !== v.px){ px.textContent = v.px; a.classList.remove('fl'); void a.offsetWidth; a.classList.add('fl'); }
      ch.textContent = v.ch; ch.className = 'tp-ch ' + v.cls;
    });
  });
}
function tapeStart(){
  var tick = function(force){ if(force || !document.hidden){ TAPE.t = Date.now(); tapeLoad().then(tapePaint).catch(function(){}); } };
  tick(true); clearInterval(TAPE.timer); TAPE.timer = setInterval(tick, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && Date.now() - (TAPE.t || 0) > 60000) tick(); });
}

function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme') === 'dark';
  CFG.theme = cur ? 'light' : 'dark';
  saveCfg(); applyTheme();
}
function applyTheme(){
  var t = CFG.theme;
  if(!t){ t = 'dark'; }
  else if(t === 'auto'){
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var b = $('themeBtn');
  if(b) b.title = 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' theme';
}

function enableNotifications(){
  if(!('Notification' in window)){ toast('Notifications unsupported here.'); return; }
  Notification.requestPermission().then(function(p){
    toast(p === 'granted' ? 'Notifications enabled' : 'Notifications blocked');
  });
}
function dictate(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Speech recognition is not available in this browser.'); return; }
  var rec = new SR();
  rec.lang = 'en-US';
  rec.onresult = function(e){ var t = e.results[0][0].transcript; $('prompt').value = t; };
  rec.start();
  toast('Listening…');
}

function exportCSV(what){
  var rows = [];
  if(what === 'watchlist'){
    rows = [['list', 'symbol', 'name', 'price', 'change_pct']];
    Object.keys(LISTS).forEach(function(id){
      LISTS[id].syms.forEach(function(s){
        var r = quoteRow(s, false);
        rows.push([LISTS[id].name, r.sym, r.name, r.q.c == null ? '' : r.q.c, r.ch.pct == null ? '' : r.ch.pct.toFixed(2)]);
      });
    });
  } else if(what === 'portfolio'){
    var st = pfStats(PFS[CUR.pf]);
    rows = [['symbol', 'shares', 'avg_cost', 'price', 'value', 'return_pct']].concat(st.rows.map(function(r){
      return [r.s, r.q, r.costPx, r.price, r.value.toFixed(2), r.retPct.toFixed(2)];
    }));
  } else if(what === 'quotes'){
    rows = [['symbol', 'name', 'price', 'change', 'change_pct', 'volume']];
    Object.keys(DATA.quotes).forEach(function(s){
      var q = DATA.quotes[s], ch = chgFrom(q);
      rows.push([s, labelOf(s), q.c == null ? '' : q.c, ch.abs == null ? '' : ch.abs.toFixed(4), ch.pct == null ? '' : ch.pct.toFixed(2), q.v || '']);
    });
  } else {
    rows = [['date', 'open', 'high', 'low', 'close', 'volume']];
    var h = DATA.hist[CUR.key] || [];
    rows = rows.concat(h.map(function(r){ return [r.d, r.o, r.h, r.l, r.c, r.v || '']; }));
  }
  download(what + '.csv', rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n'));
  toast('Exported ' + what + '.csv');
}

function loadSecFin(){
  var sym = dispSym(CUR.sym);
  Q.fin.status = 'loading';
  paintQuotePanel();
  secFinancials(sym, Q.fin.kind).then(function(res){
    var rows = res.rows.map(function(r){
      return [r.label].concat(r.values.map(function(v){ return v / 1e6; }));
    });
    var cols = (res.rows[0].ends || []).map(function(d){ return String(d).slice(0, 7); });
    Q.fin.data = { cols:cols, rows:rows };
    Q.fin.status = 'sec'; Q.fin.note = res.entity;
    var epsRow = rows.filter(function(r){ return r[0].indexOf('EPS') >= 0; })[0];
    if(epsRow) Q.eps = epsRow[epsRow.length - 1];
    paintQuotePanel();
    toast('Loaded ' + res.entity + ' from SEC XBRL');
  }).catch(function(e){
    Q.fin.status = 'error';
    Q.fin.note = (e && e.message) ? e.message : 'unreachable';
    Q.fin.data = null;
    paintQuotePanel();
  });
}

/* Briefings: run while the tab is open, like the earlier build. */
var briefTimers = [];
function scheduleBriefings(){
  briefTimers.forEach(clearInterval);
  briefTimers = [];
  TASKS.forEach(function(t){
    if(t.when === 'Once, in 30 seconds'){
      briefTimers.push(setTimeout(function(){ runBriefing(t); }, 30000));
    } else if(t.when === 'Every 60 seconds'){
      briefTimers.push(setInterval(function(){ runBriefing(t); }, 60000));
    } else {
      briefTimers.push(setTimeout(function(){ runBriefing(t); }, 1500));
    }
  });
}
function runBriefing(t){
  if(!aiReady()) return;
  if(t.sym) CUR.sym = t.sym;
  aiRun('custom', (t.instruction || 'Give me a short briefing.') + ' (briefing: ' + t.name + ')').then(function(text){
    if(!text) return;
    if('Notification' in window && Notification.permission === 'granted'){
      try{ new Notification(t.name, { body:String(text).slice(0, 180) }); }catch(e){}
    }
    toast(t.name + ': briefing ready');
  });
}

/* ------------------------------------------------------------ 10. bootstrap */

function boot(){
  if(boot.done) return;
  boot.done = true;
  boot.t0 = Date.now();
  setTimeout(bootDone, 12000);   // never trap anyone behind the splash
  applyTheme();
  var pane = $('rsPane');
  if(pane) pane.innerHTML = rsPanelHTML();
  rsShowTab(CFG.rtab || 'chat', false);
  acctRefresh();
  aiQuickButtons();
  bindEvents();
  if(!KEYS.provider) KEYS.provider = 'openrouter';
  // The model field is gone (the picker owns it), so only fill what exists.
  if($('model')) $('model').value = KEYS.model || AI_DEFAULT_MODEL[KEYS.provider] || AI_DEFAULT_MODEL.openrouter;
  if(!KEYS.model) KEYS.model = AI_DEFAULT_MODEL[KEYS.provider] || '';
  if($('apikey')) $('apikey').value = KEYS.key || '';
  if($('customUrl')) $('customUrl').value = KEYS.url || '';
  paintKeySegs();
  if($('customUrlField')) $('customUrlField').hidden = (KEYS.provider || 'openrouter') !== 'custom';
  chatRender();
  renderSubnav();
  renderRail();
  $('main').innerHTML = '<div class="section">' + skeletonRows(3, 140) + '</div><div class="section">' + skeletonCards(5) + '</div>';
  bootMsg(navigator.onLine ? 'Connecting to market data…' : 'Opening saved data…');
  probeProxy().then(function(){
    renderSubnav();
    renderRail();
    bootMsg('Loading your page…');
    return route();
  }).then(function(){
    bootDone();
    if(!navigator.onLine) sysShow('net');
    return loadUniverseQuotes();
  }).then(function(){
    if(CUR.view === 'home') paintHome();
    tourMaybeStart();
  });
  scheduleBriefings();
  alBadge(); alStart();
  window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if(!CFG.theme || CFG.theme === 'auto') applyTheme(); });
}
document.addEventListener('DOMContentLoaded', boot);
if(document.readyState !== 'loading') boot();
</script>
