/* ---- Resizable Marvell panel: drag its left edge; the page narrows to make room ----
   Width lives in --panel-w (body padding and the drawer both read it). It stops at the
   window's midpoint and never goes under 300px. Below 860px the panel overlays, so no custom width. */
var PANEL_MIN = 300;   // matches the 300px floor of the default --panel-w clamp
function pageW(){ return document.documentElement.clientWidth || innerWidth; }   // the visible page, without the scrollbar
function panelClamp(w){ return Math.round(Math.max(PANEL_MIN, Math.min(pageW() / 2, w))); }
function panelApply(){
  var root = document.documentElement.style;
  if(CFG.panelW && innerWidth > 860) root.setProperty('--panel-w', panelClamp(CFG.panelW) + 'px');
  else root.removeProperty('--panel-w');
  var g = $('drawerGrip'), cur = CFG.panelW && innerWidth > 860 ? panelClamp(CFG.panelW) : (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--panel-w')) || PANEL_MIN);
  if(g){ g.setAttribute('aria-valuemin', PANEL_MIN); g.setAttribute('aria-valuemax', Math.round(pageW() / 2)); g.setAttribute('aria-valuenow', cur); }
}
function panelSet(w, done){
  CFG.panelW = w == null ? null : panelClamp(w);
  panelApply();
  if(done){ saveCfg(); setTimeout(function(){ dispatchEvent(new Event('resize')); }, 240); }   // after the page's padding transition
}
function panelInit(){
  var g = $('drawerGrip'); if(!g) return;
  var raf = 0, x = 0, moved = false;
  g.addEventListener('pointerdown', function(e){
    if(e.button !== 0) return;
    e.preventDefault(); g.setPointerCapture(e.pointerId); moved = false;
    document.body.classList.add('rs-drag');
  });
  g.addEventListener('pointermove', function(e){
    if(!document.body.classList.contains('rs-drag')) return;
    x = e.clientX; moved = true;
    if(!raf) raf = requestAnimationFrame(function(){ raf = 0; panelSet(pageW() - x); });
  });
  var end = function(){
    if(!document.body.classList.contains('rs-drag')) return;
    document.body.classList.remove('rs-drag');
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    if(moved) panelSet(pageW() - x, true);   // a click without movement leaves the saved width alone
  };
  g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end); g.addEventListener('lostpointercapture', end);
  g.addEventListener('dblclick', function(){ panelSet(null, true); toast('Panel width reset'); });
  g.addEventListener('keydown', function(e){
    var step = e.shiftKey ? 96 : 32, w = $('drawer').offsetWidth;
    if(e.key === 'ArrowLeft'){ e.preventDefault(); panelSet(w + step, true); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); panelSet(w - step, true); }
    else if(e.key === 'Home'){ e.preventDefault(); panelSet(pageW() / 2, true); }
    else if(e.key === 'End'){ e.preventDefault(); panelSet(PANEL_MIN, true); }
  });
  addEventListener('resize', function(){ if(!document.body.classList.contains('rs-drag')) panelApply(); });
  panelApply();
  railSync();
  if('ResizeObserver' in window){ var ro = new ResizeObserver(function(){ rsThumb(); rsFxStart(); }); ['tabChat', 'tabResearch', 'rsFx'].forEach(function(id){ if($(id)) ro.observe($(id)); }); }
}

/* ---- Mode toggle effect: an LED dot matrix inside the sliding pill.
   Agent: gold, a slow drifting swell with a gentle twinkle. Deep Research: purple, a fast
   equalizer sweep with hard flicker, brighter toward the right. Colours cross-fade on switch. */
var RSFX = { raf:0, mix:-1, last:0, noise:[], nt:0 };
function rsFxStart(){ if(!RSFX.raf) RSFX.raf = requestAnimationFrame(rsFxFrame); }
function rsFxFrame(now){
  RSFX.raf = 0;
  var cv = $('rsFx'), dr = $('drawer'), tabs = document.querySelector('.rs-tabs');
  if(!cv || !dr || !tabs || !dr.classList.contains('open')) return;   // openDrawer() restarts it
  if(!document.hidden) RSFX.raf = requestAnimationFrame(rsFxFrame);
  else { document.addEventListener('visibilitychange', rsFxStart, { once:true }); return; }
  var w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  if(!w || !h) return;
  if(cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var target = tabs.getAttribute('data-t') === 'research' ? 1 : 0;
  var dt = Math.min(.1, (now - (RSFX.last || now)) / 1000); RSFX.last = now;
  RSFX.mix = (RSFX.mix < 0 || still) ? target : RSFX.mix + (target - RSFX.mix) * Math.min(1, dt * 7);   // reduced motion: one frame, so snap
  var m = RSFX.mix, t = still ? 0 : now / 1000;
  var P = 4, S = 2.6, cols = Math.max(1, Math.floor(w / P)), rows = Math.max(1, Math.floor(h / P));
  var ox = (w - cols * P + (P - S)) / 2, oy = (h - rows * P + (P - S)) / 2, n = cols * rows;
  if(RSFX.noise.length !== n){ RSFX.noise = []; for(var k = 0; k < n; k++) RSFX.noise.push(Math.random()); }
  var rate = still ? 0 : (2 + 34 * m) * dt;   // share of dots re-rolled this frame: a twinkle for Agent, flicker for Research
  for(var j = 0; j < n; j++) if(Math.random() < rate) RSFX.noise[j] = Math.random();
  var light = document.documentElement.getAttribute('data-theme') !== 'dark', boost = light ? 2.4 : 1;   // deeper ink on white
  var g = light ? [150, 118, 62] : [193, 165, 120], v = light ? [112, 80, 220] : [167, 139, 250];
  var col = [0, 1, 2].map(function(i){ return Math.round(g[i] + (v[i] - g[i]) * m); }).join(',');
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  for(var c = 0; c < cols; c++){
    var x = cols > 1 ? c / (cols - 1) : .5;
    var swell = .5 + .5 * Math.sin((x * 1.4 - t * .22) * Math.PI * 2);                     // Agent: one slow wave
    var eq = .35 + .65 * Math.abs(Math.sin(c * .55 + t * 4.2) * Math.cos(c * .21 - t * 2.7)); // Research: equalizer columns
    for(var r = 0; r < rows; r++){
      var y = rows > 1 ? r / (rows - 1) : .5, nz = RSFX.noise[c * rows + r];
      var a0 = (.1 + .26 * swell) * (.75 + .5 * nz) * (1 - .35 * Math.abs(y - .5));
      var lit = (1 - y) < eq ? 1 : .28;
      var a1 = (.12 + .5 * x) * lit * (.45 + .9 * nz);
      var a = a0 + (a1 - a0) * m;
      if(a < .03) continue;
      ctx.fillStyle = 'rgba(' + col + ',' + Math.min(light ? .78 : .62, a * boost).toFixed(3) + ')';
      ctx.fillRect(ox + c * P, oy + r * P, S, S);
    }
  }
  if(still){ cancelAnimationFrame(RSFX.raf); RSFX.raf = 0; }
}

/* ---- Price alerts and the inbox --------------------------------------------------------------------
   Alerts live in this browser and are checked every 30 seconds while MercerFargo is open (there is no
   server to watch for you). 3- and 5-minute moves compare against prices sampled on those checks, so
   they need the site open for a few minutes. When one fires it lands in the inbox (bell, top right),
   shows a toast and, if allowed, a desktop notification. */
var AL_GROUPS = [
  ['Uptrend', [['above', 'Price rises above', '$'], ['dayup', 'Intraday rise exceeds', '%'], ['up3', '3 min rise exceeds', '%'], ['up5', '5 min rise exceeds', '%']]],
  ['Downtrend', [['below', 'Price falls below', '$'], ['daydn', 'Intraday fall exceeds', '%'], ['dn3', '3 min fall exceeds', '%'], ['dn5', '5 min fall exceeds', '%']]],
  ['Market Data', [['vol', 'Volume exceeds', 'shares'], ['turn', 'Turnover exceeds', '$'], ['tratio', 'Turnover ratio exceeds', '%']]],
  ['Events', [['news', 'New Announcement', '']]]
];
var AL_FREQ = [['once', 'Only Once'], ['day', 'Once Per Day'], ['always', 'Always On']];
var ALERTS = load('fh3_alerts', []).filter(function(a){ return a && a.id && a.sym && a.type; });
var INBOX = load('fh3_inbox', []).filter(function(m){ return m && m.id; });
var AL = { timer:0, samp:{}, form:null, tab:'inbox', news:{} };

function alDef(type){ for(var g = 0; g < AL_GROUPS.length; g++) for(var k = 0; k < AL_GROUPS[g][1].length; k++) if(AL_GROUPS[g][1][k][0] === type) return AL_GROUPS[g][1][k]; return null; }
function alNum(v){   // "50M", "2.5b", "1,200" -> number
  var m = String(v == null ? '' : v).trim().replace(/[,$\s]/g, '').match(/^(-?\d*\.?\d+)([kmbt]?)$/i);
  return m ? +m[1] * ({ k:1e3, m:1e6, b:1e9, t:1e12 }[m[2].toLowerCase()] || 1) : null;
}
function alText(a){
  var d = alDef(a.type) || ['', a.type, ''];
  if(a.type === 'news') return 'New announcement (SEC filing)';
  var v = d[2] === '%' ? num(a.val, a.val % 1 ? 2 : 0) + '%' : d[2] === '$' ? (a.type === 'turn' ? '$' + compact(a.val) : money(a.val, 'USD')) : compact(a.val);
  return d[1] + ' ' + v;
}
function alSave(){ save('fh3_alerts', ALERTS); INBOX = INBOX.slice(0, 200); save('fh3_inbox', INBOX); alBadge(); }
function alBadge(){
  var n = INBOX.filter(function(m){ return !m.read; }).length, b = $('inboxBadge');
  if(b){ b.hidden = !n; b.textContent = n > 99 ? '99+' : n; }
  var btn = $('inboxBtn'); if(btn) btn.title = n ? n + ' unread alert' + (n === 1 ? '' : 's') : 'Alerts inbox';
}
function alAgo(ts){
  var s = (Date.now() - ts) / 1000;
  return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : new Date(ts).toLocaleDateString([], { month:'short', day:'numeric' });
}

/* ---- checking ---- */
function alStart(){
  clearInterval(AL.timer);
  if(!ALERTS.some(function(a){ return a.on; })) return;
  AL.timer = setInterval(alTick, 30000);
  alTick();
}
function alTick(){
  var live = ALERTS.filter(function(a){ return a.on; });
  if(!live.length){ clearInterval(AL.timer); return; }
  if(document.hidden && Date.now() - (AL.last || 0) < 120000) return;   // a hidden tab still checks, just less often
  AL.last = Date.now();
  var syms = live.filter(function(a){ return a.type !== 'news'; }).map(function(a){ return a.sym; }).filter(function(s, i, x){ return x.indexOf(s) === i; });
  (syms.length ? loadQuotesFor(syms) : Promise.resolve()).then(function(){
    var now = Date.now();
    syms.forEach(function(s){
      var q = DATA.quotes[s]; if(!q || q.c == null) return;
      var arr = AL.samp[s] = (AL.samp[s] || []).filter(function(x){ return now - x.t < 16 * 60000; });
      arr.push({ t:now, c:q.c });
    });
    live.forEach(function(a){ if(a.type === 'news') alNews(a); else alCheck(a, now); });
  }).catch(function(){});
}
function alMove(s, mins, now){   // % change over the last `mins` minutes from our own samples
  var arr = AL.samp[s] || [], past = null;
  for(var i = arr.length - 1; i >= 0; i--) if(now - arr[i].t >= mins * 60000 - 15000){ past = arr[i]; break; }
  var cur = arr[arr.length - 1];
  return past && cur && past.c ? (cur.c / past.c - 1) * 100 : null;
}
function alCheck(a, now){
  var q = DATA.quotes[a.sym] || {}, v = a.val, hit = null, detail = '';
  var px = q.c != null ? money(q.c, q.cur) : '';
  switch(a.type){
    case 'above': hit = q.c != null && q.c >= v; detail = 'Price ' + px; break;
    case 'below': hit = q.c != null && q.c <= v; detail = 'Price ' + px; break;
    case 'dayup': hit = q.pct != null && q.pct >= v; detail = 'Up ' + pct(q.pct) + ' today at ' + px; break;
    case 'daydn': hit = q.pct != null && q.pct <= -v; detail = 'Down ' + pct(q.pct) + ' today at ' + px; break;
    case 'up3': case 'up5': case 'dn3': case 'dn5': {
      var m = alMove(a.sym, a.type.slice(-1) === '3' ? 3 : 5, now);
      hit = m == null ? null : (a.type.slice(0, 2) === 'up' ? m >= v : m <= -v);
      detail = (m == null ? '' : pct(m) + ' in ' + a.type.slice(-1) + ' min, now ') + px; break;
    }
    case 'vol': hit = q.v != null && q.v >= v; detail = 'Volume ' + compact(q.v); break;
    case 'turn': hit = q.v != null && q.c != null && q.c * q.v >= v; detail = 'Turnover $' + compact((q.c || 0) * (q.v || 0)); break;
    case 'tratio': { var r = q.v != null && q.shares ? q.v / q.shares * 100 : null; hit = r == null ? null : r >= v; detail = r == null ? '' : 'Turnover ratio ' + num(r, 2) + '%'; break; }
  }
  if(hit == null) return;
  alMaybeFire(a, hit, detail);
}
/* Only once: fire, then switch off. Once per day: at most once a calendar day. Always on: each time the
   condition becomes true again (not every 30 seconds while it stays true). */
function alMaybeFire(a, hit, detail){
  var was = a.st; a.st = hit;
  if(!hit) return;
  var today = ymd(new Date());
  if(a.freq === 'day' && a.day === today) return;
  if(a.freq === 'always' && was === true) return;
  if(a.freq === 'day') a.day = today;
  if(a.freq === 'once') a.on = false;
  alFire(a, detail);
}
function alNews(a){   // new SEC filing since the alert was set (checked every 5 minutes)
  if(Date.now() - (AL.news[a.id] || 0) < 300000) return;
  AL.news[a.id] = Date.now();
  filList(a.sym).then(function(d){
    var f = (d && d.filings || [])[0]; if(!f) return;
    if(!a.seen){ a.seen = f.accession; alSave(); return; }   // first look: remember the latest, fire on the next one
    if(f.accession === a.seen) return;
    a.seen = f.accession;
    alMaybeFire(a, true, f.form + ' · ' + filTitle(f) + ' (' + f.filing_date + ')');
    a.st = false;   // each new filing is its own event
    alSave();
  }).catch(function(){});
}
function alFire(a, detail){
  var m = { id:'m' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), aid:a.id, sym:a.sym, title:a.sym + ' · ' + alText(a),
    body:detail + (a.note ? ' — ' + a.note : ''), ts:Date.now(), read:false };
  INBOX.unshift(m); alSave();
  toast('🔔 ' + m.title);
  try{ if('Notification' in window && Notification.permission === 'granted') new Notification(m.title, { body:m.body, icon:'assets/favicon.png', tag:m.id }); }catch(e){}
  if($('inboxPanel') && !$('inboxPanel').hidden) alPanelPaint();
}

function sysCountdown(n){
  clearInterval(SYS.timer);
  var note = $('sysNote'); if(note) note.textContent = 'Retrying in ' + n + 's';
  SYS.timer = setInterval(function(){
    n--; var e = $('sysNote');
    if(n <= 0){ clearInterval(SYS.timer); sysRetry(); }
    else if(e) e.textContent = 'Retrying in ' + n + 's';
  }, 1000);
}
/* One known-good request decides whether the feeds are really down: a single failed symbol never shows the screen. */
function sysPing(){ return fetchWithTimeout(OC_PROXY + '/api/chart?symbol=SPY&range=5D', 8000).then(function(r){ return r.json(); }).then(function(j){ return !!(j && j.bars && j.bars.length); }).catch(function(){ return false; }); }
function sysApiCheck(){
  if(!navigator.onLine || SYS.shown || Date.now() < SYS.apiSnooze || sysApiCheck.busy) return;
  sysApiCheck.busy = true;
  sysPing().then(function(ok){ sysApiCheck.busy = false; if(!ok && navigator.onLine) sysShow('api'); });
}
function sysRetry(){
  var kind = SYS.shown, note = $('sysNote'), box = document.querySelector('#sysScreen .sys-in');
  if(kind === 'net' && !navigator.onLine){
    if(note) note.textContent = 'Still offline. Check your Wi-Fi or cable.';
    if(box){ box.classList.remove('sys-shake'); void box.offsetWidth; box.classList.add('sys-shake'); }
    return;
  }
  if(note) note.textContent = 'Checking…';
  clearInterval(SYS.timer);
  sysPing().then(function(ok){
    if(ok){ sysHide(); toast(kind === 'net' ? 'Back online' : 'Market data reconnected'); route(); }
    else if(kind === 'api') sysCountdown(30);
    else { sysHide('net'); sysShow('api'); }
  });
}
addEventListener('offline', function(){ SYS.netSkip = false; sysShow('net'); });
addEventListener('online', function(){ if(SYS.shown === 'net'){ sysHide('net'); toast('Back online'); route(); } else if(SYS.netSkip){ SYS.netSkip = false; toast('Back online'); route(); } });

/* Where the latest session starts: crypto and FX trade around the clock, so they compare with 24h ago;
   futures reopen after a daily settlement break; cash indices reset each (UTC) trading date. */
function mkSession(s, bars){
  var n = bars.length, last = bars[n - 1], i = n - 1;
  if(/-USD$|=X$|^DX-/.test(s)) while(i > 0 && bars[i - 1].t > last.t - 86400) i--;
  else if(/=F$/.test(s)) while(i > 0 && bars[i].t - bars[i - 1].t < 2700) i--;
  else while(i > 0 && bars[i - 1].d === last.d) i--;
  return i;
}
function mkFetch(s, rng){
  return fetchJSON(OC_PROXY + '/api/chart?symbol=' + encodeURIComponent(s) + '&range=' + rng, 12000).then(function(j){
    if(!j || j.error) throw new Error((j && j.error) || 'no data');
    var b = (j.bars || []).filter(function(x){ return x.c != null; });
    /* Drop one-bar spikes (bad FX ticks): far from both neighbours, which agree with each other. "Far" is 5x the median bar-to-bar move. */
    var mv = b.slice(1).map(function(x, i){ return Math.abs(x.c - b[i].c); }).sort(function(x, y){ return x - y; });
    var lim = 5 * (mv[mv.length >> 1] || 0) + 1e-9;
    b = b.filter(function(x, i){
      var p = b[i - 1], n = b[i + 1];
      return !p || !n || Math.abs(x.c - p.c) < lim || Math.abs(x.c - n.c) < lim || Math.abs(n.c - p.c) > lim;
    });
    return { bars:b, cur:j.currency || '', exch:j.exchange || '' };
  });
}
function mkLoadOne(s){

    var day = b.length - i > 1 ? b.slice(i) : b.slice(Math.max(0, i - 1));   // the session; a session one bar old shows from the reference close
    MK.q[s] = { c:last.c, ref:ref, ch:ref != null ? last.c - ref : null, pct:ref ? (last.c / ref - 1) * 100 : null, t:last.t,
      bars:day, five:b, cur:r.cur, exch:r.exch,
      hi:Math.max.apply(null, b.slice(i).map(function(x){ return x.h != null ? x.h : x.c; })),
      lo:Math.min.apply(null, b.slice(i).map(function(x){ return x.l != null ? x.l : x.c; })),
      o:b[i].o != null ? b[i].o : b[i].c };

  }).catch(function(){ if(!MK.q[s]) MK.q[s] = { fail:true }; mkPaintSoon(); });

function mkZoom(reg){ MK.reg = reg; mkPaint(); mkTween(mkBoxFor(reg)); }
function mkSetVB(vb){   // clamp a view box to the map and apply it: land detail, pin scale, pan cursor
  var w = Math.max(110, Math.min(1080, vb[2])), h = w * 420 / 1080;
  MK.vb = [Math.max(0, Math.min(1080 - w, vb[0])), Math.max(0, Math.min(420 - h, vb[1])), w, h];
  var svg = $('mkMap'); if(!svg) return;
  svg.setAttribute('viewBox', MK.vb.map(function(v){ return v.toFixed(1); }).join(' '));
  svg.classList.toggle('zoomed', w < 1079);
  svg.classList.toggle('near', w < 520);   // close in, there is room to label every market
  var k = mkK();
  mkLand();
  [].forEach.call(svg.querySelectorAll('.mk-pin'), function(g){ g.setAttribute('transform', 'translate(' + g.getAttribute('data-x') + ' ' + g.getAttribute('data-y') + ') scale(' + k + ')'); });
  if(MK.hov) mkHoverShow(MK.hov);
}
function mkTween(to){
  var from = MK.vb.slice(), t0 = performance.now(), id = MK.tw = (MK.tw || 0) + 1;
  (function step(now){
    if(id !== MK.tw) return;   // a newer zoom took over
    var f = Math.min(1, (now - t0) / 520), e = f < .5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2;
    mkSetVB(from.map(function(v, i){ return v + (to[i] - v) * e; }));
    if(f < 1) requestAnimationFrame(step);
  })(t0);
}
/* Zoom by f (>1 = in) keeping the map point under client (cx, cy) fixed. */
function mkZoomAt(f, cx, cy){
  var svg = $('mkMap'); if(!svg) return;
  MK.tw = (MK.tw || 0) + 1;   // cancel a running tween
  var r = svg.getBoundingClientRect(), fx = (cx - r.left) / r.width, fy = (cy - r.top) / r.height;
  var ux = MK.vb[0] + fx * MK.vb[2], uy = MK.vb[1] + fy * MK.vb[3];
  var w = Math.max(110, Math.min(1080, MK.vb[2] / f)), h = w * 420 / 1080;
  mkSetVB([ux - fx * w, uy - fy * h, w, h]);
}
function mkZoomBtn(f){ var r = $('mkMap').getBoundingClientRect(); var vb = MK.vb, w = Math.max(110, Math.min(1080, vb[2] / f)), h = w * 420 / 1080;
  mkTween([vb[0] + (vb[2] - w) / 2, vb[1] + (vb[3] - h) / 2, w, h]); }

/* Pinch (trackpad: ctrl+wheel, Safari: gesture events, touch: two pointers) zooms; dragging pans once zoomed. */
function mkGestures(svg){
  svg.addEventListener('wheel', function(e){
    if(!e.ctrlKey) return;   // plain two-finger scroll still scrolls the page
    e.preventDefault(); mkHoverHide();
    mkZoomAt(Math.exp(-e.deltaY * (e.deltaMode ? .05 : .01)), e.clientX, e.clientY);
  }, { passive:false });
  var gs = 1;
  svg.addEventListener('gesturestart', function(e){ e.preventDefault(); gs = 1; });
  svg.addEventListener('gesturechange', function(e){ e.preventDefault(); mkZoomAt(e.scale / gs, e.clientX, e.clientY); gs = e.scale; });
  var pts = {}, moved = 0, last = null;
  var info = function(){ var k = Object.keys(pts), a = pts[k[0]], b = pts[k[1]];
    return k.length > 1 ? { x:(a.x + b.x) / 2, y:(a.y + b.y) / 2, d:Math.hypot(a.x - b.x, a.y - b.y) } : (a ? { x:a.x, y:a.y, d:0 } : null); };
  svg.addEventListener('pointerdown', function(e){
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    pts[e.pointerId] = { x:e.clientX, y:e.clientY }; last = info(); moved = 0;
  });
  svg.addEventListener('pointermove', function(e){
    if(!pts[e.pointerId]) return;
    pts[e.pointerId] = { x:e.clientX, y:e.clientY };
    var cur = info(), n = Object.keys(pts).length;
    if(!last || !cur) return;
    if(n === 1 && MK.vb[2] >= 1079 && e.pointerType !== 'mouse') { last = cur; return; }   // not zoomed: a finger scrolls the page
    moved += Math.abs(cur.x - last.x) + Math.abs(cur.y - last.y);
    if(moved > 4){
      if(!svg.hasPointerCapture(e.pointerId)) try{ svg.setPointerCapture(e.pointerId); }catch(x){}
      MK.tw = (MK.tw || 0) + 1; mkHoverHide();
      var r = svg.getBoundingClientRect(), u = MK.vb[2] / r.width;
      if(n > 1 && last.d && cur.d) mkZoomAt(cur.d / last.d, cur.x, cur.y);
      if(n > 1 || MK.vb[2] < 1079) mkSetVB([MK.vb[0] - (cur.x - last.x) * u, MK.vb[1] - (cur.y - last.y) * u, MK.vb[2], MK.vb[3]]);
    }
    last = cur;
  });
  var up = function(e){ delete pts[e.pointerId]; last = info(); };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('click', function(e){ if(moved > 4){ e.stopPropagation(); e.preventDefault(); moved = 0; } }, true);   // a drag is not a click
  svg.addEventListener('pointerover', function(e){ var g = e.target.closest('.mk-pin'); if(g && e.pointerType !== 'touch' && !Object.keys(pts).length) mkHoverShow(g.getAttribute('data-s')); });
  svg.addEventListener('pointerout', function(e){ var g = e.target.closest('.mk-pin'); if(g && !(e.relatedTarget && g.contains(e.relatedTarget))) mkHoverHide(); });
  svg.addEventListener('focusin', function(e){ var g = e.target.closest('.mk-pin'); if(g) mkHoverShow(g.getAttribute('data-s')); });
  svg.addEventListener('focusout', mkHoverHide);
}

    (q.t ? '<small class="mut">As of ' + esc(new Date(q.t * 1000).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' })) + ' · click to chart</small>' : ''));
  var cr = card.getBoundingClientRect(), dr = g.getBoundingClientRect();
  var cx = dr.left + dr.width / 2 - cr.left, cy = dr.top - cr.top;

  tip.style.top = (below ? cy + dr.height + 10 : cy - th - 10) + 'px';
}

/* ------------------------------------------------------- data orchestrators */

function prevCloseFrom(rows){
  if(!rows || rows.length < 2) return null;
  var last = rows[rows.length - 1];
  var today = new Date().toISOString().slice(0, 10);
  return (last.d === today) ? rows[rows.length - 2].c : last.c;
}

function loadQuotesFor(syms, opts){
  opts = opts || {};
  var list = [], seen = {};
  syms.filter(Boolean).forEach(function(s){
    var d = dispSym(s);
    if(d && !seen[d]){ seen[d] = 1; list.push(d); }
  });
  if(!list.length) return Promise.resolve(false);
  if(opts.cachedOnly) return Promise.resolve(list.some(function(s){ return DATA.quotes[s] && DATA.quotes[s].c != null; }));
  return fetchQuotes(list, opts.concurrency || 6).then(function(n){
    return n > 0;
  }).catch(function(){
    setStatus(Object.keys(DATA.quotes).length ? 'delayed' : 'offline');
    return false;
  });
}

function loadSparkFor(syms, range){
  range = range || '1M';
  return Promise.all(syms.slice(0, 12).map(function(s){
    var d = dispSym(s);
    return fetchHistory(d, range).then(function(rows){
      DATA.hist['sp_' + d] = rows;
      var q = DATA.quotes[d];
      /* The series is only used to derive a change when the quote source did not
         provide one (FX). For equities the last bar is the last session close, not
         the previous close, so overwriting here would zero out the day change. */
      if(q && (q.pc == null || q.pct == null)){
        var pc = prevCloseFrom(rows);
        if(pc != null){
          q.pc = pc;
          if(q.c != null){
            q.ch = q.c - pc;
            q.pct = pc ? (q.c / pc - 1) * 100 : q.pct;
          }
        }
      }
      return rows;
    }).catch(function(){ return null; });
  }));
}


function loadUniverseQuotes(){

function loadNewsInto(q){
  return fetchNews(q, 22).then(function(items){
    NEWS.items = items;
    NEWS.clusters = clusterNews(items);

    NEWS.loaded = true;
    return items;
  }).catch(function(){
    NEWS.loaded = true;
    NEWS.clusters = NEWS.clusters || [];
    return [];
  });
}

}

/* --------------------------------------------------------- portfolio view */

function pfStats(pf){
  var rows = pf.holdings.map(function(h){
    var s = dispSym(h.s);
    var q = DATA.quotes[s] || {};
    var price = q.c != null ? q.c : h.px;
    var ch = chgFrom(q);
    var value = price * h.q;
    var cost = h.px * h.q;
    return {
      s:s, name:labelOf(s), q:h.q, costPx:h.px, price:price, value:value, cost:cost,
      day:ch.abs != null ? ch.abs * h.q : null, dayPct:ch.pct,
      ret:cost ? (value - cost) : 0, retPct:cost ? (value / cost - 1) * 100 : 0,
      sector:sectorOf(s) || 'Other', cur:currencyOf(s)
    };
  });
  var total = rows.reduce(function(a, r){ return a + r.value; }, 0);
  var cost = rows.reduce(function(a, r){ return a + r.cost; }, 0);
  var day = rows.reduce(function(a, r){ return a + (r.day || 0); }, 0);
  return { rows:rows, total:total, cost:cost, day:day, ret:total - cost, retPct:cost ? (total / cost - 1) * 100 : 0 };
}

    }).join('');
    html += '<div class="tbl-wrap" style="margin-top:8px"><table class="fh"><thead>' + th + '</thead><tbody>' +
      (body || '<tr><td colspan="9" class="empty">No holdings yet. Add one, import a CSV, or let AI draft a portfolio.</td></tr>') + '</tbody></table></div>';
    html += '<div class="movers-note">Positions live in this browser only. Quotes delayed; cost basis is whatever you enter.</div></div>';

    var bySector = {};
    st.rows.forEach(function(r){ bySector[r.sector] = (bySector[r.sector] || 0) + r.value; });
    var parts = Object.keys(bySector).map(function(k){ return { label:k, v:bySector[k] }; });
    var maxS = Math.max.apply(null, parts.map(function(p){ return p.v; }).concat([1]));
    html += '<div class="section"><div class="grid-2">' +
      '<div class="card"><h3>Allocation by sector</h3><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:10px">' +
      donutSVG(parts) + '<div style="flex:1;min-width:200px">' +
      parts.sort(function(a, b){ return b.v - a.v; }).map(function(p){
        return '<div class="bar-row" style="grid-template-columns:110px 1fr 92px"><span>' + esc(p.label) + '</span>' +
          '<span class="track"><i style="width:' + (p.v / maxS * 100).toFixed(1) + '%;background:var(--fh-chart-blue)"></i></span>' +
          '<span class="val num">' + num(p.v / (st.total || 1) * 100, 1) + '%</span></div>';
      }).join('') + '</div></div></div>' +
      '<div class="card"><h3>Concentration</h3>' + concentrationHTML(st) + '</div>' +
      '</div></div>';
    html += footerHTML();
    $('main').innerHTML = html;
  });
}

function statCard(label, value, sub, cls){
  return '<div class="card"><div class="mut" style="font-size:12.5px">' + esc(label) + '</div>' +
    '<div class="num ' + (cls || '') + '" style="font-size:24px;margin:6px 0 2px">' + esc(value) + '</div>' +
    '<div class="mut num" style="font-size:12.5px">' + esc(sub) + '</div></div>';
}

function concentrationHTML(st){
  if(!st.rows.length) return '<div class="empty">Add holdings to see concentration.</div>';
  var sorted = st.rows.slice().sort(function(a, b){ return b.value - a.value; });
  var top = sorted[0], top3 = sorted.slice(0, 3).reduce(function(a, r){ return a + r.value; }, 0);
  var hhi = sorted.reduce(function(a, r){ var w = r.value / (st.total || 1); return a + w * w; }, 0);
  var heat = sorted.slice(0, 12).map(function(r){
    var p = r.retPct;
    var bg = p >= 0 ? 'rgba(31,139,26,' + clamp(0.15 + Math.abs(p) / 40, 0.15, 0.9) + ')' : 'rgba(227,41,53,' + clamp(0.15 + Math.abs(p) / 40, 0.15, 0.9) + ')';
    return '<div class="h" style="background:' + bg + '"><b>' + esc(r.s) + '</b><span class="p">' + pct(p) + '</span></div>';
  }).join('');
  return '<div class="heat">' + heat + '</div>' +
    '<div class="kv-inline" style="margin-top:14px">' +
    '<span>Largest: <b>' + esc(top.s) + '</b> ' + num(top.value / (st.total || 1) * 100, 1) + '%</span>' +
    '<span>Top 3: <b>' + num(top3 / (st.total || 1) * 100, 1) + '%</b></span>' +
    '<span>HHI: <b>' + num(hhi, 3) + '</b></span></div>' +
    '<div class="mut" style="font-size:12px;margin-top:8px">Tile colour shows total return per position.</div>';
}

/* Donut of the top 10. Slices are revealed by a mask sweeping clockwise; hover pops a slice outward. */
function guruPie(top){
  var S = 340, cx = S / 2, R = 150, r = 88, tot = top.reduce(function(a, h){ return a + h.w; }, 0) || 1, a0 = -Math.PI / 2, paths = [];
  var pt = function(rad, a){ return (cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cx + rad * Math.sin(a)).toFixed(2); };
  top.forEach(function(h, i){
    var a1 = a0 + h.w / tot * Math.PI * 2, mid = (a0 + a1) / 2, big = a1 - a0 > Math.PI ? 1 : 0;
    if(a1 - a0 >= Math.PI * 2 - 1e-6) a1 -= 1e-4;   // a single 100% slice still needs two distinct arc ends
    paths.push('<path class="gu-slice" data-gi="' + i + '" style="--dx:' + (Math.cos(mid) * 10).toFixed(1) + 'px;--dy:' + (Math.sin(mid) * 10).toFixed(1) + 'px" fill="var(--gp' + (i + 1) + ')" d="M' + pt(R, a0) +
      ' A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + pt(R, a1) + ' L' + pt(r, a1) + ' A' + r + ' ' + r + ' 0 ' + big + ' 0 ' + pt(r, a0) + ' Z"/>');
    a0 = a1;
  });
  var mr = (R + 14) / 2, C = (2 * Math.PI * mr).toFixed(1);
  var svg = '<svg class="gu-pie" id="guPie" width="' + S + '" height="' + S + '" viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="Top 10 holdings by weight">' +
    '<defs><mask id="guMask"><circle class="gu-sweep" cx="' + cx + '" cy="' + cx + '" r="' + mr + '" fill="none" stroke="#fff" stroke-width="' + (R + 14) +
    '" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '" transform="rotate(-90 ' + cx + ' ' + cx + ')"/></mask></defs>' +
    '<g mask="url(#guMask)">' + paths.join('') + '</g>' +
    '<g class="ctr" id="guCtr"><text x="' + cx + '" y="' + (cx - 6) + '" text-anchor="middle" font-size="30" font-weight="500" fill="var(--fh-foreground-on-surface-emphasis)">' + num(tot, 1) + '%</text>' +
    '<text x="' + cx + '" y="' + (cx + 18) + '" text-anchor="middle" font-size="12.5" fill="var(--fh-foreground-on-surface-de-emphasis)">of portfolio in top 10</text></g></svg>';
  var leg = top.map(function(h, i){
    var tag = h.t ? 'a href="' + guruHref(h) + '"' : 'div';
    return '<' + tag + ' class="gu-leg" data-gi="' + i + '" style="--d:' + (300 + i * 45) + 'ms"><span class="sw" style="background:var(--gp' + (i + 1) + ')"></span>' + guruLogo(h) +
      '<span class="tk">' + esc(h.t || '—') + '</span><span class="cn">' + esc(h.n) + guruPc(h) + '</span><span class="wt num">' + num(h.w, 2) + '%</span></' + tag.split(' ')[0] + '>';
  }).join('');
  return '<div class="gu-pie-wrap">' + svg + '<div class="gu-legend">' + leg + '</div></div>';
}

/* New buys / Added / Trimmed / Sold out, each ranked by the dollar size of the move. */
function guruMovesHTML(d){
  if(!d.prev) return d.holdings.length ? '<div class="section"><div class="card"><h3>Quarter moves</h3><div class="gu-sub">' +
    esc(d.source) + ' is an annual disclosure, so there is no quarter-over-quarter comparison.</div></div></div>' : '';
  var col = { new:[], add:[], trim:[] };
  d.holdings.forEach(function(h){
    var m = guruMove(h); if(!m || !col[m.k]) return;
    var amt = m.k === 'new' || m.p == null ? h.v : Math.abs(h.s - h.ps) / h.s * h.v;   // value of the shares bought or sold, at this period's price
    col[m.k].push({ h:h, m:m, amt:amt });
  });
  var sold = (d.sold || []).map(function(h){ return { h:h, m:{ k:'sold' }, amt:h.v }; });
  var list = function(title, rows, cls, sub){
    rows.sort(function(a, b){ return b.amt - a.amt; });
    var body = rows.slice(0, 6).map(function(r, k){
      var tag = r.h.t ? 'a href="' + guruHref(r.h) + '"' : 'div';
      return '<' + tag + ' class="gu-mv" style="--d:' + (k * 45) + 'ms">' + guruLogo(r.h) + '<span class="mt"><b>' + esc(r.h.t || r.h.n) + '</b>' + guruPc(r.h) +
        '<span>' + esc(r.h.n) + '</span></span><span class="ma ' + cls + '">' + sub(r) + '</span></' + tag.split(' ')[0] + '>';
    }).join('') || '<div class="gu-sub" style="padding:8px 4px">None</div>';
    return '<div class="gu-mvcol"><div class="gu-mvh"><span>' + title + '</span><span class="num">' + rows.length + '</span></div>' + body +
      (rows.length > 6 ? '<div class="gu-sub" style="padding:6px 4px">+' + (rows.length - 6) + ' more</div>' : '') + '</div>';
  };
  var usd = function(v){ return '$' + compact(v); };
  return '<div class="section"><div class="card"><div class="section-head" style="margin:0 0 4px"><h3 style="flex:1;margin:0">Quarter moves</h3>' +
    '<span class="gu-sub">' + esc(guruPrevLabel(d)) + ' → ' + esc(guruPeriod(d)) + '</span></div><div class="gu-mvs">' +
    list('New buys', col.new, 'up', function(r){ return usd(r.h.v) + '<small>' + num(r.h.w, 2) + '%</small>'; }) +
    list('Added', col.add, 'up', function(r){ return (r.m.p == null ? 'Added' : '+' + num(r.m.p, 0) + '%') + '<small>' + (r.m.p == null ? num(r.h.w, 2) + '%' : '+' + usd(r.amt)) + '</small>'; }) +
    list('Trimmed', col.trim, 'dn', function(r){ return '−' + num(Math.abs(r.m.p), 0) + '%<small>−' + usd(r.amt) + '</small>'; }) +
    (d.source === '13F-HR' ? list('Sold out', sold, 'dn', function(r){ return usd(r.h.v) + '<small>was ' + num(r.h.w, 2) + '%</small>'; }) : '') +
    '</div><div class="movers-note">Share counts compared with the ' + esc(guruPrevLabel(d)) + ' filing. Dollar moves use this period\'s prices. ' +
    'A ticker or CUSIP change after a merger or spin-off can show up as one sale and one new buy.</div></div></div>';
}

function guruRows(hs, q){
  q = (q || '').trim().toLowerCase();
  var max = hs[0] ? hs[0].w : 1, out = [], shown = 0;
  hs.forEach(function(h, i){
    if(q && (h.t || '').toLowerCase().indexOf(q) < 0 && (h.n || '').toLowerCase().indexOf(q) < 0) return;
    var tag = h.t ? 'a href="' + guruHref(h) + '"' : 'div';
    out.push('<' + tag + ' class="gu-row" data-gi="' + i + '"><span class="rk">' + (i + 1) + '</span>' + guruLogo(h) +
      '<span class="tk">' + esc(h.t || '—') + '</span><span class="cn">' + guruPc(h) + esc(h.n) + '</span>' +
      '<span class="gu-bar"><i style="--w:' + Math.max(0.6, h.w / max * 100).toFixed(2) + '%;--d:' + Math.min(shown, 30) * 25 + 'ms' + (i < 10 ? ';--bc:var(--gp' + (i + 1) + ')' : '') + '"></i></span>' +
      guruChip(guruMove(h)) + '<span class="wt num">' + num(h.w, h.w < 0.1 ? 3 : 2) + '%</span><span class="vl">$' + compact(h.v) + '</span></' + tag.split(' ')[0] + '>');
    shown++;
  });
  return out.join('') || '<div class="empty">No holdings match “' + esc(q) + '”.</div>';
}

function guruShares(n){ return compact(n).replace(/\.00(?=[KMB]?$)/, ''); }
function guruTipMove(h){
  var m = guruMove(h); if(!m) return '';
  var t = m.k === 'new' ? 'New position this period' : m.k === 'same' ? 'No change in shares' :
    (m.k === 'add' ? 'Added' : 'Trimmed') + (m.p == null ? ' this period' : ' ' + num(Math.abs(m.p), 1) + '% · ' + guruShares(h.ps) + ' → ' + guruShares(h.s) + ' shares');
  return '<div class="mv ' + (m.k === 'trim' ? 'dn' : m.k === 'same' ? '' : 'up') + '">' + t + '</div>';
}

/* One floating bubble for pie slices, legend rows and list rows. */
function guruHover(box, hs){
  var tip = $('guTip');
  if(!tip){ tip = document.createElement('div'); tip.id = 'guTip'; tip.className = 'gu-tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip); }
  var cur = -1, pie = $('guPie');
  var mark = function(i){
    if(!pie) return;
    pie.classList.toggle('hov', i >= 0);
    $$('.gu-slice', pie).forEach(function(s){ s.classList.toggle('on', +s.getAttribute('data-gi') === i); });
    $$('.gu-leg', box).forEach(function(s){ s.classList.toggle('on', +s.getAttribute('data-gi') === i); });
  };
  box.onmousemove = function(ev){
    var el = ev.target.closest && ev.target.closest('[data-gi]');
    if(!el || !box.contains(el)){ box.onmouseleave(); return; }
    var i = +el.getAttribute('data-gi'), h = hs[i];
    if(i !== cur){
      cur = i; mark(i);
      tip.innerHTML = '<div class="hd">' + guruLogo(h) + '<div><div class="tk">' + esc(h.t || 'No ticker') + guruPc(h) + '</div><div class="cn">' + esc(h.n) + '</div></div></div>' +
        '<div class="w">' + num(h.w, h.w < 0.1 ? 3 : 2) + '% <small>of portfolio · #' + (i + 1) + '</small></div>' +
        '<div class="ln">Value $' + compact(h.v) + (h.s ? ' · ' + guruShares(h.s) + ' shares' : '') + '</div>' + guruTipMove(h);
      tip.classList.remove('on'); void tip.offsetWidth; tip.classList.add('on');
    }
    var x = ev.clientX + 16, y = ev.clientY - tip.offsetHeight - 12;
    if(x + tip.offsetWidth > innerWidth - 8) x = ev.clientX - tip.offsetWidth - 16;
    if(y < 8) y = ev.clientY + 18;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  };
  box.onmouseleave = function(){ cur = -1; mark(-1); tip.classList.remove('on'); };
}

/* "Under x" / "Over x" ladder. v = [tvValue, label, finvizToken]. */
function scLadder(field, fv, vals, pos){
  var u = vals.map(function(v){ return ['Under ' + v[1], [scC(field, 'less', v[0])].concat(pos ? [scC(field, 'greater', 0)] : []), fv && fv + '_u' + v[2]]; });
  var o = vals.map(function(v){ return ['Over ' + v[1], [scC(field, 'greater', v[0])], fv && fv + '_o' + v[2]]; });
  return u.concat(o);
}
function scV(list, fmt, mult){ return list.map(function(x){ return [x * (mult || 1), fmt(x), String(x)]; }); }

function scK(x){ return x >= 1000 ? (x / 1000) + 'M' : x + 'K'; }
function scM(x){ return x >= 1000 ? (x / 1000) + 'B' : x + 'M'; }
/* Positive / negative plus a percent ladder: growth, margins, returns. */
function scSigned(field, fv, vals){
  return [['Positive (>0%)', [scC(field, 'greater', 0)], fv && fv + '_pos'], ['Negative (<0%)', [scC(field, 'less', 0)], fv && fv + '_neg']]
    .concat(scLadder(field, fv, scV(vals, scPct)));
}
function scEq(field, val, fv){ return [val, [scC(field, 'equal', val)], fv]; }
function scBool(list){ return list.map(function(x){ return [x[0], [scC(x[1], 'equal', 1)], x[2]]; }); }

    var doc = new DOMParser().parseFromString(html, 'text/html');

function scrFmt(kind, v, d){

  if(kind === 'chg'){ var c = d.close, p = d.change; v = (c != null && p != null) ? c - c / (1 + p / 100) : null; }
  if(v == null || !isFinite(v)) return '—';

  if(kind === 'px') return money(v, 'USD');
  if(kind === 'chg') return (v >= 0 ? '+' : '') + num(v, 2);
  if(kind === 'pct') return num(v, 2) + '%';

function insUrl(sym){
  return 'http://openinsider.com/screener?s=' + encodeURIComponent(sym) +
    '&fd=730&xp=1&xs=1&xa=1&xd=1&xg=1&xf=1&xm=1&xx=1&xc=1&xw=1&cnt=1000&page=1';
}
/* serve.py's /api/insiders (openinsider_scraper.py: retries, paging, 30-min cache) first;
   the hosted static site has no such endpoint, so parse OpenInsider in the browser there. */
function insFetch(sym){
  return fetchJSON('/api/insiders?s=' + encodeURIComponent(sym), 30000).then(function(j){
    return (j.rows || []).map(function(r){
      return { filed:r.filed, d:r.trade_date, name:r.insider, title:r.title, type:r.trade_type, kind:r.kind,
               px:r.price, qty:r.qty, own:r.owned, dOwn:r.delta_own, val:r.value, url:r.filing_url };
    });
  }).catch(function(){ return fetchText(insUrl(sym), 25000).then(insParse); });
}
function insNum(t){ var v = parseFloat(String(t || '').replace(/[$,+%]/g, '')); return isFinite(v) ? v : null; }
function insParse(html){
  var t = new DOMParser().parseFromString(html, 'text/html').querySelector('table.tinytable');
  if(!t) return [];
  var seen = {};
  return [].slice.call(t.querySelectorAll('tbody tr')).map(function(tr){
    var c = tr.children;
    if(c.length < 12) return null;
    var tx = function(i){ return (c[i].textContent || '').replace(/\s+/g, ' ').trim(); };
    var a = c[1].querySelector('a'), code = tx(6).charAt(0);
    return { filed:tx(1).slice(0, 10), d:tx(2), name:tx(4), title:tx(5), type:tx(6).replace(/^[A-Z] - /, ''), kind:INS_KIND[code] || 'other',
             px:insNum(tx(7)), qty:insNum(tx(8)), own:insNum(tx(9)), dOwn:tx(10), val:insNum(tx(11)),
             url:a ? String(a.getAttribute('href') || '').replace(/^http:/, 'https:') : '' };
  }).filter(function(r){
    if(!r || !/^\d{4}-\d\d-\d\d$/.test(r.d)) return false;
    var k = [r.d, r.name, r.qty, r.px, r.own].join('|');   // joint filers repeat the same trade: count it once
    return seen[k] ? false : (seen[k] = 1);
  });
}

function insBindSearch(base){
  base = base || 'insiders';
  var f = $('insForm'), q = $('insQ'), box = $('insSug'), items = [], at = -1, timer = 0, seq = 0;
  if(!f) return;
  function pick(it){ INS.pickName = { s:it.sym, n:it.name }; go('#/' + base + '/' + encodeURIComponent(it.sym)); }
  function draw(){
    box.hidden = !items.length; q.setAttribute('aria-expanded', String(!!items.length));
    box.innerHTML = items.map(function(it, i){
      return '<button type="button" role="option" class="' + (i === at ? 'on' : '') + '" data-i="' + i + '" style="--d:' + (i * 30) + 'ms">' + guruLogo({ t:it.sym }) +
        '<b>' + esc(it.sym) + '</b><span>' + esc(it.name || '') + '</span><i>' + (it.kind === 'etf' ? 'ETF' : 'Stock') + '</i></button>';
    }).join('');
  }
  q.oninput = function(){
    var v = q.value.trim(), my = ++seq;
    clearTimeout(timer);
    if(!v){ items = []; at = -1; draw(); f.classList.remove('busy'); return; }
    timer = setTimeout(function(){
      f.classList.add('busy');
      searchSymbols(v).then(function(l){ if(my !== seq) return; f.classList.remove('busy'); items = l.filter(function(x){ return x.kind === 'stock'; }).concat(l.filter(function(x){ return x.kind !== 'stock'; })); at = items.length ? 0 : -1; draw(); });
    }, 180);
  };
  q.onkeydown = function(e){
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ if(!items.length) return; e.preventDefault(); at = (at + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; draw(); }
    else if(e.key === 'Escape'){ items = []; draw(); e.stopPropagation(); }
  };
  q.onblur = function(){ setTimeout(function(){ items = []; draw(); }, 150); };
  box.onmousedown = function(e){ var b = e.target.closest('[data-i]'); if(b){ e.preventDefault(); pick(items[+b.getAttribute('data-i')]); } };
  f.onsubmit = function(e){
    e.preventDefault();

    if(at >= 0 && items[at]) return pick(items[at]);
    if(/^[A-Z.\-]{1,6}$/.test(v)) return pick({ sym:v });

  };

/* serve.py's /api/filings (edgar_filings.py: cached EDGAR submissions, EX-99 press
   releases for earnings, clean text) first; without it, read EDGAR from the browser. */
var FIL = { sym:'', name:'', cik:0, rows:[], cat:'key', q:'', open:'', doc:null, find:'', hit:0 };
var FIL_CATS = [['key', 'Key filings'], ['earnings', 'Earnings'], ['annual', 'Annual'], ['quarterly', 'Quarterly'], ['current', 'Current'],
  ['proxy', 'Proxy'], ['owner', 'Ownership'], ['all', 'All']];
var FIL_FORM = { '10-K':'Annual report', '10-Q':'Quarterly report', '8-K':'Current report', '6-K':'Foreign issuer report',
  '20-F':'Annual report (foreign issuer)', '40-F':'Annual report (Canadian issuer)', 'DEF 14A':'Proxy statement', 'DEFA14A':'Additional proxy material',
  'S-1':'Registration statement', 'S-3':'Shelf registration', 'S-8':'Employee stock plan registration', 'S-4':'Merger registration', 'FWP':'Free writing prospectus', 'SD':'Conflict minerals report', '424B5':'Prospectus supplement',
  '3':'Initial insider ownership', '4':'Insider transaction', '5':'Annual insider ownership', '144':'Planned insider sale',
  'SC 13G':'Passive 5%+ stake', 'SC 13D':'Active 5%+ stake', 'SCHEDULE 13G':'Passive 5%+ stake', 'SCHEDULE 13D':'Active 5%+ stake',
  '11-K':'Employee plan annual report', 'ARS':'Annual report to shareholders', 'CORRESP':'Company letter to the SEC', 'UPLOAD':'SEC staff letter' };
var FIL_ITEM = { '1.01':'Material agreement', '1.02':'Agreement terminated', '2.01':'Acquisition or disposal', '2.02':'Quarterly results',
  '2.03':'New debt obligation', '2.05':'Restructuring costs', '2.06':'Impairment', '3.01':'Listing standards notice', '3.02':'Unregistered share sale',
  '4.01':'Auditor change', '4.02':'Prior financials unreliable', '5.01':'Change in control', '5.02':'Executive or director change',
  '5.03':'Charter or bylaw change', '5.07':'Shareholder vote results', '7.01':'Regulation FD disclosure', '8.01':'Other events' };
var FIL_WARN = { '2.06':1, '3.01':1, '4.01':1, '4.02':1 };   // items an investor should never miss
var FIL_ASK = [
  ['Summarize', 'Summarize this filing in plain English: what happened, the key numbers, and why it matters to a shareholder.'],
  ['What changed?', 'What is new or different here compared with what the company reported before? Call out changes in guidance, risks, accounting and tone.'],
  ['Red flags', 'Find what an investor could easily miss: red flags, unusual items, buried risks, related-party dealings, going-concern or restatement language. Quote the exact passages.'],
  ['Explain it simply', 'Explain the hardest parts of this filing to someone new to investing, with short examples.']
];

function filCat(r){
  var f = r.form;
  if(/^(10-K|20-F|40-F)/.test(f)) return 'annual';
  if(/^10-Q/.test(f)) return 'quarterly';
  if(/^(8-K|6-K)/.test(f)) return 'current';
  if(/^(DEF|DEFA|PRE|DEFM)\s?14/.test(f)) return 'proxy';
  if(/^(3|4|5|144|SC 13[DG]|SCHEDULE 13[DG])(\/A)?$/.test(f)) return 'owner';
  return 'other';
}
function filEarn(r){ return /^8-K/.test(r.form) && /2\.02/.test(r.items || ''); }
function filIn(r, cat){
  var c = filCat(r);
  return cat === 'all' || c === cat || (cat === 'earnings' && filEarn(r)) || (cat === 'key' && /annual|quarterly|current|proxy/.test(c));
}
function filItems(r){ return String(r.items || '').split(',').map(function(i){ return i.trim(); }).filter(function(i){ return FIL_ITEM[i]; }); }
function filTitle(r){
  var its = filItems(r);
  if(its.length) return its.map(function(i){ return FIL_ITEM[i]; }).join(' · ');
  var base = r.form.replace(/\/A$/, '');
  return FIL_FORM[r.form] || (FIL_FORM[base] ? FIL_FORM[base] + ' (amended)' : '') || r.description || r.form;
}
function filSize(b){ return !b ? '' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB'; }
function filRow(acc){ return FIL.rows.filter(function(r){ return r.accession === acc; })[0]; }
function filArch(r, doc, cik){ return 'https://www.sec.gov/Archives/edgar/data/' + (cik || FIL.cik) + '/' + r.accession.replace(/-/g, '') + '/' + (doc || r.primary_doc); }
function filRecent(){ var r = load('fh3_fil_recent', []); return Array.isArray(r) ? r : []; }

function filList(sym){
  return fetchJSON('/api/filings?s=' + encodeURIComponent(sym), 30000).catch(function(){
    return secCikFor(sym).then(function(cik10){
      return fetchJSON('https://data.sec.gov/submissions/CIK' + cik10 + '.json', 20000).then(function(d){
        var rc = (d.filings || {}).recent || {}, col = function(k, i, def){ return (rc[k] || [])[i] || def; };
        return { ticker:sym, cik:+cik10, name:d.name, filings:(rc.accessionNumber || []).map(function(a, i){
          return { accession:a, filing_date:col('filingDate', i, ''), form:col('form', i, ''), primary_doc:col('primaryDocument', i, ''),
                   description:col('primaryDocDescription', i, ''), report_date:col('reportDate', i, ''), items:col('items', i, ''), size:col('size', i, 0) };
        }) };
      });
    });
  });
}
/* Same block-aware text extraction as edgar_filings.html_to_text, for the no-server path. */
function filHtmlText(html){
  var d = new DOMParser().parseFromString(String(html).replace(/^\s*<DOCUMENT>[\s\S]*?<TEXT>/i, ''), 'text/html');
  d.querySelectorAll('script,style,ix\\:header').forEach(function(e){ e.remove(); });
  d.querySelectorAll('p,div,br,tr,li,h1,h2,h3,h4,h5,h6,table').forEach(function(e){ e.append('\n'); });
  d.querySelectorAll('td,th').forEach(function(e){ e.append(' '); });
  return (d.body ? d.body.textContent : '').replace(/[ \t ]+/g, ' ').replace(/ *\n */g, '\n').replace(/\n+/g, '\n').trim();
}
function filDoc(r, sym, cik){
  return fetchJSON('/api/filings/doc?s=' + encodeURIComponent(sym || FIL.sym) + '&acc=' + encodeURIComponent(r.accession), 60000).catch(function(){
    var url = filArch(r, null, cik);   // ponytail: no-server path reads the primary doc, not the EX-99 press release
    return fetchText(url, 30000).then(function(html){
      return { doc:r.primary_doc, url:url, text:/\.html?$/i.test(r.primary_doc) ? filHtmlText(html) : html,
               partial:/\.html?$/i.test(r.primary_doc) && !/<\/html>\s*$/i.test(html) };   // the public relay stops at ~2 MB
    });
  });
}

/* Split extracted text into display lines; "Item 7." alone on a line joins its title. */
function filLines(text){
  var raw = String(text || '').split('\n'), out = [];
  for(var i = 0; i < raw.length; i++){
    var t = raw[i].trim();
    if(!t) continue;
    if(/^item\s+\d+[a-c]?\.?$/i.test(t) && raw[i + 1] && raw[i + 1].length < 120){ t += ' ' + raw[i + 1].trim(); i++; }
    out.push({ t:t, h:t.length < 140 && /^(part\s+[iv]+\b|item\s+\d+[a-c]?[.:\s])/i.test(t) });
  }
  return out;
}
/* Jump list: last occurrence of each heading, so the table of contents doesn't win. */
function filSections(lines){
  var last = {};
  lines.forEach(function(l, i){ if(l.h && /^item/i.test(l.t)) last[l.t.toLowerCase().replace(/\s+/g, ' ')] = i; });
  return Object.keys(last).map(function(k){ return { i:last[k], t:lines[last[k]].t }; }).sort(function(a, b){ return a.i - b.i; });
}
/* What Marvell gets: the whole text when it fits, else risk factors + MD&A (where things hide). */
function filExcerpt(lines, max){
  var full = lines.map(function(l){ return l.t; }).join('\n');
  if(full.length <= max) return full;
  var secs = filSections(lines), part = function(re, cap){
    var s = secs.filter(function(x){ return re.test(x.t); }).pop();
    return s ? lines.slice(s.i).map(function(l){ return l.t; }).join('\n').slice(0, cap) : '';
  };
  var risk = part(/risk factors/i, max / 2), pick = [risk, part(/management.s discussion/i, max - risk.length)].filter(Boolean);   // MD&A gets what risk factors leave
  return pick.length ? pick.join('\n\n[…]\n\n') + '\n\n[Excerpt: risk factors and MD&A of a longer document]' : full.slice(0, max) + '\n[truncated]';
}

function filPaintList(){
  var counts = {};

function computeStats(){
  var sym = dispSym(CUR.sym);
  var h = DATA.hist['h3_' + sq(sym) + '_380'] || loadHistCache(sym, 380) || DATA.hist['q_' + sym + '_1Y'] || [];
  if(h.length > 200) DATA.hist['q_' + sym + '_1Y'] = h;
  var closes = h.map(function(r){ return r.c; });
  var vols = h.map(function(r){ return r.v || 0; }).filter(function(v){ return v > 0; });
  var stats = { hi52:null, lo52:null, avgVol:null, beta:null, ytd:null, ret1y:null };
  if(closes.length > 2){
    var yr = h.filter(function(r){ return Date.parse(r.d) > Date.now() - 365 * 864e5; });
    var yc = yr.length > 2 ? yr.map(function(r){ return r.c; }) : closes;
    stats.hi52 = Math.max.apply(null, yc);
    stats.lo52 = Math.min.apply(null, yc);
    stats.ret1y = (yc[yc.length - 1] / yc[0] - 1) * 100;
    var jan = new Date().getFullYear() + '-01-01', ytdBase = null;
    for(var i = 0; i < h.length; i++){ if(h[i].d >= jan){ ytdBase = h[i].c; break; } }
    if(ytdBase) stats.ytd = (closes[closes.length - 1] / ytdBase - 1) * 100;
  }
  if(vols.length){ var last = vols.slice(-63); stats.avgVol = last.reduce(function(a, b){ return a + b; }, 0) / last.length; }
  var idx = DATA.hist['h3_' + sq('SPY') + '_380'] || loadHistCache('SPY', 380);
  if(idx && idx.length > 30 && h.length > 30){
    var byDate = {}, idxByDate = {};
    h.forEach(function(r){ byDate[r.d] = r.c; });
    idx.forEach(function(r){ idxByDate[r.d] = r.c; });
    var dates = idx.map(function(r){ return r.d; }).filter(function(d){ return byDate[d]; });
    var ra = [], rb = [];
    for(var j = 1; j < dates.length; j++){
      ra.push(byDate[dates[j]] / byDate[dates[j - 1]] - 1);
      rb.push(idxByDate[dates[j]] / idxByDate[dates[j - 1]] - 1);
    }
    if(ra.length > 20){
      var ma = ra.reduce(function(x, y){ return x + y; }, 0) / ra.length;
      var mb = rb.reduce(function(x, y){ return x + y; }, 0) / rb.length;
      var cov = 0, varb = 0;
      for(var k2 = 0; k2 < ra.length; k2++){ cov += (ra[k2] - ma) * (rb[k2] - mb); varb += Math.pow(rb[k2] - mb, 2); }
      if(varb) stats.beta = cov / varb;
    }
  }
  Q.stats = stats;
  return stats;
}

  return list;
}

function paintQuotePanel(){
  var panel = $('tabPanel');
  if(!panel) return;
  var t = CUR.tab;
  if(t === 'overview') panel.innerHTML = overviewHTML();
  else if(t === 'analysis') panel.innerHTML = analysisHTML();
  else if(t === 'earnings') panel.innerHTML = earningsTabHTML();
  else if(t === 'financials') panel.innerHTML = financialsHTML();
  else if(t === 'holdings') panel.innerHTML = holdingsHTML();

function targetChartHTML(a, price, cur){
  if(!a.target || !price) return '<div class="empty">No consensus target available for this instrument yet. Enter one on the left to plot the range.</div>';
  var t = parseFloat(a.target), lo = parseFloat(a.lo), hi = parseFloat(a.hi);
  if(!isFinite(lo)) lo = Math.min(t, price); if(!isFinite(hi)) hi = Math.max(t, price);
  if(lo > hi){ var sw = lo; lo = hi; hi = sw; }
  var mn = Math.min(lo, price, t), mx = Math.max(hi, price, t), pad = (mx - mn || mx * .1 || 1) * .06;
  mn -= pad; mx += pad;
  var X = function(v){ return Math.max(0, Math.min(100, (v - mn) / (mx - mn) * 100)); };
  var lab = function(x){ return 'left:min(max(' + x.toFixed(2) + '%,18%),82%)'; };   // keep labels inside the card; the marker itself stays exact
  var up = (t / price - 1) * 100;
  return '<div class="tc">' +
    '<div class="tc-track"></div>' +
    '<div class="tc-band" style="left:' + X(lo).toFixed(2) + '%;width:' + Math.max(0.8, X(hi) - X(lo)).toFixed(2) + '%"></div>' +
    '<div class="tc-stem tc-up" style="left:' + X(price).toFixed(2) + '%"></div><i class="tc-dot tc-px" style="left:' + X(price).toFixed(2) + '%"></i>' +
    '<div class="tc-lab tc-top" style="' + lab(X(price)) + '"><span>Price</span><b class="num">' + money(price, cur) + '</b></div>' +
    '<div class="tc-stem tc-down" style="left:' + X(t).toFixed(2) + '%"></div><i class="tc-dot tc-tg" style="left:' + X(t).toFixed(2) + '%"></i>' +
    '<div class="tc-lab tc-bot" style="' + lab(X(t)) + '"><span>Avg target <em class="' + (up >= 0 ? 'up' : 'down') + '">' + pct(up, 1) + '</em></span><b class="num tc-gold">' + money(t, cur) + '</b></div>' +
    '</div>' +
    '<div class="tc-ends"><span>Low <b class="num">' + money(lo, cur) + '</b></span><span>High <b class="num">' + money(hi, cur) + '</b></span></div>';
}

  var all = [];
  rows.forEach(function(r){ r.slice(1).forEach(function(v){ if(isFinite(v)) all.push(Math.abs(v)); }); });
  var mx = Math.max.apply(null, all.concat([1]));
  var W = 1000, H = 240, padB = 46, padT = 10, groupW = (W - 40) / rows.length;
  var out = [];
  rows.forEach(function(r, gi){
    var vals = r.slice(1);
    var bw = (groupW - 18) / Math.max(1, vals.length);
    vals.forEach(function(v, i){
      var h = (Math.abs(v) / mx) * (H - padT - padB);
      var x = 20 + gi * groupW + i * bw;
      out.push('<rect x="' + x.toFixed(1) + '" y="' + (H - padB - h).toFixed(1) + '" width="' + Math.max(2, bw - 3).toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) +
        '" rx="2" fill="' + CHART_PALETTE[i % CHART_PALETTE.length] + '" opacity=".9"/>');
    });
    out.push('<text class="axis" x="' + (20 + gi * groupW + (groupW - 18) / 2) + '" y="' + (H - padB + 18) + '" text-anchor="middle">' + esc(String(r[0]).slice(0, 14)) + '</text>');
  });

}

function attImage(file){

      URL.revokeObjectURL(url);

    return file.arrayBuffer();

    return p.then(function(){

function attAdd(files){

    var p;
    if(/^image\/(png|jpeg|webp|gif)$/.test(t)){ if(f.size > 20e6){ toast(f.name + ' is over 20 MB'); return; } p = attImage(f); }
    else if(t === 'application/pdf' || /\.pdf$/i.test(f.name)){ if(f.size > 25e6){ toast(f.name + ' is over 25 MB'); return; } p = attPdf(f); }
    else if(/^text\//.test(t) || ATT_TEXT.test(f.name) || t === 'application/json'){

/* Bold ticker mentions in AI text: $NVDA, (NVDA), or a bare symbol from the instruments,

function tkrs(html){

  Object.keys(LISTS).forEach(function(k){ LISTS[k].syms.forEach(function(x){ known[dispSym(x)] = 1; }); });
  Object.keys(PFS).forEach(function(k){ (PFS[k].holdings || []).forEach(function(h){ if(h && h.s) known[dispSym(h.s)] = 1; }); });

/* Markdown tables, shared by the chat and Deep Research renderers: "| a | b |" blocks (with a |---| row) are pulled out of the

/* Candle loop: 3 candles; the right-hand one is live (body and wicks move, red or green) and locks when the next one arrives.
   Every candle has its own size: a few tall, the rest short. */
var TKC = { cs:[], shift:0, t:0 };
function tkcNew(o){ return { o:o, c:o, sz:Math.random() < .4 ? .95 + Math.random() * .35 : .38 + Math.random() * .32, v:(Math.random() - .5) * .2, wu:.04 + Math.random() * .08, wl:.04 + Math.random() * .08 }; }
function tkcStep(){
  var cs = TKC.cs, L = cs[cs.length - 1];
  L.v = L.v * .75 + (Math.random() - .5) * .42;   // momentum, so the body swings rather than jitters
  L.c = Math.max(.06, Math.min(.94, L.c + L.v)); if(L.c <= .06 || L.c >= .94) L.v = -L.v * .8;
  L.wu = Math.max(.02, Math.min(.34, L.wu + (Math.random() - .5) * .22));
  L.wl = Math.max(.02, Math.min(.34, L.wl + (Math.random() - .5) * .22));
  if(++TKC.t % 15 === 0){ cs.push(tkcNew(L.c)); cs.shift(); TKC.shift = 14; }   // ~1.6s: lock it, open the next at its close
  if(TKC.shift > 0) TKC.shift = Math.max(0, TKC.shift - 3.5);
  var H = 25, y = function(p){ return (1.5 + (1 - p) * H).toFixed(1); };
  var html = cs.map(function(k, i){
    var x = 7 + (i - 1) * 14 + TKC.shift, up = k.c >= k.o, col = up ? 'var(--fh-positive,#34a853)' : 'var(--fh-negative,#ea4335)';
    var f = function(p){ return k.o + (p - k.o) * k.sz; };
    var top = f(Math.max(k.o, k.c)), bot = f(Math.min(k.o, k.c)), hy = y(Math.min(1, top + k.wu * k.sz)), ly = y(Math.max(0, bot - k.wl * k.sz));
    var by = y(top), bh = Math.max(2, (top - bot) * H).toFixed(1), o = i === 0 ? Math.min(1, x / 7 + .2) : 1;
    return '<g opacity="' + Math.max(0, o) + '"><line x1="' + x + '" x2="' + x + '" y1="' + hy + '" y2="' + ly + '" stroke="' + col + '" stroke-width="1.1" stroke-linecap="round"/>' +
      '<rect x="' + (x - 2.5) + '" y="' + by + '" width="5" height="' + bh + '" rx="1.2" fill="' + col + '"/></g>';
  }).join('');
  [].forEach.call(document.querySelectorAll('.tk-candles'), function(svg){ svg.innerHTML = html; });
}
/* Shared by the Agent chat and Deep Research; the timers run while either needs them. */
function thinkStart(key){
  THINK.users[key] = 1;
  if(THINK.timer) return;
  THINK.i = 0;
  THINK.order = THINK_VERBS.slice().sort(function(){ return Math.random() - 0.5; });   // shuffled, no repeats until the list is exhausted
  var p = .5, seed = [];
  for(var q = 0; q < 4; q++){ var k = tkcNew(p); k.c = Math.max(.15, Math.min(.85, p + (Math.random() - .5) * .4)); p = k.c; seed.push(k); }
  TKC.cs = seed; TKC.shift = 0; TKC.t = 0; TKC.timer = null;
  THINK.ctimer = setInterval(tkcStep, 105);
  THINK.timer = setInterval(function(){
    THINK.i++;
    var vs = document.querySelectorAll('.tk-v');
    [].forEach.call(vs, function(v){ v.classList.add('out'); });
    setTimeout(function(){ [].forEach.call(document.querySelectorAll('.tk-v'), function(v){ v.textContent = thinkVerb() + '…'; v.classList.remove('out'); }); }, 220);
  }, 3000);
}
function thinkStop(key){
  delete THINK.users[key];
  if(Object.keys(THINK.users).length) return;
  clearInterval(THINK.timer); clearInterval(THINK.ctimer); THINK.timer = THINK.ctimer = null;
}
function aiPending(on){
  AI_BUSY = !!on;
  var ch = $('chat');
  if(on){ if(ch && !ch.querySelector('.think')){ ch.insertAdjacentHTML('beforeend', thinkHTML()); ch.scrollTop = ch.scrollHeight; } thinkStart('chat'); }
  else { if(ch){ var tr = ch.querySelector('.think'); if(tr) tr.remove(); } thinkStop('chat'); }
  var btn = $('runBtn');
  if(!btn) return;
  btn.disabled = !!on;
  btn.innerHTML = on ? '<span class="typing"><i></i><i></i><i></i></span>' : SEND_ARROW;
  btn.setAttribute('aria-label', on ? 'Thinking' : 'Send');
}

function aiRun(kind, question, opts){
  opts = opts || {};
  var agentRes = null;
  var spec = AI_KINDS[kind] || AI_KINDS.custom;
  if(!aiReady()){
    openDrawer();
    chatPush('assistant', 'I need an API key before I can answer. Press **Add API key** below, paste a key for your provider and Save. Keys are stored only in this browser.', { err:true, keyCta:true });
    return Promise.resolve(null);
  }
  openDrawer();
  var label = opts.silent ? '' : ('**' + spec.label + (CUR.view === 'quote' ? ' · ' + dispSym(CUR.sym) : '') + '**');
  var atts = ATT.slice(); ATT = []; attPaint();
  var attNote = atts.length ? '\n\n\ud83d\udcce ' + atts.map(function(a){ return a.name; }).join(', ') : '';
  if(opts.shown) chatPush('user', opts.shown + attNote);
  else if(question) chatPush('user', question + attNote);
  else if(label) chatPush('user', label.replace(/\*\*/g, '') + attNote);
  var prompt = opts.skill ? skillPromptFor(opts.skill, question) : spec.ask + (question ? (kind === 'learn' ? '\n\nRequest: ' : '\n\nQuestion: ') + question : '');
  var attImgs = atts.filter(function(a){ return a.kind === 'image'; });
  atts.filter(function(a){ return a.kind !== 'image'; }).forEach(function(a){ prompt += '\n\n--- ATTACHED FILE: ' + a.name + ' ---\n' + a.text; });
  aiPending(true);
  var agent = (kind === 'custom' || kind === 'deep'), deep = (kind === 'deep');
  var history = agent ? chatHistory() : [];
  var pre = deep && !agent ? fetchNews(question || dispSym(CUR.sym) + ' stock', 14).then(function(items){
    if(!items.length) return '';
    return 'Fresh headlines just fetched:\n' + items.map(function(i){ return '- ' + i.title + ' (' + i.src + ', ' + relTime(i.date) + ')'; }).join('\n');
  }).catch(function(){ return ''; }) : Promise.resolve('');
  return pre.then(function(extra){
    var content = agent ? prompt : prompt + (opts.noData ? '' : '\n\n--- DATA (the page the user has open) ---\n' + aiContext(extra, false));
    if(!agent) return aiCall([{ role:'user', content:content, images:attImgs }]);
    return MH.run({ mode:'chat', provider:KEYS.provider, model:KEYS.model, key:KEYS.key, effort:aiEffortKey(), system:aiSystem(true),
      history:history, user:content, images:attImgs, onStep:thinkStep }).then(function(r){ agentRes = r; return r.text; });
  }).then(function(text){
    if(kind === 'learn'){ skillDraftPush(text, opts.fromRs); return text; }
    var parsed = spec.json ? jsonFrom(text) : null;
    if(parsed){
      if(kind === 'sentiment'){
        Q.ai.sentimentLine = parsed.line || ('Outlook: ' + num(parsed.bullish, 1) + '% bullish · ' + num(parsed.bearish, 1) + '% bearish');
        Q.ai.bull = parsed.bullish; Q.ai.neutral = parsed.neutral; Q.ai.bear = parsed.bearish;
        Q.ai.bullPoints = parsed.bullPoints || []; Q.ai.bearPoints = parsed.bearPoints || [];
        chatPush('assistant', '**Outlook**\n' + Q.ai.sentimentLine + '\n\n**Bullish view**\n' + (Q.ai.bullPoints.map(function(p){ return '- ' + p; }).join('\n') || '- none stated') +
          '\n\n**Bearish view**\n' + (Q.ai.bearPoints.map(function(p){ return '- ' + p; }).join('\n') || '- none stated') + '\n\n_Not investment advice._');
      } else if(kind === 'bullbear'){
        Q.ai.bullPoints = parsed.bullPoints || []; Q.ai.bearPoints = parsed.bearPoints || [];
        chatPush('assistant', '**Bull case**\n' + Q.ai.bullPoints.map(function(p){ return '- ' + p; }).join('\n') +
          '\n\n**Bear case**\n' + Q.ai.bearPoints.map(function(p){ return '- ' + p; }).join('\n') + '\n\n' + (parsed.line || '') + '\n\n_Not investment advice._');
      } else if(kind === 'ratings'){
        var a = ANALYSIS[dispSym(CUR.sym)] = ANALYSIS[dispSym(CUR.sym)] || { rows:[] };
        ['buy', 'hold', 'sell'].forEach(function(k){ if(parsed[k] != null) a[k] = parsed[k]; });
        if(parsed.target != null) a.target = String(parsed.target);
        if(parsed.hi != null) a.hi = String(parsed.hi);
        if(parsed.lo != null) a.lo = String(parsed.lo);
        if(parsed.rows && parsed.rows.length) a.rows = parsed.rows;
        a.note = parsed.note || '';
        save('fh3_analysis', ANALYSIS);
        chatPush('assistant', '**Analyst view (AI-drafted — verify before use)**\n' + (parsed.note || '') +
          (parsed.rows && parsed.rows.length ? '\n\n' + parsed.rows.map(function(r){ return '- ' + r.who + ' · ' + r.rec + ' · ' + r.pt + ' (' + r.date + ')'; }).join('\n') : '\n\nNo individual rows returned.'));
        if(CUR.view === 'quote' && CUR.tab === 'analysis') paintQuotePanel();
      } else if(kind === 'estimates'){
        EST[dispSym(CUR.sym)] = { rows:parsed.rows || [] };
        save('fh3_est', EST);
        chatPush('assistant', (parsed.rows && parsed.rows.length) ? 'Drafted ' + parsed.rows.length + ' quarters into the estimates table — verify against the filings.' : 'I could not produce reliable estimates, so nothing was written.');
        if(CUR.view === 'quote' && CUR.tab === 'earnings') paintQuotePanel();
      } else if(kind === 'holdings'){
        Q.ai.holdings = parsed.holdings || [];
        chatPush('assistant', (parsed.holdings && parsed.holdings.length) ? 'Drafted ' + parsed.holdings.length + ' holdings rows (AI-drafted, verify with the fact sheet).' : 'This does not look like a fund, so no holdings were drafted.');
        if(CUR.view === 'quote' && CUR.tab === 'holdings') paintQuotePanel();
      } else if(kind === 'moments'){
        Q.ai.moments = parsed.moments || [];
        chatPush('assistant', (parsed.moments && parsed.moments.length) ? parsed.moments.map(function(m){ return '- **' + m.date + '** ' + m.text; }).join('\n') : 'No reliable moments found in the supplied data.');
        if(CUR.view === 'quote' && CUR.tab === 'earnings') paintQuotePanel();
      } else {
        chatPush('assistant', text);
      }
    } else {
      var body = text || '(empty response)';
      var extra = {};
      if(agentRes && agentRes.acts.length) extra.acts = agentRes.acts;
      if(agentRes && agentRes.sources.length) extra.sources = agentRes.sources;
      chatPush('assistant', body, extra);
      if(kind === 'summary'){ Q.ai.summary = text; }
    }
    if(kind === 'summary'){ Q.ai.summary = text; if(CUR.view === 'quote' && CUR.tab === 'overview') paintQuotePanel(); }
    if(kind === 'sentiment'){ if(CUR.view === 'quote' && CUR.tab === 'overview') paintQuotePanel(); }
    return text;
  }).catch(function(e){
    chatPush('assistant', 'Request failed: ' + (e && e.message ? e.message : e) +
      '\n\nCheck the key, the model name and whether the provider allows browser calls (OpenRouter, OpenAI, Anthropic with the browser header, Gemini, Groq, DeepSeek and OpenCode Go/Zen do).', { err:true });
    return null;
  }).then(function(v){
    thinkStep(null);
    aiPending(false);
    return v;
  });
}

/* Deep Research runs are saved here as they finish (and when stopped with partial output), so they survive reloads and work without the local server. */
var RLOG = load('fh3_rruns', []).filter(function(r){ return r && typeof r === 'object' && typeof r.id === 'string' && typeof r.report === 'string'; });
function rsLogSave(){
  var body = RS.report || RS.tokens || ''; if(!body.trim()) return;
  var id = RS.meta.runId || ('r' + (RS.t0 || Date.now()).toString(36));
  var rec = { id:id, ts:Date.now(), question:RS.question || '', focus:RS.focus.slice(), report:body, citations:RS.citations || [],
    rounds:RS.meta.rounds || 0, secs:RS.meta.elapsedSeconds != null ? RS.meta.elapsedSeconds : Math.round((Date.now() - (RS.t0 || Date.now())) / 1000), status:(RS.report && !RS.error) ? 'done' : 'partial' };
  RLOG = RLOG.filter(function(x){ return x.id !== id; }); RLOG.unshift(rec); RLOG = RLOG.slice(0, 40);
  while(RLOG.length > 1 && JSON.stringify(RLOG).length > 3e6) RLOG.pop();   // stay inside localStorage limits
  save('fh3_rruns', RLOG);
}

function pickFile(accept, cb){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  inp.style.display = 'none';
  inp.addEventListener('change', function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){ cb(String(rd.result), f.name); inp.remove(); };
    rd.readAsText(f);
  });
  document.body.appendChild(inp);
  inp.click();
}
function download(name, text){
  var blob = new Blob([text], { type:'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---- Memory: what Marvell knows about you ---------------------------------------
   One document kept with the account (ACCTS[email].memory; a signed-out visitor keeps one under fh3_memory).
   Profile, notes and research summaries are stored in it. Portfolios, watchlists and skills are read live from where
   they already live, so Memory is never out of date. The user edits it in Settings -> Memory; the agent reads it on
   every turn (it is in the system prompt) and edits it with the update_memory tool. */
var MEM_GUEST = load('fh3_memory', {});
function memDoc(){ var a = acct(); if(a){ if(!a.memory || typeof a.memory !== 'object') a.memory = {}; return a.memory; } return MEM_GUEST; }
function memSave(){ if(acct()) save('fh3_accts', ACCTS); else save('fh3_memory', MEM_GUEST); }
function memClean(t, n){ return String(t == null ? '' : t).replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, n || 300); }
function memProfile(){
  var a = acct(), d = memDoc(), t = a || d;

}
function memSetProfile(p){
  var a = acct(), d = memDoc(), t = a || d, yr = new Date().getFullYear(), done = [];
  if(p.nickname !== undefined){ d.nickname = memClean(p.nickname, 40); done.push('nickname'); }
  if(p.age !== undefined){ var n = parseInt(p.age, 10); if(p.age === null || p.age === ''){ if(!a){ t.age = null; done.push('age'); } } else if(n >= 13 && n <= 120){ t.age = n; done.push('age'); } }
  if(Array.isArray(p.roles)){ var r = p.roles.filter(function(x){ return ACCT_ROLES.indexOf(x) >= 0; }); if(r.length || !a){ t.roles = r; done.push('what you do'); } }
  if(p.since !== undefined){ var y = parseInt(p.since, 10); if(p.since === null || p.since === ''){ t.since = null; done.push('start year'); } else if(y >= 1950 && y <= yr){ t.since = y; done.push('start year'); } }
  d.updated = Date.now(); memSave(); if(a) acctRefresh();

/* One-paragraph summary of a Deep Research report, used until the user or the agent writes a better one. */
function memAutoSummary(r){
  var lines = String(r.report || '').split('\n').map(function(l){ return l.replace(/^#+\s*/, '').replace(/\*\*|`/g, '').replace(/\[(\d{1,3})\]/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\s+/g, ' ').trim(); })
    .filter(function(l){ return l.length > 40 && l.indexOf('|') < 0; });

  if(t.length > 360){ t = t.slice(0, 360); var i = Math.max(t.lastIndexOf('. '), t.lastIndexOf('; ')); t = (i > 120 ? t.slice(0, i + 1) : t.replace(/\s+\S*$/, '') + '…'); }
  return t;
}
function memResearch(){
  var sums = memDoc().rsum || {};

    var o = sums[r.id];

  });
}
function memApply(o, by){
  var d = memDoc(), act = String((o && o.do) || ''), bad = function(m){ return { ok:false, msg:'Not saved: ' + m }; };
  d.notes = Array.isArray(d.notes) ? d.notes : [];
  if(act === 'set_profile'){
    var p = {}; ['nickname', 'age', 'roles', 'since'].forEach(function(k){ if(o[k] !== undefined) p[k] = o[k]; });
    var done = Object.keys(p).length ? memSetProfile(p) : [];
    return done.length ? { ok:true, label:'profile (' + done.join(', ') + ')', msg:'Profile updated: ' + done.join(', ') + '.' } : bad('no valid profile field');
  }
  if(act === 'add_note'){
    var t = memClean(o.text, 300); if(t.length < 3) return bad('note is empty');
    if(d.notes.some(function(n){ return n.text.toLowerCase() === t.toLowerCase(); })) return bad('that note already exists');
    if(d.notes.length >= 40) return bad('40 notes is the limit; delete or edit an old one');
    var n = { id:'n' + Date.now().toString(36) + Math.floor(Math.random() * 36).toString(36), text:t, by:by, ts:Date.now() };
    d.notes.push(n); d.updated = Date.now(); memSave();
    return { ok:true, label:'note “' + t.slice(0, 60) + (t.length > 60 ? '…' : '') + '”', msg:'Note added (id ' + n.id + ').' };
  }
  if(act === 'edit_note' || act === 'delete_note'){
    var hit = d.notes.filter(function(x){ return x.id === o.id; })[0]; if(!hit) return bad('no note with that id');
    if(act === 'delete_note'){ d.notes = d.notes.filter(function(x){ return x !== hit; }); d.updated = Date.now(); memSave(); return { ok:true, label:'removed a note', msg:'Note deleted.' }; }
    var t2 = memClean(o.text, 300); if(t2.length < 3) return bad('note is empty');
    hit.text = t2; hit.by = by; hit.ts = Date.now(); d.updated = Date.now(); memSave();
    return { ok:true, label:'note “' + t2.slice(0, 60) + (t2.length > 60 ? '…' : '') + '”', msg:'Note updated.' };
  }
  if(act === 'set_research_summary'){
    var run = (RLOG || []).filter(function(r){ return r.id === o.id; })[0]; if(!run) return bad('no research run with that id');
    d.rsum = d.rsum || {}; var t3 = memClean(o.text, 500);
    if(t3) d.rsum[run.id] = { text:t3, by:by, ts:Date.now() }; else delete d.rsum[run.id];
    d.updated = Date.now(); memSave();
    return { ok:true, label:'research summary', msg:'Research summary ' + (t3 ? 'saved.' : 'reset to the automatic one.') };
  }
  return bad('unknown action');

function memAction(act, el){

      out.textContent = 'Sent. Thank you!';
    }).catch(function(e){ out.textContent = 'Couldn’t send (' + String(e.message || e).slice(0, 80) + '). Try again, or email ' + FB_TO + '.'; })
    .then(function(){ btn.disabled = false; });
}

/* ---- Task list + progress: planned when a run starts, ticked as the agent finishes each job ---- */
function rsPlan(){
  var t = [{ id:'scope', label:'Understand the question' }];
  if(rsFocusOn('auto')) t.push({ id:'gather', label:'Gather relevant sources' }, { id:'filter', label:'Filter noise from signal' }, { id:'check', label:'Cross-check key facts' });
  else RS_FOCUS.filter(function(x){ return x.id !== 'auto' && rsFocusOn(x.id); }).forEach(function(x){ t.push({ id:x.id, label:x.label === 'Auto' ? x.label : x.label, kw:x.kw }); });
  t.push({ id:'write', label:'Write the report' });
  RS.tasks = t.map(function(x){ return { id:x.id, label:x.label, kw:x.kw || null, st:'todo' }; });
  RS.cur = 0; RS.round = 0; RS.t0 = Date.now(); RS.planId = String(RS.t0); RS.tasks[0].st = 'active';
}
function rsTaskAdvance(to){   // everything before `to` is finished; `to` becomes the active job
  if(!RS.tasks || to <= RS.cur && RS.tasks[RS.cur].st === 'active') return;
  to = Math.min(to, RS.tasks.length - 1);
  for(var i = 0; i < to; i++) RS.tasks[i].st = 'done';
  if(RS.tasks[to].st !== 'done') RS.tasks[to].st = 'active';
  RS.cur = Math.max(RS.cur, to);
}
function rsTaskEvent(o){
  if(!RS.tasks) return;
  var n = RS.tasks.length;
  if(o.kind === 'round_start'){
    RS.round = o.round || (RS.round + 1);
    if(RS.round >= 1) rsTaskAdvance(Math.max(RS.cur, 1));          // scoping is done once research begins
    if(rsFocusOn('auto')){                                         // no topics to match: advance with the rounds
      var step = Math.min(n - 2, Math.floor((RS.round - 1) / 2) + 1);
      rsTaskAdvance(Math.max(RS.cur, step));
    }
  } else if(o.kind === 'tool_call' || o.kind === 'phase'){
    var hay = (o.name || '') + ' ' + (o.label || '') + ' ' + (o.args ? JSON.stringify(o.args) : '');
    for(var i = RS.tasks.length - 2; i >= 1; i--){
      if(RS.tasks[i].kw && RS.tasks[i].kw.test(hay)){ rsTaskAdvance(Math.max(RS.cur, i)); break; }
    }
    if(/answer|final|report|write/i.test((o.label || '') + (o.name || ''))) rsTaskAdvance(n - 1);
  } else if(o.kind === 'token' && RS.cur < n - 1 && RS.tokens.length > 200){
    rsTaskAdvance(n - 1);                                          // the report is being written
  }
}
function rsTaskFinish(ok){
  if(!RS.tasks) return;
  RS.tasks.forEach(function(t){ if(ok) t.st = 'done'; else if(t.st === 'active') t.st = 'todo'; });
  if(ok) RS.cur = RS.tasks.length - 1;
}
function rsProgress(){
  if(!RS.tasks) return 0;
  var done = RS.tasks.filter(function(t){ return t.st === 'done'; }).length, act = RS.tasks.some(function(t){ return t.st === 'active'; }) ? .5 : 0;
  return Math.min(1, (done + act) / RS.tasks.length);
}
function rsClock(ms){ var s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function rsLiveHTML(){
  if(!RS.tasks) return '<div id="rsLive" hidden></div>';
  return '<div id="rsLive" data-plan="' + RS.planId + '"><div class="rs-think"' + (RS.running ? '' : ' hidden') + '>' + (RS.running ? thinkHTML() : '') + '</div>' +
    '<div class="rs-prog' + (RS.running ? ' run' : '') + '" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="rsBar" style="width:' + Math.round(rsProgress() * 100) + '%"></i></div>' +
    '<div class="rs-pm"><span id="rsPm"></span><span id="rsEl"></span></div>' +

function rsLiveSync(){
  var live = $('rsLive'); if(!live || !RS.tasks) return;
  if(live.getAttribute('data-plan') !== RS.planId){ live.outerHTML = rsLiveHTML(); live = $('rsLive'); }   // new run: build the task list once
