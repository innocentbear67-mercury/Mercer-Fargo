/* ---- First-run tour: spotlight, bubble, arrow ---------------------------- */
#tour{position:fixed;inset:0;z-index:9999;pointer-events:none}
#tour .tr-shield{position:absolute;inset:0;pointer-events:auto}
#tour.pass .tr-shield{pointer-events:none}
#tour .tr-dim{position:absolute;inset:0;background:rgba(8,8,10,.62);opacity:0;transition:opacity .3s}
#tour.center .tr-dim{opacity:1}
#tour .tr-hole{position:absolute;border-radius:12px;box-shadow:0 0 0 100vmax rgba(8,8,10,.62);opacity:0;
  transition:top .38s cubic-bezier(.4,0,.2,1),left .38s cubic-bezier(.4,0,.2,1),width .38s cubic-bezier(.4,0,.2,1),height .38s cubic-bezier(.4,0,.2,1),opacity .25s}
#tour.has-target .tr-hole{opacity:1}
#tour .tr-hole::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:2px solid var(--fh-colors-and-accents-primary);animation:trPulse 1.6s ease-out infinite}
#tour .tr-bubble{position:absolute;box-sizing:border-box;width:330px;max-width:calc(100vw - 24px);padding:16px 18px 14px;border-radius:16px;pointer-events:auto;
  background:var(--fh-background-surface-elevated);color:var(--fh-foreground-on-surface-emphasis);border:1px solid var(--fh-border-stroke-default);
  box-shadow:0 12px 40px rgba(0,0,0,.45);opacity:0}
#tour .tr-bubble.in{animation:trIn .38s cubic-bezier(.2,.8,.2,1) both}
#tour .tr-step{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--fh-colors-and-accents-primary);margin-bottom:4px}
#tour .tr-title{font-family:var(--mf-serif);font-size:19px;line-height:26px;font-weight:500;margin:0 0 6px}
#tour .tr-text{font-size:14px;line-height:21px;color:var(--fh-foreground-on-surface-default);margin:0 0 14px}
#tour .tr-foot{display:flex;align-items:center;gap:8px}
#tour .tr-dots{display:flex;gap:5px;flex:1;min-width:0}
#tour .tr-dots i{width:6px;height:6px;border-radius:50%;background:var(--fh-border-stroke-default);transition:background .25s,transform .25s}
#tour .tr-dots i.on{background:var(--fh-colors-and-accents-primary);transform:scale(1.35)}
#tour .tr-dots i.done{background:var(--fh-colors-and-accents-primary);opacity:.55}
#tour .tr-arrow{position:absolute;width:28px;height:40px;color:var(--fh-colors-and-accents-primary);opacity:0;pointer-events:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
#tour .tr-arrow.show{opacity:1}
#tour .tr-arrow svg{display:block;width:100%;height:100%;animation:trNudge 1s ease-in-out infinite}
#tour .tr-arrow.up{transform:none}
#tour .tr-arrow.down{transform:rotate(180deg)}
#tour .tr-arrow.left{transform:rotate(-90deg)}
#tour .tr-arrow.right{transform:rotate(90deg)}
@keyframes trIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
@keyframes trPulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.07)}}
@keyframes trNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tr-note{font:inherit;font-size:13px;color:var(--fh-colors-and-accents-primary);background:none;border:0;padding:0;margin:-8px 0 14px;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.empty .tr-row{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){
  #tour .tr-hole,#tour .tr-dim{transition:none}
  #tour .tr-hole::after,#tour .tr-arrow svg,#tour .tr-bubble.in{animation:none;opacity:1}
}

.ins-hero h1{position:relative;font-family:var(--mf-serif);font-weight:500;font-size:clamp(32px,5vw,54px);line-height:1.06;margin:14px 0 12px;max-width:14ch;color:var(--fh-foreground-on-surface-emphasis)}
.ins-hero h1 em{color:var(--mf-gold)}
.ins-hero p{position:relative;max-width:54ch;margin:0 0 28px;font-size:15.5px;line-height:1.55;color:var(--fh-foreground-on-surface-default)}
.ins-deco{position:absolute;right:0;top:30px;width:min(560px,58%);opacity:.55;pointer-events:none}
.ins-deco path{fill:none;stroke:var(--mf-gold);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;animation:guSweep 2.2s .15s cubic-bezier(.3,.7,.2,1) forwards}
.ins-deco circle{transform-box:fill-box;transform-origin:center;animation:guPop .5s both;animation-delay:var(--d)}
.ins-deco .buy,.ins-chart .bub.buy{fill:var(--fh-positive)}
.ins-deco .sell,.ins-chart .bub.sell{fill:var(--fh-negative)}
:root:not([data-theme="dark"]) .ins-hero{background:linear-gradient(120deg,var(--mf-navy) 0%,#2d4a78 100%)}
:root:not([data-theme="dark"]) .ins-hero h1,:root:not([data-theme="dark"]) .ins-hero p,:root:not([data-theme="dark"]) .ins-recent>span{color:#fffdf7}
.ins-search{position:relative;z-index:3;flex:1;max-width:360px;min-width:220px}
.ins-search.big{max-width:660px}
.ins-search .box{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:21px;background:var(--fh-background-surface);
  border:1px solid var(--fh-border-stroke-emphasis);color:var(--fh-foreground-on-surface-de-emphasis);transition:border-color .2s,box-shadow .2s}
.ins-search.big .box{height:62px;padding:0 20px;border-radius:18px;box-shadow:var(--fh-elevation-3)}
.ins-search .box:focus-within{border-color:var(--mf-gold);box-shadow:0 0 0 4px rgba(193,165,120,.2),var(--fh-elevation-3)}
.ins-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fh-foreground-on-surface-emphasis);font-size:14px}
.ins-search.big input{font-size:18.5px}
.ins-search kbd{font:11px/1 inherit;padding:5px 7px;border-radius:6px;border:1px solid var(--fh-border-stroke-default);color:var(--fh-foreground-on-surface-de-emphasis)}
.ins-search:not(.big) kbd{display:none}
.ins-spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--mf-gold);border-right-color:transparent;opacity:0;animation:insSpin .7s linear infinite}
.ins-search.busy .ins-spin{opacity:1}
.ins-sug{position:absolute;left:0;right:0;top:calc(100% + 8px);padding:6px;border-radius:16px;background:var(--fh-background-surface);
  border:1px solid var(--fh-border-stroke-emphasis);box-shadow:var(--fh-elevation-3);max-height:380px;overflow:auto}
.ins-sug button{display:grid;grid-template-columns:28px 64px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 10px;border:0;border-radius:11px;
  background:transparent;color:inherit;text-align:left;font-size:14px;cursor:pointer;animation:guIn .3s both;animation-delay:var(--d)}
.ins-sug button.on,.ins-sug button:hover{background:var(--fh-states-neutral-hovered)}
.ins-sug button.on{box-shadow:inset 3px 0 0 var(--mf-gold)}
.ins-sug b{color:var(--fh-foreground-on-surface-emphasis)}
.ins-sug span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fh-foreground-on-surface-default)}
.ins-sug i{font-style:normal;font-size:11px;color:var(--fh-foreground-on-surface-de-emphasis)}
.search{position:relative}
.hs-sug{top:calc(100% + 6px);min-width:min(460px,92vw);z-index:60}
.bottombar .hs-sug{top:auto;bottom:calc(100% + 8px)}
.hs-sug button{grid-template-columns:28px 62px minmax(0,1fr) auto}
.hs-sug em{font-style:normal;text-align:right;font-size:13.5px;color:var(--fh-foreground-on-surface-emphasis);display:flex;flex-direction:column;line-height:1.2}
.hs-sug em small{font-size:11.5px;font-weight:600}
.hs-tag{font-size:10px;padding:1px 5px;border-radius:5px;background:var(--fh-background-surface-container);color:var(--fh-foreground-on-surface-de-emphasis);margin-left:4px}
.hs-clr{margin-left:auto;background:none;border:0;color:var(--fh-colors-and-accents-primary);font:inherit;font-size:11px;cursor:pointer;text-transform:none;letter-spacing:0}
.hs-hd{display:flex;align-items:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fh-foreground-on-surface-de-emphasis);padding:8px 10px 4px}
.ins-recent{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:22px}
.ins-recent>span{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--fh-foreground-on-surface-de-emphasis);margin-right:4px}
.ins-recent a{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:20px;background:var(--fh-background-surface);border:1px solid var(--fh-border-stroke-default);
  color:inherit;font-size:13px;animation:guIn .4s both;animation-delay:var(--d);transition:border-color .2s,transform .2s}
.ins-recent a:hover{border-color:var(--mf-gold);transform:translateY(-2px);text-decoration:none}
.ins-recent .gu-logo{width:24px;height:24px;border-radius:50%}
.ins-recent small{color:var(--fh-foreground-on-surface-de-emphasis);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-head{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-bottom:18px;animation:guIn .4s both}
.ins-head .ins-logo{width:64px;height:64px;border-radius:16px;font-size:20px}
.ins-id{flex:1;min-width:220px}
.ins-id h2{font-family:var(--mf-serif);font-size:30px;line-height:1.15;margin:0 0 2px;color:var(--fh-foreground-on-surface-emphasis)}
.ins-px{display:flex;gap:10px;align-items:baseline;margin-top:6px}
.ins-px span:first-child{font-size:24px;color:var(--fh-foreground-on-surface-emphasis)}
.ins-sumrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.ins-sum{flex:1;min-width:260px;margin:0;font-size:16px;line-height:1.55}
.ins-stats{margin:14px 0 16px}
.ins-stats .gu-stat{animation:guIn .45s both;animation-delay:var(--d)}
.ins-stats b.up{color:var(--fh-positive)} .ins-stats b.down{color:var(--fh-negative)}
.ins-meter{display:block;height:6px;margin:6px 0 6px;border-radius:3px;background:var(--fh-negative);overflow:hidden}
.ins-meter i{display:block;height:100%;width:var(--w);background:var(--fh-positive);transition:width .6s}
.ins-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:6px}
.ins-legend .gu-sub{margin-left:auto}
.ins-legend button{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:16px;border:1px solid var(--fh-border-stroke-default);background:transparent;
  color:var(--fh-foreground-on-surface-de-emphasis);font-size:12.5px;cursor:pointer;transition:all .2s}
.ins-legend button.on{color:var(--fh-foreground-on-surface-emphasis);border-color:var(--fh-border-stroke-emphasis)}
.ins-legend button i{width:10px;height:10px;border-radius:50%;opacity:.35;transition:opacity .2s}
.ins-legend button.on i{opacity:1}
.ins-legend .lg-close i{height:3px;width:14px;border-radius:2px;background:var(--mf-gold)}
.ins-legend .lg-buy i{background:var(--fh-positive)} .ins-legend .lg-sell i{background:var(--fh-negative)} .ins-legend .lg-other i{background:#8c8fa3}
.ins-chart{position:relative;min-height:230px}
.ins-chart svg{display:block;overflow:visible}
.ins-chart .gl{stroke:var(--fh-border-stroke-default);stroke-dasharray:2 4}
.ins-chart .ax{font-size:11px;fill:var(--fh-foreground-on-surface-de-emphasis);font-variant-numeric:tabular-nums}
.ins-chart .area{fill:url(#insFill);animation:guIn .9s both}
.ins-chart .ln{fill:none;stroke:var(--mf-gold);stroke-width:1.8;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:guSweep 1.2s cubic-bezier(.3,.7,.2,1) forwards}
.ins-chart .bub{fill-opacity:.78;stroke:var(--fh-background-surface);stroke-width:1.5;cursor:pointer;transform-box:fill-box;transform-origin:center;
  animation:guPop .45s both;animation-delay:var(--d);transition:transform .2s cubic-bezier(.2,.8,.2,1.4),fill-opacity .2s}
.ins-chart .bub.other{fill:#8c8fa3}
.ins-chart .bub:hover,.ins-chart .bub.hl{transform:scale(1.35);fill-opacity:1}
.ins-chart .bub.sel{stroke:var(--mf-gold);stroke-width:3;fill-opacity:1}
.ins-chart .xh{stroke:var(--fh-foreground-on-surface-de-emphasis);stroke-dasharray:3 3;opacity:0;pointer-events:none}
.ins-chart .xd{fill:var(--mf-gold);stroke:var(--fh-background-surface);stroke-width:2;opacity:0;pointer-events:none}
.ins-tip{position:absolute;z-index:5;pointer-events:none;min-width:180px;max-width:280px;padding:10px 12px;border-radius:12px;background:var(--fh-background-surface);
  border:1px solid var(--fh-border-stroke-emphasis);box-shadow:var(--fh-elevation-3);font-size:12.5px;opacity:0;transform:scale(.94);transition:opacity .12s,transform .15s}
.ins-tip.on{opacity:1;transform:none}
.ins-tip .td{color:var(--fh-foreground-on-surface-de-emphasis)}
.ins-tip .tp{font-size:20px;color:var(--fh-foreground-on-surface-emphasis)}
.ins-tip .tt{margin:8px 0 3px;font-weight:600}
.ins-tip .tt.buy{color:var(--fh-positive)} .ins-tip .tt.sell{color:var(--fh-negative)}
.ins-tip .tr{display:flex;justify-content:space-between;gap:12px;line-height:1.5}
.ins-tip .tr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-tip .mut{color:var(--fh-foreground-on-surface-de-emphasis)}
.ins-grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2.4fr);gap:16px;margin-top:16px;align-items:start}
.ins-who-axis{display:grid;grid-template-columns:1fr 1fr;font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:0 4px 4px}
.ins-who-axis .up{text-align:right}
.ins-who{display:grid;gap:5px;width:100%;padding:8px;border:0;border-radius:12px;background:transparent;color:inherit;text-align:left;cursor:pointer;
  animation:guIn .4s both;animation-delay:var(--d);transition:background .15s}
.ins-who:hover{background:var(--fh-states-neutral-hovered)}
.ins-who.on{background:var(--fh-states-neutral-hovered);box-shadow:inset 3px 0 0 var(--mf-gold)}
.ins-who .nm{display:flex;flex-direction:column;min-width:0;font-size:13px}
.ins-who .nm b{color:var(--fh-foreground-on-surface-emphasis);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-who small{font-size:11.5px;color:var(--fh-foreground-on-surface-de-emphasis);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-who .bars{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:8px}
.ins-who .bars>span{display:flex;background:var(--fh-border-stroke-default);overflow:hidden}
.ins-who .bars .s{justify-content:flex-end;border-radius:4px 0 0 4px}
.ins-who .bars .b{border-radius:0 4px 4px 0}
.ins-who .bars i{display:block;width:0;height:100%;animation:guBar .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d)}
.ins-who .s i{background:var(--fh-negative)} .ins-who .b i{background:var(--fh-positive)}
.ins-who .vv{display:flex;justify-content:space-between;font-size:11.5px}
.ins-tcard{min-width:0}
.ins-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.ins-tools input{flex:1;min-width:160px;max-width:280px;padding:8px 14px;border-radius:18px;border:1px solid var(--fh-border-stroke-emphasis);background:var(--fh-background-surface);color:inherit;font-size:13.5px}
.ins-csv{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.ins-pills{display:flex;gap:6px;flex-wrap:wrap}
.ins-pills button{padding:5px 10px;border-radius:14px;border:1px solid var(--mf-gold);background:rgba(193,165,120,.14);color:var(--fh-foreground-on-surface-emphasis);font-size:12.5px;cursor:pointer}
.ins-twrap{overflow-x:auto;margin:0 -4px}
.ins-table{width:100%;min-width:760px;border-collapse:separate;border-spacing:0 3px;font-size:13.5px}
.ins-table th{padding:0}
.ins-table th button{display:flex;align-items:center;gap:4px;width:100%;padding:8px 10px;border:0;background:transparent;color:var(--fh-foreground-on-surface-de-emphasis);
  font-size:12px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.ins-table th.n button{justify-content:flex-end}
.ins-table th button:hover,.ins-table th button.on{color:var(--fh-foreground-on-surface-emphasis)}
.ins-table th button i{width:0;height:0;border:4px solid transparent;opacity:0}
.ins-table th button.desc i{border-top-color:var(--mf-gold);margin-top:4px;opacity:1}
.ins-table th button.asc i{border-bottom-color:var(--mf-gold);margin-bottom:4px;opacity:1}
.ins-table td{padding:8px 10px;background:var(--fh-background-surface-container-de-emphasis,rgba(127,127,127,.06));vertical-align:middle;white-space:nowrap;transition:background .15s}
.ins-table td:first-child{border-radius:10px 0 0 10px;box-shadow:inset 3px 0 0 var(--k,transparent)}
.ins-table td:last-child{border-radius:0 10px 10px 0}
.ins-table tr{animation:guIn .35s both;animation-delay:var(--d)}
.ins-table tr.k-buy{--k:var(--fh-positive)} .ins-table tr.k-sell{--k:var(--fh-negative)} .ins-table tr.k-other{--k:#8c8fa3}
.ins-table tbody tr:hover td{background:var(--fh-states-neutral-hovered)}
.ins-table td.n{text-align:right;font-variant-numeric:tabular-nums}
.ins-table small{display:block;font-size:11.5px;color:var(--fh-foreground-on-surface-de-emphasis)}
.ins-table td.n small.down{color:var(--fh-negative)} .ins-table td.n small.up{color:var(--fh-positive)}
.ins-table .who{padding:0;border:0;background:none;color:var(--fh-foreground-on-surface-emphasis);font:inherit;font-weight:500;cursor:pointer}
.ins-table .who:hover{color:var(--mf-gold);text-decoration:underline}
.ins-pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;background:rgba(140,143,163,.18);color:var(--fh-foreground-on-surface-default)}
.ins-pill.buy{background:rgba(27,175,122,.16);color:var(--fh-positive)}
.ins-pill.sell{background:rgba(227,73,72,.16);color:var(--fh-negative)}
.ins-tfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
@keyframes insSpin{to{transform:rotate(360deg)}}
@media (max-width:900px){ .ins-grid{grid-template-columns:1fr} }
@media (max-width:760px){
  .ins-hero{padding:36px 18px 28px}
  .ins-deco{width:90%;opacity:.25}
  .ins-head .ins-search{max-width:none;flex-basis:100%}
  .ins-legend .gu-sub{display:none}
}
/* SEC filings */
.fil-deco rect{fill:var(--fh-background-surface);stroke:var(--mf-gold);stroke-width:1.5;opacity:.9}
.fil-deco g{animation:guIn .6s both;animation-delay:var(--d)}
.fil-deco path{stroke-width:3;stroke-linecap:round;opacity:.7}
.fil-ai{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;margin:0 0 14px;border-radius:16px;border:1px solid rgba(193,165,120,.45);
  background:linear-gradient(110deg,rgba(26,46,80,.55),transparent 70%);animation:guIn .45s both}
.fil-ai-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;color:var(--mf-gold);background:var(--mf-navy);box-shadow:inset 0 0 0 1px rgba(193,165,120,.5)}
.fil-ai-ic svg{animation:filTwinkle 3.2s ease-in-out infinite}
.fil-ai-t{flex:1;min-width:180px;display:flex;flex-direction:column;font-size:14px;color:var(--fh-foreground-on-surface-emphasis)}
.fil-ai-t small{font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis)}
.fil-ai-go{flex:0 0 auto}
.fil-ai.in{margin:0;border-radius:0;border-width:0 0 1px;padding:10px 16px}
.fil-ai.in .fil-ai-t{min-width:0;flex-basis:calc(100% - 50px)}
.fil-ai-q{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.fil-ai-q button{padding:5px 11px;border-radius:14px;border:1px solid var(--fh-border-stroke-emphasis);background:var(--fh-background-surface);color:var(--fh-foreground-on-surface-default);font-size:12.5px;cursor:pointer;transition:all .2s}
.fil-ai-q button:hover{border-color:var(--mf-gold);color:var(--fh-foreground-on-surface-emphasis);transform:translateY(-1px)}
.fil-tl{padding:14px 18px 30px;margin-bottom:14px}
.fil-tl-h{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;margin-bottom:18px;color:var(--fh-foreground-on-surface-emphasis)}
.fil-tl-h b{font-weight:500}
.fil-tl-k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis)}
.fil-tl-k i{width:8px;height:8px;border-radius:50%;margin-left:8px}
.fil-tl-track{position:relative;height:2px;margin:0 8px;background:var(--fh-border-stroke-default)}
.fil-tl-y{position:absolute;top:12px;transform:translateX(-50%);font-size:11px;color:var(--fh-foreground-on-surface-de-emphasis)}
.fil-tl-y::before{content:'';position:absolute;left:50%;top:-16px;height:10px;width:1px;background:var(--fh-border-stroke-emphasis)}
.fil-dot{position:absolute;top:1px;width:10px;height:10px;padding:0;border:2px solid var(--fh-background-surface);border-radius:50%;cursor:pointer;
  transform:translate(-50%,-50%);animation:guPop .4s both;animation-delay:var(--d);transition:transform .2s cubic-bezier(.2,.8,.2,1.4)}
.fil-dot.annual{width:15px;height:15px}
.fil-dot.earn{top:-10px}
.fil-dot.warn{top:12px}
.fil-tl-track{margin-top:6px}
.fil-dot:hover,.fil-dot.on{transform:translate(-50%,-50%) scale(1.5);z-index:2}
.fil-dot.on{box-shadow:0 0 0 2px var(--mf-gold)}
.fil-dot.annual,.fil-tl-k .annual{background:var(--mf-gold)}
.fil-dot.quarterly,.fil-tl-k .quarterly{background:#6f8fc7}
.fil-dot.earn,.fil-tl-k .earn{background:var(--fh-positive)}
.fil-dot.warn,.fil-tl-k .warn{background:var(--fh-negative)}
.fil-tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) scale(.9);min-width:150px;max-width:220px;padding:7px 10px;border-radius:10px;
  background:var(--fh-background-surface);border:1px solid var(--fh-border-stroke-emphasis);box-shadow:var(--fh-elevation-3);font-size:11.5px;line-height:1.35;
  color:var(--fh-foreground-on-surface-default);text-align:left;white-space:normal;pointer-events:none;opacity:0;transition:opacity .12s,transform .15s}
.fil-tip b{display:block;color:var(--fh-foreground-on-surface-emphasis);font-weight:600}
.fil-dot:hover .fil-tip{opacity:1;transform:translateX(-50%) scale(.67)}
.fil-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.fil-chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.fil-chips button{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:16px;border:1px solid var(--fh-border-stroke-default);
  background:transparent;color:var(--fh-foreground-on-surface-default);font-size:13px;cursor:pointer;transition:all .2s}
.fil-chips button span{font-size:11px;color:var(--fh-foreground-on-surface-de-emphasis)}
.fil-chips button:hover{border-color:var(--fh-border-stroke-emphasis)}
.fil-chips button.on{background:var(--fh-states-branded-medium-selected);color:var(--fh-foreground-on-highlight);border-color:transparent;font-weight:500}
.fil-chips button.on span{color:inherit;opacity:.75}
.fil-tools input{width:220px;max-width:100%;padding:8px 14px;border-radius:18px;border:1px solid var(--fh-border-stroke-emphasis);background:var(--fh-background-surface);color:inherit;font-size:13.5px}
.fil-split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start;scroll-margin-top:128px}
.fil.reading .fil-split{grid-template-columns:minmax(280px,.8fr) minmax(0,1.4fr)}
.fil-yr{display:flex;align-items:baseline;gap:8px;padding:16px 10px 6px;font-family:var(--mf-serif);font-size:20px;color:var(--fh-foreground-on-surface-emphasis)}
.fil-yr span{font-family:inherit;font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis)}
.fil-row{display:grid;grid-template-columns:52px 64px minmax(0,1fr) auto 52px;gap:12px;align-items:center;width:100%;padding:10px;border:0;border-radius:12px;
  background:transparent;color:inherit;text-align:left;font-size:13.5px;cursor:pointer;animation:guIn .35s both;animation-delay:var(--d);transition:background .15s,transform .2s}
.fil-row:hover{background:var(--fh-states-neutral-hovered);transform:translateX(3px)}
.fil-row.on{background:var(--fh-states-neutral-hovered);box-shadow:inset 3px 0 0 var(--mf-gold)}
.fil-row .fd,.fil-row .fs{font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis);font-variant-numeric:tabular-nums}
.fil-row .fs{text-align:right}
.fb{justify-self:start;padding:2px 8px;border-radius:7px;font-size:11.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap;
  background:rgba(140,143,163,.16);color:var(--fh-foreground-on-surface-default)}
.c-annual .fb{background:rgba(193,165,120,.2);color:var(--mf-gold)}
.c-quarterly .fb{background:rgba(111,143,199,.2);color:#8fa9d8}

/* ---------- System screens: loading, offline, data feeds down, 404 ---------- */
.sys{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;padding:24px;overflow:auto;text-align:center;
  background:radial-gradient(90% 70% at 50% 28%,var(--fh-background-surface) 0%,var(--fh-background-canvas) 72%);color:var(--fh-foreground-on-surface-default);

  background:radial-gradient(circle,var(--fh-border-stroke-emphasis) 1px,transparent 1.5px) 0 0/18px 18px;
  -webkit-mask:radial-gradient(60% 55% at 50% 45%,#000 0%,transparent 75%);mask:radial-gradient(60% 55% at 50% 45%,#000 0%,transparent 75%)}

const $ = (id) => document.getElementById(id);

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const ART = String.fromCharCode(0); // sentinel used by the tiny markdown renderer

function num(v, dp){
  if(v == null || !isFinite(v)) return '—';
  dp = dp == null ? 2 : dp;
  return Number(v).toLocaleString('en-US', { minimumFractionDigits:dp, maximumFractionDigits:dp });
}
function money(v, cur, dp){
  if(v == null || !isFinite(v)) return '—';
  var sym = !cur || cur === 'USD' ? '$' : (cur === 'SGD' ? 'S$' : (cur === 'EUR' ? '€' : (cur === 'GBP' ? '£' : '')));
  var dp2 = dp == null ? (v !== 0 && Math.abs(v) < 1 ? 4 : 2) : dp;
  return sym + num(v, dp2);
}
function pct(v, dp){
  if(v == null || !isFinite(v)) return '—';
  return (v >= 0 ? '+' : '') + num(v, dp == null ? 2 : dp) + '%';
}
function compact(v){
  if(v == null || !isFinite(v)) return '—';
  var a = Math.abs(v);
  if(a >= 1e12) return (v / 1e12).toFixed(2) + 'T';
  if(a >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if(a >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if(a >= 1e3) return (v / 1e3).toFixed(2) + 'K';
  return num(v, 2);
}
function chgFrom(q){
  if(!q || q.c == null) return { abs:null, pct:null };
  var base = (q.pc != null && isFinite(q.pc)) ? q.pc : q.o;
  if(base == null || !isFinite(base) || !base) return { abs:null, pct:null };
  return { abs:q.c - base, pct:(q.c / base - 1) * 100 };
}
function relTime(dateStr){
  var t = Date.parse(dateStr);
  if(!isFinite(t)) return '';
  var m = Math.round((Date.now() - t) / 60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + ' minutes ago';
  if(m < 1440) return Math.round(m / 60) + ' hours ago';
  var d = Math.round(m / 1440);
  return d === 1 ? 'yesterday' : d + ' days ago';
}
function dayLabel(d){
  var dt = typeof d === 'string' ? new Date(d + 'T00:00:00') : d;
  return dt.toLocaleDateString('en-US', { weekday:'short' }).slice(0,3).toUpperCase() + ' ' + dt.getDate();
}
function ymd(d){ return new Date(d).toISOString().slice(0, 10); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function debounce(fn, ms){ var t; return function(){ var a = arguments, self = this; clearTimeout(t); t = setTimeout(function(){ fn.apply(self, a); }, ms); }; }

var toastTimer;
function toast(msg, ms){
  var el = $('toast');

}

         '<circle cx="4" cy="6" r="6" fill="' + c + '"/>' + path + '</svg>';
}
function chgSpan(abs, p, opts){
  opts = opts || {};
  if(p == null || !isFinite(p)) return '<span class="mut">—</span>';
  var up = p >= 0;
  var cls = up ? 'up' : 'down';
  var txt = '';
  if(opts.abs !== false && abs != null && isFinite(abs)) txt += (abs >= 0 ? '+' : '') + num(abs, Math.abs(abs) < 1 ? 4 : 2) + ' ';
  txt += '(' + pct(p) + ')';
  if(opts.pctOnly) txt = pct(p);
  return '<span class="chg ' + cls + ' num">' + (opts.icon === false ? '' : arrowIcon(up)) + txt + '</span>';
}

function load(key, fallback){
  try{
    var v = localStorage.getItem(key); if(!v) return fallback;
    v = JSON.parse(v);
    // Stored data from an older version (or edited by hand) can have the wrong shape; a wrong type would blank the whole app, so fall back instead.
    var want = Array.isArray(fallback) ? 'array' : (fallback !== null && typeof fallback === 'object' ? 'object' : typeof fallback);
    var got = Array.isArray(v) ? 'array' : (v === null ? 'null' : typeof v);
    return (want === got || (fallback === null && v !== null)) ? v : fallback;
  }catch(e){ return fallback; }
}
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){   // usually "quota exceeded": say so once instead of silently losing the change
    if(!save.warned){ save.warned = true; try{ toast('Browser storage is full \u2014 changes may not be saved. Delete old chats or Research Log runs.', 6000); }catch(x){} }
  }
}

var PROXY_PATH = '/proxy?url=';
var proxyReady = null;          // null = unknown, true/false once probed

function canTryProxy(){ return proxyReady !== false && /^https?:$/.test(location.protocol); }

function fetchWithTimeout(url, ms, init){
  if(typeof AbortController === 'undefined') return fetch(url, init);
  var ctl = new AbortController();
  var t = setTimeout(function(){ ctl.abort(); }, ms || 12000);
  var opts = Object.assign({ signal:ctl.signal }, init || {});
  opts.headers = Object.assign({ 'Accept':'*/*' }, (init && init.headers) || {});
  return fetch(url, opts).then(function(r){ clearTimeout(t); return r; }, function(e){ clearTimeout(t); throw e; });
}

   everything else is fetched directly, which is faster and keeps the proxy

function fetchText(url, ms, init){
  var host = '';
  try{ host = new URL(url).hostname; }catch(e){ host = ''; }
  var attempts = [];
  if(/^\/(?!\/)/.test(url)){ attempts.push({ u:url, via:false }); return fetchWithTimeout(url, ms, init).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }); }   // our own server: one try, never relayed through third parties
  if(DIRECT_ONLY[host]){
    attempts.push({ u:url, via:false });
  } else if(PROXY_FIRST[host]){
    if(canTryProxy()) attempts.push({ u:PROXY_PATH + encodeURIComponent(url), via:true });
    attempts.push({ u:url, via:false });
  } else {
    attempts.push({ u:url, via:false });
    if(canTryProxy()) attempts.push({ u:PROXY_PATH + encodeURIComponent(url), via:true });
  }
  if(EDGE_HOSTS[host]) attempts.splice(attempts.length && attempts[0].via ? 1 : 0, 0, { u:OC_PROXY + '/api/fetch?u=' + encodeURIComponent(url), via:false });
  if(!DIRECT_ONLY[host]) attempts.push({ u:'https://api.allorigins.win/raw?url=' + encodeURIComponent(url), via:false });   // CORS-open sources never need a third-party relay
  var i = 0;
  function step(){
    if(i >= attempts.length) return Promise.reject(new Error('unreachable: ' + url));
    var a = attempts[i++];
    return fetchWithTimeout(a.u, a.u.indexOf('allorigins') > 0 ? Math.min(ms, 8000) : ms, init).then(function(r){
      if(!r.ok){ var er = new Error('HTTP ' + r.status); er.status = r.status; throw er; }
      return r.text();
    }).then(function(t){
      if(a.via) proxyReady = true;
      return t;
    }).catch(function(e){
      if(e && e.status === 404) throw e;   // the source answered "not found": relaying through other routes cannot change that
      if(a.via && proxyReady === null) proxyReady = false;

    });

}
function fetchJSON(url, ms, init){ return fetchText(url, ms, init).then(function(t){ return JSON.parse(t); }); }

/* Only used to POST (TradingView's market scan), which needs the proxy because
   the browser preflight is not answered by that endpoint. */
function fetchJSONPost(url, body, ms){
  if(!canTryProxy()) return Promise.reject(new Error('scan needs serve.py'));
  return fetchWithTimeout(PROXY_PATH + encodeURIComponent(url), ms, {
    method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body)
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function probeProxy(){
  if(!/^https?:$/.test(location.protocol)){ proxyReady = false; return Promise.resolve(false); }
  /* Ask the proxy for nothing: serve.py answers 400 with a JSON error, while a
     plain static server answers 404 with HTML. No upstream request is made. */
  return fetchWithTimeout('/proxy', 4000).then(function(r){
    return r.text().then(function(t){
      var j = null;
      try{ j = JSON.parse(t); }catch(e){ j = null; }
      proxyReady = (r.status === 200) || !!(j && typeof j.error === 'string');
      return proxyReady;
    });
  }).catch(function(){ proxyReady = false; return false; });
}

/* --- symbols ------------------------------------------------------------- */
function sq(sym){
  var s = String(sym || '').toUpperCase().trim();
  return s.replace(/[^A-Z0-9]/g, '_');
}
function dispSym(sym){
  var s = String(sym || '').toUpperCase().trim();
  return s.replace(/\.US$/, '');
}
function labelOf(sym){
  var s = dispSym(sym);
  if(INSTRUMENTS[s]) return INSTRUMENTS[s].n;
  for(var i = 0; i < UNIVERSE.length; i++) if(UNIVERSE[i][0] === s) return UNIVERSE[i][1];
  if(DATA.quotes[s] && DATA.quotes[s].name && DATA.quotes[s].name !== s) return DATA.quotes[s].name;
  var scr = DATA.screener && DATA.screener.bySym && DATA.screener.bySym[s];
  return (scr && scr.name) || s;
}
function shortOf(sym){
  var s = dispSym(sym);
  if(INSTRUMENTS[s] && INSTRUMENTS[s].short) return INSTRUMENTS[s].short;
  return labelOf(s);
}
function sectorOf(sym){
  var s = dispSym(sym);
  for(var i = 0; i < UNIVERSE.length; i++) if(UNIVERSE[i][0] === s) return UNIVERSE[i][2];
  return (DATA.summary[s] && DATA.summary[s].d && DATA.summary[s].d.Sector) || '';
}
function currencyOf(sym){
  var s = dispSym(sym);
  if(INSTRUMENTS[s] && INSTRUMENTS[s].cur) return INSTRUMENTS[s].cur;
  if(s.indexOf('/') > 0) return s.split('/')[1];   /* the pair is priced in the quote currency */
  if(/^\d/.test(s)) return 'SGD';
  return 'USD';
}
function isCrypto(s){ return !!CG[dispSym(s)]; }
function isFx(s){ return dispSym(s).indexOf('/') > 0; }
function numOf(v){
  if(v == null || v === '') return null;
  var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
  return isFinite(n) ? n : null;
}
function ymd(d){ return d.toISOString().slice(0, 10); }
function kindOf(sym){
  var inst = INSTRUMENTS[dispSym(sym)] || {};
  if(inst.k) return inst.k;
  for(var i = 0; i < UNIVERSE.length; i++){
    if(UNIVERSE[i][0] === dispSym(sym)){
      var t = UNIVERSE[i][2];

/* --- TradingView symbol resolution -------------------------------------- */
/* TradingView addresses instruments as EXCHANGE:TICKER (NASDAQ:AAPL,
   AMEX:SPY). Known symbols are seeded; anything else is probed once and then
   cached in local storage, so a symbol costs at most a few requests ever. */
var TV_SEED = {
  'SPY':'AMEX:SPY', 'DIA':'AMEX:DIA', 'QQQ':'NASDAQ:QQQ', 'IWM':'AMEX:IWM', 'VTI':'AMEX:VTI',
  'VGK':'AMEX:VGK', 'EWU':'AMEX:EWU', 'EWG':'AMEX:EWG', 'EWQ':'AMEX:EWQ', 'EWI':'AMEX:EWI', 'EWP':'AMEX:EWP',
  'EWJ':'AMEX:EWJ', 'MCHI':'NASDAQ:MCHI', 'INDA':'NASDAQ:INDA', 'EWY':'AMEX:EWY', 'EWT':'AMEX:EWT', 'EWA':'AMEX:EWA',
  'EWZ':'AMEX:EWZ', 'EWW':'AMEX:EWW', 'ILF':'AMEX:ILF', 'ECH':'AMEX:ECH',
  'GLD':'AMEX:GLD', 'SLV':'AMEX:SLV', 'USO':'AMEX:USO', 'CPER':'AMEX:CPER', 'UUP':'AMEX:UUP',
  'XLK':'AMEX:XLK', 'XLF':'AMEX:XLF', 'XLE':'AMEX:XLE', 'XLV':'AMEX:XLV', 'XLI':'AMEX:XLI',
  'XLP':'AMEX:XLP', 'XLY':'AMEX:XLY', 'XLU':'AMEX:XLU', 'XLB':'AMEX:XLB', 'XLRE':'AMEX:XLRE', 'XLC':'AMEX:XLC'
};
var TVMAP = Object.assign({}, TV_SEED, load('fh3_tvmap', {}));
function saveTVMap(){ save('fh3_tvmap', TVMAP); }
function tvCandidates(sym){
  var s = dispSym(sym);
  var out = [];
  var alt = s.indexOf('-') >= 0 ? s.replace('-', '.') : null;
  var bases = alt ? [s, alt] : [s];
  var kind = kindOf(sym);
  var order = kind === 'etf' ? ['AMEX', 'NASDAQ', 'NYSE'] : ['NASDAQ', 'NYSE', 'AMEX'];
  bases.forEach(function(b){
    order.forEach(function(ex){ out.push(ex + ':' + b); });
  });
  return out;
}
var TV_MISS = {};
function resolveTV(sym){
  var s = dispSym(sym);
  if(TVMAP[s]) return Promise.resolve(TVMAP[s]);
  if(isCrypto(s) || isFx(s)) return Promise.resolve(null);
  if(TV_MISS[s] && Date.now() - TV_MISS[s] < 600000) return Promise.resolve(null);   // known-bad symbol: don't re-probe for 10 minutes
  var list = tvCandidates(s);
  // Probe every exchange at once with a plain fetch (the endpoint allows browsers): an unknown symbol now fails in ~1s, not after a chain of retries.
  var probe = function(full){
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null, to = setTimeout(function(){ if(ctl) ctl.abort(); }, 7000);
    return fetch('https://scanner.tradingview.com/symbol?symbol=' + encodeURIComponent(full) + '&fields=close', { signal:ctl ? ctl.signal : undefined })
      .then(function(r){ return r.json(); }).then(function(j){ clearTimeout(to); if(!j || j.code || j.close == null){ var er = new Error('no symbol'); er.definitive = !!(j && j.code === 'symbol_not_exists'); throw er; } return full; }, function(e){ clearTimeout(to); throw e; });
  };
  return new Promise(function(resolve){
    var left = list.length, done = false, sure = 0;
    list.forEach(function(full){
      probe(full).then(function(f){ if(!done){ done = true; TVMAP[s] = f; saveTVMap(); resolve(f); } }, function(e){
        if(e && e.definitive) sure++;
        if(--left === 0 && !done){ done = true; if(sure === list.length) TV_MISS[s] = Date.now(); resolve(null); }   // only "not found" everywhere counts; a network failure is not a verdict
      });
    });
  });
}

function applyTV(sym, d){
  if(!d || d.code || d.close == null) return false;
  var s = dispSym(sym);
  var close = numOf(d.close);
  var chgPct = numOf(d.change);                        // percent, e.g. 0.911
  var prev = (close != null && chgPct != null) ? close / (1 + chgPct / 100) : null;
  var pre = numOf(d.premarket_close), post = numOf(d.postmarket_close);
  var extPrice = post != null ? post : pre;
  var extPct = post != null ? numOf(d.postmarket_change) : (pre != null ? numOf(d.premarket_change) : null);
  /* A pre/post price that has not moved away from the close is just the close:
     keep the regular session move instead of showing a noisy +0.00%. */
  if(extPrice != null && close != null && Math.abs(extPrice / close - 1) < 0.0001 && (extPct == null || Math.abs(extPct) < 0.005)){
    extPrice = null; extPct = null;
  }
  var extLabel = post != null ? 'After hours' : (pre != null ? 'Pre-market' : '');
  var price = extPrice != null ? extPrice : close;
  var pctv = extPrice != null && extPct != null ? extPct : chgPct;
  var abs = (price != null && prev != null) ? price - prev : null;
  DATA.quotes[s] = Object.assign({}, DATA.quotes[s], {
    c:price, pc:prev, ch:abs, pct:pctv, regClose:close,
    v:numOf(d.volume), shares:numOf(d.total_shares_outstanding), cur:'USD', src:'tradingview', ts:Date.now(),

    'Average Volume': d.average_volume_10d_calc != null ? compact(d.average_volume_10d_calc) : null,
    'Share Volume': d.volume != null ? compact(d.volume) : null,
    'EarningsPerShare': d.earnings_per_share_diluted_ttm,
    'PERatio': d.price_earnings_ttm,
    'Yield': d.dividends_yield != null ? d.dividends_yield / 100 : null,

    '1 Year Target': d.price_target_average != null ? money(d.price_target_average, 'USD') : null,
    'PriceTargetHigh': d.price_target_high,
    'PriceTargetLow': d.price_target_low,
    'Sector': d.sector, 'Industry': d.industry, 'Country': d.country,
    'Employees': d.employees != null ? compact(d.employees) : null,
    'Revenue': d.total_revenue != null ? compact(d.total_revenue) : null,
    'NetIncome': d.net_income != null ? compact(d.net_income) : null,
    'DebtToEquity': d.debt_to_equity, 'ROE': d.return_on_equity,
    'RecommendAll': d['Recommend.All'],
    'TargetMedian': d.price_target_median, 'AnalystMark': d.recommendation_mark, 'AnalystTotal': d.recommendation_total,
    'AnalystSB': d.recommendation_buy, 'AnalystB': d.recommendation_over, 'AnalystH': d.recommendation_hold, 'AnalystS': d.recommendation_under, 'AnalystSS': d.recommendation_sell,
    'NextEarnings': nextEarn ? new Date(nextEarn * 1000).toISOString().slice(0, 10) : null,
    'EPSForecastNextFQ': d.earnings_per_share_forecast_next_fq,
    'EPSForecastNextFY': d.earnings_per_share_forecast_next_fy,
    'RevenueForecastNextFY': d.revenue_forecast_next_fy != null ? compact(d.revenue_forecast_next_fy) : null,
    'TVSymbol': TVMAP[s] || null
  } };
  if(nextEarn){
    var iso = new Date(nextEarn * 1000).toISOString().slice(0, 10);
    var hit = EARNINGS.filter(function(e){ return dispSym(e.s) === s; })[0];
    if(!hit){ EARNINGS.push({ s:s, when:'Next report', date:iso, note:'from TradingView' }); save('fh3_earn', EARNINGS); }
    else if(hit.date !== iso && hit.note !== 'manual'){ hit.date = iso; hit.note = 'from TradingView'; save('fh3_earn', EARNINGS); }
  }
  return true;
}

function tvQuotes(symbols, concurrency){
  var list = symbols.slice(), i = 0, done = 0;
  if(!list.length) return Promise.resolve(0);
  var limit = Math.max(1, Math.min(concurrency || 5, list.length));
  function worker(){
    if(i >= list.length) return Promise.resolve();
    var sym = list[i++];
    return resolveTV(sym).then(function(full){
      if(!full) return false;
      return fetchJSON('https://scanner.tradingview.com/symbol?symbol=' + encodeURIComponent(full) + '&fields=' + TV_FIELDS, 12000)
        .then(function(d){ if(applyTV(sym, d)) done++; });
    }).catch(function(){}).then(function(){
      var d = dispSym(sym);
      if(!DATA.quotes[d] || DATA.quotes[d].c == null){
        return oaQuoteOne(sym).then(function(ok){ if(ok) done++; }, function(){});
      }
    }).then(worker);
  }
  var runners = [];
  for(var w = 0; w < limit; w++) runners.push(worker());
  return Promise.all(runners).then(function(){ return done; });
}

function fetchCrypto(symbols){
  var ids = symbols.map(function(s){ return CG[dispSym(s)]; }).filter(Boolean);
  if(!ids.length) return Promise.resolve(0);
  var url = 'https://api.coingecko.com/api/v3/simple/price?ids=' + ids.join(',') +
    '&vs_currencies=usd&include_24hr_change=true&include_24hr_vol=true';
  return fetchJSON(url, 12000).then(function(j){
    var n = 0;
    Object.keys(j).forEach(function(id){
      var d = j[id], sym = null;
      Object.keys(CG).forEach(function(k){ if(CG[k] === id) sym = k; });
      if(!sym) return;
      var pc = d.usd_24h_change != null ? d.usd / (1 + d.usd_24h_change / 100) : null;
      DATA.quotes[sym] = Object.assign({}, DATA.quotes[sym], {
        c:d.usd, pc:pc, ch:pc != null ? d.usd - pc : null, pct:d.usd_24h_change,
        cur:'USD', v:d.usd_24h_vol || 0, src:'coingecko', ts:Date.now(),
        name:labelOf(sym), state:'24/7 trading', ext:false, extLabel:''
      });
      n++;
    });
    return n;
  });
}

/* FX pairs come from Frankfurter (ECB reference rates, CORS friendly). */
function fetchFX(pairs){
  var list = pairs.filter(isFx);
  if(!list.length) return Promise.resolve(0);
  var bases = {};
  list.forEach(function(p){
    var a = p.split('/');
    bases[a[0]] = bases[a[0]] || [];
    if(bases[a[0]].indexOf(a[1]) < 0) bases[a[0]].push(a[1]);
  });
  return Promise.all(Object.keys(bases).map(function(base){
    return fetchJSON('https://api.frankfurter.dev/v1/latest?base=' + base + '&symbols=' + bases[base].join(','), 12000)
      .then(function(j){
        var n = 0;
        bases[base].forEach(function(quote){
          var rate = j.rates && j.rates[quote];
          if(!isFinite(rate)) return;
          var sym = base + '/' + quote, old = DATA.quotes[sym] || {};
          DATA.quotes[sym] = Object.assign({}, old, {
            c:rate, pc:old.c != null ? old.c : null, o:rate, h:rate, l:rate, v:0,
            cur:base, src:'frankfurter', ts:Date.now(), name:labelOf(sym),
            state:'ECB reference rate · ' + (j.date || ''), ext:false, extLabel:''
          });
          n++;
        });
        return n;
      }).catch(function(){ return 0; });
  })).then(function(arr){ return arr.reduce(function(a, b){ return a + b; }, 0); });
}

/* Universal quote entry: routes stocks/ETFs, crypto and FX. */
function fetchQuotes(symbols, concurrency){
  var list = [], seen = {};
  symbols.forEach(function(s){
    var d = dispSym(s);
    if(!d || seen[d]) return;
    seen[d] = 1; list.push(d);
  });
  var crypto = list.filter(isCrypto), fx = list.filter(isFx),
      rest = list.filter(function(s){ return !isCrypto(s) && !isFx(s); });
  var jobs = [];
  if(crypto.length) jobs.push(fetchCrypto(crypto));
  if(fx.length) jobs.push(fetchFX(fx));
  if(rest.length) jobs.push(tvQuotes(rest, concurrency));
  return Promise.all(jobs).then(function(arr){
    var ok = arr.reduce(function(a, b){ return a + (b || 0); }, 0);
    DATA.lastUpdate = Date.now();
    setStatus(ok ? 'live' : (Object.keys(DATA.quotes).length ? 'delayed' : 'offline'));
    return ok;
  });
}

    var rows = (j.data || []).map(function(r){
      var full = r.s || '', sym = full.split(':')[1] || full;
      var d = r.d || [];
      if(full) { TVMAP[dispSym(sym)] = full; }
      var c = numOf(d[1]), pct = numOf(d[2]);
      return { sym:dispSym(sym), name:d[7] || d[0] || sym, c:c, pct:pct, v:numOf(d[3]),
               mc:numOf(d[4]), sector:d[5] || '', exch:full.split(':')[0] || '',
               ch:(c != null && pct != null) ? c * pct / 100 : null };
    }).filter(function(r){ return r.sym && r.c != null; });

    rows.forEach(function(r){
      var q = DATA.quotes[r.sym] || {};
      /* The scan is a broad, cheap snapshot. A per-symbol TradingView quote carries
         pre/post-market prices and fundamentals, so keep it and only take the
         market cap from the scan. */
      var richer = (q.src === 'tradingview' || q.src === 'coingecko' || q.src === 'frankfurter');
      DATA.quotes[r.sym] = richer
        ? Object.assign({}, q, { mc:r.mc != null ? r.mc : q.mc, name:q.name || r.name })
        : Object.assign({}, q, {

            mc:r.mc, v:r.v, name:r.name, cur:'USD', src:'tradingview-scan', ts:Date.now(),

}

/* --- history (stockanalysis.com daily series, CORS enabled) -------------- */
var HIST_TTL = 6 * 60 * 60 * 1000;

var RANGE_DAYS = { 'M1':6, 'M5':7, 'M15':12, 'H1':181, 'H4':181, '1D':7, '5D':12, '1M':40, '6M':200, 'YTD':260, '1Y':380, '5Y':1900, 'MAX':6000 };

var RANGE_PILLS = ['M1', 'M5', 'M15', 'H1', 'H4', '5D', '1M', '6M', 'YTD', '1Y', '5Y', 'MAX'];

/* Intraday bars cached before timestamps were kept can't label times: fetch again. */
function histUsable(rows, range, sym){ return rows && RANGE_INTRA[range] && rows.length && !rows[rows.length - 1].t && !isFx(dispSym(sym)) ? null : rows; }

/* Public entry point: also mirrors the series into DATA.hist so views that read
   DATA.hist directly (quote stats, compare table and chart) see it too. */
function fetchHistory(sym, range){
  var days = RANGE_DAYS[range] || 40;
  var key = histKey(sym, days);
  var cached = histUsable(loadHistCache(sym, days), range, sym);

function fetchHistoryRaw(sym, range){
  var days = RANGE_DAYS[range] || 40;
  var cached = histUsable(loadHistCache(sym, days), range, sym);
  if(cached && cached.length) return Promise.resolve(cached);
  var s = dispSym(sym);
  if(TV_MISS[s] && !CG[s] && !isFx(s) && Date.now() - TV_MISS[s] < 600000) return Promise.resolve([]);   // unknown symbol: skip the slow relay chain

  if(CG[s]){
    var d2 = (range === '1D' || range === 'M1' || range === 'M5') ? 1 : (range === 'M15' ? 7 : (range === 'H1' || range === 'H4') ? 30 : (range === '5D' ? 7 : (range === '1M' ? 30 : (range === '6M' ? 180 : (range === '5Y' ? 1825 : (range === 'MAX' ? 3650 : 365))))));
    return fetchJSON('https://api.coingecko.com/api/v3/coins/' + CG[s] + '/market_chart?vs_currency=usd&days=' + d2, 14000)
      .then(function(j){
        var pts = (j.prices || []).map(function(p){
          return { d:new Date(p[0]).toISOString().slice(0, 10), t:Math.round(p[0] / 1000), o:p[1], h:p[1], l:p[1], c:p[1], v:0 };
        });
        saveHistCache(sym, days, pts);
        return pts;
      });
  }
  if(isFx(s)){
    var a = s.slice(0, 3), b = s.slice(4);
    var start = ymd(new Date(Date.now() - days * 864e5));
    return fetchJSON('https://api.frankfurter.dev/v1/' + start + '..?base=' + a + '&symbols=' + b, 14000)
      .then(function(j){
        var pts = Object.keys(j.rates || {}).sort().map(function(d){
          return { d:d, o:j.rates[d][b], h:j.rates[d][b], l:j.rates[d][b], c:j.rates[d][b], v:0 };
        });
        saveHistCache(sym, days, pts);
        return pts;
      });
  }
  var viaSA = function(){
  return fetchJSON('https://stockanalysis.com/api/symbol/s/' + encodeURIComponent(saSlug(s)) + '/history?range=' + saRange(days), 9000)
    .then(function(j){
      var raw = (j && j.data) || [];
      if(raw && !Array.isArray(raw) && Array.isArray(raw.data)) raw = raw.data;
      var out = (raw || []).map(function(r){
        return { d:r.t, o:numOf(r.o), h:numOf(r.h), l:numOf(r.l), c:numOf(r.c), v:numOf(r.v) || 0 };
      }).filter(function(r){ return r.d && r.c != null; });
      out.sort(function(x, y){ return x.d < y.d ? -1 : 1; });
      var from = ymd(new Date(Date.now() - days * 864e5));
      out = out.filter(function(r){ return r.d >= from; });
      if(range === 'YTD'){
        var jan = new Date().getFullYear() + '-01-01';
        out = out.filter(function(r){ return r.d >= jan; });
      }
      if(out.length) saveHistCache(sym, days, out);
      return out;
    });
  };
  /* OpenAlice-style path: Yahoo bars for intraday ranges (stockanalysis is
     daily-only), and as a fallback when stockanalysis fails. */
  var viaOA = function(){
    return oaHist(sym, range).then(function(rows){
      if(rows && rows.length){ saveHistCache(sym, days, rows); return rows; }
      throw new Error('no oa bars');
    });
  };
  var viaEdge = function(){
    return viaEDGE(sym, range).then(function(rows){
      if(rows && rows.length){ saveHistCache(sym, days, rows); return rows; }
      throw new Error('no edge bars');
    });
  };
  if(range === '1D' || range === '5D') return viaEdge().catch(viaOA).catch(viaSA);
  if(RANGE_INTRA[range]) return viaEdge().catch(viaOA);   // stockanalysis is daily-only: no fallback for intraday timeframes
  return viaEdge().catch(viaSA).catch(viaOA);
}

function newsUrl(query){
  return 'https://news.google.com/rss/search?q=' + encodeURIComponent(query) + '&hl=en-US&gl=US&ceid=US:en';

function parseRSS(xml){
  var items = [], re = /<item>([\s\S]*?)<\/item>/g, m;
  while((m = re.exec(xml))){
    var blk = m[1];
    var pick = function(tag){
      var r = new RegExp('<' + tag + '[^>]*>([\\s\\S]*?)<\\/' + tag + '>');
      var mm = blk.match(r);
      var val = mm ? mm[1] : '';
      return val.replace(/<!\[CDATA\[|\]\]>/g, '').trim();
    };
    var title = pick('title'), link = pick('link'), date = pick('pubDate'), src = pick('source');
    if(title) items.push({ title:title, link:link, date:date, src:src || 'Google News' });
  }
  return items;
}
/* Yahoo Finance headlines by ticker: the hosted site's source, because Google News answers
   Cloudflare's shared IPs with an "unusual traffic" page. Queries without tickers get the indices. */
function yahooNewsUrl(query){
  var syms = (String(query).match(/\b[A-Z][A-Z.\-]{0,5}\b/g) || []).filter(function(t){ return !/^(OR|AND|NOT|S|P)$/.test(t); });
  return 'https://feeds.finance.yahoo.com/rss/2.0/headline?s=' + encodeURIComponent((syms.length ? syms.slice(0, 8) : ['^GSPC', '^DJI', '^IXIC']).join(',')) + '&region=US&lang=en-US';
}
function fetchNews(query, limit){
  var google = function(){ return fetchText(newsUrl(query), 14000).then(function(xml){ var it = parseRSS(xml); if(!it.length) throw new Error('no headlines'); return it; }); };
  var yahoo = function(){ return fetchText(yahooNewsUrl(query), 14000).then(function(xml){
    var it = parseRSS(xml); if(!it.length) throw new Error('no headlines');
    return it.map(function(i){ i.src = 'Yahoo Finance'; return i; });
  }); };
  return (canTryProxy() ? google().catch(yahoo) : yahoo().catch(google)).then(function(it){ return it.slice(0, limit || 10); });
}

function sparkSVG(values, w, h, color, fill){
  var pts = (values || []).filter(function(v){ return isFinite(v); });
  if(pts.length < 2) return '<span class="mut">—</span>';
  var mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts), sp = mx - mn || 1;
  var step = w / (pts.length - 1);
  var d = pts.map(function(v, i){
    return (i ? 'L' : 'M') + (i * step).toFixed(1) + ' ' + (h - ((v - mn) / sp) * (h - 4) - 2).toFixed(1);
  }).join(' ');
  var id = 'sg' + Math.random().toString(36).slice(2, 8);
  return '<svg class="spark-svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    (fill === false ? '' : '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + color + '" stop-opacity=".28"/><stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>') +
    (fill === false ? '' : '<path d="' + d + ' L' + w + ' ' + h + ' L0 ' + h + ' Z" fill="url(#' + id + ')"/>') +
    '<path class="ln" d="' + d + '" stroke="' + color + '"/></svg>';
}

function maSeries(vals, p){
  return vals.map(function(_, i){

var VOL = { min:0, max:0, H:680 };
function volSet(y, animate){
  CUR.volY = clamp(y, VOL.min, VOL.max);
  var g = $('volLayer'), th = $('volThumb'), sl = $('volSlider');
  if(!g || !th) return;
  g.classList.toggle('anim', !!animate); th.classList.toggle('anim', !!animate);
  g.style.transform = 'translateY(' + CUR.volY + 'px)';
  th.style.top = ((CUR.volY - VOL.min) / ((VOL.max - VOL.min) || 1) * 100) + '%';
  sl.setAttribute('aria-valuenow', Math.round(CUR.volY));
  sl.classList.toggle('moved', Math.abs(CUR.volY) > 0.5);
}
/* Slider: drag to move the volume layer, a click (no drag) sends it home. The bars themselves drag too. */
function bindVolume(){
  var sl = $('volSlider'), g = $('volLayer'), svg = $('chartHost') && $('chartHost').querySelector('svg');
  if(!sl || !g || !svg) return;
  sl.setAttribute('aria-valuemin', Math.round(VOL.min)); sl.setAttribute('aria-valuemax', Math.round(VOL.max));
  volSet(CUR.volY, false);
  var drag = function(el, fromPointer){
    el.addEventListener('pointerdown', function(ev){
      ev.preventDefault(); el.setPointerCapture(ev.pointerId);
      var y0 = ev.clientY, v0 = CUR.volY, moved = false, scale = VOL.H / svg.getBoundingClientRect().height;
      var mv = function(e){
        if(!moved && Math.abs(e.clientY - y0) < 3) return;
        moved = true; document.body.classList.add('vol-dragging');
        if(fromPointer){ var r = sl.getBoundingClientRect(); volSet(VOL.min + clamp((e.clientY - r.top) / r.height, 0, 1) * (VOL.max - VOL.min), false); }
        else volSet(v0 + (e.clientY - y0) * scale, false);
      };
      var up = function(){
        el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
        document.body.classList.remove('vol-dragging');
        if(moved){   // the browser fires a click after the drag; keep it from reaching anything underneath
          var eat = function(c){ c.stopPropagation(); c.preventDefault(); };
          window.addEventListener('click', eat, true); setTimeout(function(){ window.removeEventListener('click', eat, true); }, 0);
        } else if(fromPointer) volSet(0, true);
      };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
  };
  drag(sl, true);   // the bars themselves no longer drag: the plot pans instead
  sl.onkeydown = function(e){
    var step = (VOL.max - VOL.min) / 20;
    if(e.key === 'ArrowUp'){ e.preventDefault(); volSet(CUR.volY - step, true); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); volSet(CUR.volY + step, true); }
    else if(e.key === 'Enter' || e.key === ' ' || e.key === 'Home'){ e.preventDefault(); volSet(0, true); }
  };
}

function donutSVG(parts, size){
  size = size || 168;
  var total = parts.reduce(function(a, p){ return a + (p.v || 0); }, 0) || 1;
  var r = size / 2 - 12, cx = size / 2, cy = size / 2, a0 = -Math.PI / 2, out = [];
  parts.forEach(function(p, i){
    if(!p.v) return;
    var a1 = a0 + (p.v / total) * Math.PI * 2;
    var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    var x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    var large = (a1 - a0) > Math.PI ? 1 : 0;
    out.push('<path d="M' + cx + ' ' + cy + ' L' + x0.toFixed(1) + ' ' + y0.toFixed(1) +
      ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z" fill="' +
      CHART_PALETTE[i % CHART_PALETTE.length] + '" opacity=".92"/>');
    a0 = a1;
  });
  out.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + (r * 0.58) + '" fill="var(--fh-background-surface)"/>');
  out.push('<text x="' + cx + '" y="' + (cy + 4) + '" text-anchor="middle" font-size="13" fill="var(--fh-foreground-on-surface-de-emphasis)">' + parts.length + ' items</text>');
  return '<svg class="donut" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' + out.join('') + '</svg>';
}

function hashOf(){ return decodeURIComponent(location.hash.replace(/^#\/?/, '')); }
function go(hash){ if(location.hash === hash){ route(); } else { location.hash = hash; } }

function parseRoute(){
  // split first, decode after: an encoded slash (EUR%2FUSD) belongs to the symbol, not to the path
  if(location.hash && !/^#\//.test(location.hash)) return { name:'home' };   // in-page anchors (#rs-cite-1) are not routes
  var parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(function(p){ try{ return decodeURIComponent(p); }catch(e){ return p; } });
  if(!parts.length) return { name:'home' };
  var name = parts[0];
  if(name === 'quote'){
    var qs = (parts[1] || 'AAPL').toUpperCase(), qt = parts[2] || 'overview';
    if(/^[A-Z]{3}$/.test(qs) && /^[A-Za-z]{3}$/.test(qt) && !/^(all)$/i.test(qt)){ qs += '/' + qt.toUpperCase(); qt = parts[3] || 'overview'; }   // EUR/USD typed with a plain slash
    var cm = qs.match(/^([A-Z]+)-USD$/); if(cm && CG[cm[1]]) qs = cm[1];                                                                                   // BTC-USD -> BTC
    return { name:'quote', sym:qs, tab:qt };
  }
  if(name === 'list') return { name:'list', id:parts[1] || CUR.list };
  if(name === 'portfolio') return { name:'portfolio', id:parts[1] || CUR.pf };
  if(name === 'market' || name === 'markets') return { name:'market', sec:parts[1] || '' };
  if(name === 'screener') return { name:'screener' };
  if(name === 'compare') return { name:'compare' };
  if(name === 'earnings') return { name:'earnings' };
  if(name === 'research') return { name:'research' };
  if(name === 'investors') return { name:'investors', id:parts[1] || '' };
  if(name === 'insiders') return { name:'insiders', sym:(parts[1] || '').toUpperCase() };
  if(name === 'filings') return { name:'filings', sym:(parts[1] || '').toUpperCase(), acc:parts[2] || '' };
  if(name === 'keys') return { name:'settings', sec:'ai' };
  if(name === 'feedback' || name === 'help') return { name:'contact', kind:name };
  if(name === 'settings') return { name:'settings', sec:parts[1] || 'profile' };
  return { name:'404', path:name === '404' ? (parts[1] || '') : location.hash };
}

var routeSeq = 0;
function route(){
  var r = parseRoute();
  var seq = ++routeSeq;
  CUR.view = r.name;
  document.title = route.title || (route.title = document.title);   // restore after the 404 page renames the tab
  if(r.name === 'quote'){ CUR.sym = r.sym; CUR.tab = r.tab; }
  if(r.name === 'list') CUR.list = r.id;
  if(r.name === 'portfolio') CUR.pf = r.id;
  if(r.name === 'investors') CUR.guru = r.id;
  if(r.name === 'market') CUR.mkSec = r.sec;
  renderSubnav();
  renderRail();
  if($('guTip')) $('guTip').classList.remove('on');
  document.body.classList.remove('fil-reading');
  window.scrollTo({ top:0 });
  var p;
  if(r.name === 'home') p = renderHome();
  else if(r.name === 'quote') p = renderQuote();
  else if(r.name === 'list') p = renderList();
  else if(r.name === 'portfolio') p = renderPortfolio();
  else if(r.name === 'market') p = renderMarket(r.sec);
  else if(r.name === '404') p = render404(r.path);
  else if(r.name === 'screener') p = renderScreener();
  else if(r.name === 'compare') p = renderCompare();
  else if(r.name === 'earnings') p = renderEarnings();
  else if(r.name === 'settings') p = renderSettingsPage(r.sec);
  else if(r.name === 'contact') p = renderContactPage(r.kind);
  else if(r.name === 'investors') p = renderInvestors(r.id);
  else if(r.name === 'insiders') p = renderInsiders(r.sym);
  else if(r.name === 'filings') p = renderFilings(r.sym, r.acc);
  else p = renderResearchPage();
  return Promise.resolve(p).then(function(){
    if(seq === routeSeq) renderRail();
  });
}

function sortRows(rows, key, dir){
  if(!key) return rows;
  return rows.slice().sort(function(a, b){
    var x = a[key], y = b[key];
    if(x == null) return 1; if(y == null) return -1;
    return (x > y ? 1 : (x < y ? -1 : 0)) * dir;
  });
}

  return {
    sym:s, name:labelOf(s), q:q, ch:ch, up:up,

      pct:ch.pct,

/* ---- Portfolio at a glance: the first thing on the home page --------------- */
var GL_R = [['AT', 'AT'], ['5Y', '5Y'], ['1Y', '1Y'], ['YTD', 'YTD'], ['3M', '3M'], ['1M', '1M'], ['1D', 'Today']];
var GL_TXT = { AT:'all time', '5Y':'5 years', '1Y':'1 year', YTD:'year to date', '3M':'3 months', '1M':'1 month', '1D':'today' };
var GL = { loading:{}, intra:null };
function glRange(){ return GL_TXT[CFG.glr] ? CFG.glr : '1M'; }
/* Which feed range each button reads; the series is then cut to the button's window. */
function glBase(r){ return r === '3M' ? '6M' : (r === 'YTD' ? '1Y' : r); }
function glFetch(sym, r){
  var s = dispSym(sym), k = 'gl_' + r + '_' + s;
  if(DATA.hist[k]) return Promise.resolve(DATA.hist[k]);
  /* AT: Yahoo monthly bars via serve.py reach back to inception; without the server it falls back to the free feed's 5 years. */
  var p = r === 'AT' ? oaHist(s, 'MAX').then(function(x){ if(x && x.length > 12) return x; throw 0; }).catch(function(){ return fetchHistory(s, '5Y'); })
    : fetchHistory(s, glBase(r));
  return p.then(function(rows){ DATA.hist[k] = rows || []; return DATA.hist[k]; }).catch(function(){ DATA.hist[k] = []; return []; });
}
function glIntraLoad(pf){
  var syms = pf.holdings.map(function(h){ return dispSym(h.s); }).concat(['SPY']);
  GL.intra = GL.intra || {};
  return Promise.all(syms.map(function(s){
    return fetchJSON('/api/oa/chart?symbol=' + encodeURIComponent(s) + '&range=1D', 16000).then(function(j){
      GL.intra[s] = { pc:j.previousClose, bars:(j.bars || []).filter(function(b){ return b.c != null; }) };
    }).catch(function(){ GL.intra[s] = { fail:true }; });
  }));
}
function glKick(pf, r){
  var key = r + '|' + pf.holdings.map(function(h){ return h.s; }).join();
  if(GL.loading[key]) return;
  GL.loading[key] = 1;
  var p = r === '1D' ? glIntraLoad(pf) : Promise.all(pf.holdings.map(function(h){ return h.s; }).concat(['SPY']).map(function(x){ return glFetch(x, r); }));
  p.then(function(){ repaintGlance(); });
}
function repaintGlance(){
  var el = document.querySelector('.glance');
  if(el && CUR.view === 'home') el.outerHTML = glanceHTML();
}
/* Portfolio value vs SPY for one window: { ser:[{d,v}], spx:[v]|null }, or { pending:true } while loading. */
function glSeries(pf, r, st){
  if(r === '1D'){
    var I = GL.intra, syms = pf.holdings.map(function(h){ return dispSym(h.s); }).concat(['SPY']);
    if(!I || syms.some(function(x){ return !I[x]; })) return { pending:true };
    var ok = syms.every(function(x){ return !I[x].fail && I[x].pc && I[x].bars.length > 3; });
    if(ok){
      var qty = {}; pf.holdings.forEach(function(h){ qty[dispSym(h.s)] = h.q; });
      var byT = {}, n = pf.holdings.length;
      pf.holdings.forEach(function(h){ var x = dispSym(h.s); I[x].bars.forEach(function(b){ (byT[b.t] = byT[b.t] || {})[x] = b.c * qty[x]; }); });
      var ts = Object.keys(byT).sort(function(a, b){ return a - b; }).filter(function(t){ return Object.keys(byT[t]).length >= n; });
      var spyBy = {}; I.SPY.bars.forEach(function(b){ spyBy[b.t] = b.c; });
      ts = ts.filter(function(t){ return spyBy[t] != null; });
      if(ts.length > 3){
        var base = pf.holdings.reduce(function(a, h){ return a + I[dispSym(h.s)].pc * h.q; }, 0);
        return { ser:[{ d:'prev', v:base }].concat(ts.map(function(t){ return { d:t, v:Object.keys(byT[t]).reduce(function(a, k){ return a + byT[t][k]; }, 0) }; })),
                 spx:[I.SPY.pc].concat(ts.map(function(t){ return spyBy[t]; })), intra:true };
      }
    }
    /* No intraday feed (static site / no server): two points from the delayed quotes. */
    var q = DATA.quotes.SPY || {}, prev = st.total - st.day;
    if(!prev || q.c == null || q.pc == null) return { ser:[], spx:null };
    return { ser:[{ d:'prev', v:prev }, { d:'now', v:st.total }], spx:[q.pc, q.c] };
  }
  var syms2 = pf.holdings.map(function(h){ return dispSym(h.s); }).concat(['SPY']);
  if(syms2.some(function(x){ return !DATA.hist['gl_' + r + '_' + x]; })) return { pending:true };
  var spyRows = DATA.hist['gl_' + r + '_SPY'];
  var cut = '';
  if(r === 'YTD'){
    var jan = new Date().getFullYear() + '-01-01';
    spyRows.forEach(function(x){ if(x.d < jan) cut = x.d; });
  } else {
    var days = { '1M':31, '3M':92, '1Y':366, '5Y':1830 }[r];
    cut = days ? ymd(new Date(Date.now() - days * 864e5)) : '';
  }
  var byDate = {}, n2 = 0;
  pf.holdings.forEach(function(h){
    var rows = DATA.hist['gl_' + r + '_' + dispSym(h.s)];
    if(!rows || rows.length < 2) return;
    n2++;
    rows.forEach(function(x){ if(x.c != null && x.d >= cut) (byDate[x.d] = byDate[x.d] || {})[dispSym(h.s)] = x.c * h.q; });
  });
  if(!n2) return { ser:[], spx:null };
  var spyBy2 = {}; spyRows.forEach(function(x){ if(x.c != null) spyBy2[x.d] = x.c; });
  var out = [], spx = [];
  Object.keys(byDate).sort().forEach(function(d){
    if(Object.keys(byDate[d]).length >= n2 && spyBy2[d] != null){
      out.push({ d:d, v:Object.keys(byDate[d]).reduce(function(a, k){ return a + byDate[d][k]; }, 0) }); spx.push(spyBy2[d]);
    }
  });
  return out.length < 2 ? { ser:[], spx:null } : { ser:out, spx:spx };
}
function vsSVG(a, b, w, h){
  /* Two lines as % change from the first day, on one shared scale. */
  var pa = a.map(function(v){ return (v / a[0] - 1) * 100; }), pb = b.map(function(v){ return (v / b[0] - 1) * 100; });
  var all = pa.concat(pb, [0]), mn = Math.min.apply(null, all), mx = Math.max.apply(null, all), sp = mx - mn || 1;
  var step = w / (a.length - 1);
  function path(p){ return p.map(function(v, i){ return (i ? 'L' : 'M') + (i * step).toFixed(1) + ' ' + (h - 3 - (v - mn) / sp * (h - 6)).toFixed(1); }).join(' '); }
  var zy = (h - 3 - (0 - mn) / sp * (h - 6)).toFixed(1);
  return '<svg class="vs-svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<line x1="0" x2="' + w + '" y1="' + zy + '" y2="' + zy + '" stroke="var(--fh-border-stroke-emphasis)" stroke-dasharray="3 4"/>' +
    '<path d="' + path(pb) + '" fill="none" stroke="var(--fh-foreground-on-surface-de-emphasis)" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
    '<path d="' + path(pa) + '" fill="none" stroke="var(--fh-colors-and-accents-primary)" stroke-width="2.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
}
function glanceHTML(){

  var loading = priced < st.rows.length;

  var haveDay = st.rows.some(function(r){ return r.day != null; });

  var R = glRange(), G = glSeries(pf, R, st);
  if(G.pending) glKick(pf, R);
  var series = (G.ser || []).map(function(p){ return p.v; }), spx = G.spx;

  var rng = '<div class="gl-rng" role="tablist" aria-label="Time range">' + GL_R.map(function(x){
    return '<button type="button" role="tab" aria-selected="' + (x[0] === R) + '" class="' + (x[0] === R ? 'on' : '') + '" data-act="gl-range" data-r="' + x[0] + '">' + x[1] + '</button>';
  }).join('') + '</div>';
  var spark = G.pending ? '<div class="gl-wait mut">Loading ' + esc(GL_TXT[R]) + '…</div>'
    : (series.length < 2 ? '<div class="gl-wait mut">No history for this range yet.</div>'
    : (spx
      ? vsSVG(series, spx, 300, 72) + '<span class="gl-leg"><i style="background:var(--fh-colors-and-accents-primary)"></i>You <b class="num ' + (pr >= 0 ? 'up' : 'down') + '">' + pct(pr, 1) + '</b>' +
        '<i style="background:var(--fh-foreground-on-surface-de-emphasis)"></i>S&amp;P 500 <b class="num ' + (sr >= 0 ? 'up' : 'down') + '">' + pct(sr, 1) + '</b>' + since + '</span>'
      : sparkSVG(series, 260, 64, pr >= 0 ? 'var(--fh-positive)' : 'var(--fh-negative)') + '<span class="mut">' + esc(GL_TXT[R]) + '</span>'));

function topMovers(kind){
  var rows = screenRows();
  if(rows.length){
    /* Only substantial, actively traded names: the raw scan also contains
       preferred shares and micro caps that would swamp a movers list. */
    var NOISE = /depositary|warrant|preferred|notes due|\bunits?\b|rights|when issued|subscription/i;
    var solid = rows.filter(function(r){
      return r.mc != null && r.mc >= 2e9 && r.v > 50000 && r.pct != null && !NOISE.test(r.name || '');
    });
    var out;
    if(kind === 'gainers') out = solid.slice().sort(function(a, b){ return b.pct - a.pct; });
    else if(kind === 'losers') out = solid.slice().sort(function(a, b){ return a.pct - b.pct; });
    else out = rows.filter(function(r){ return r.mc != null && !NOISE.test(r.name || ''); }).slice().sort(function(a, b){ return b.mc - a.mc; });
    if(out.length) return out.slice(0, 5).map(function(r){ return r.sym; });
  }
  var syms = UNIVERSE.map(function(u){ return u[0]; });
  var qr = syms.map(function(s){ return quoteRow(s, false); }).filter(function(r){ return r.ch.pct != null; });
  if(kind === 'gainers') return qr.sort(function(a, b){ return b.ch.pct - a.ch.pct; }).slice(0, 5).map(function(r){ return r.sym; });
  if(kind === 'losers') return qr.sort(function(a, b){ return a.ch.pct - b.ch.pct; }).slice(0, 5).map(function(r){ return r.sym; });
  return qr.sort(function(a, b){ return (b.q.mc || 0) - (a.q.mc || 0); }).slice(0, 5).map(function(r){ return r.sym; });
}

function clusterNews(items){
  var stop = {};
  'the a an of on in for to and as at with by from its is are was were this that after before over under new says say stocks stock market markets shares share amid ahead what why how'.split(' ').forEach(function(w){ stop[w] = 1; });
  var clusters = [];
  items.forEach(function(it){
    var words = String(it.title).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(function(w){ return w.length > 3 && !stop[w]; });
    var hit = null;
    for(var i = 0; i < clusters.length && !hit; i++){
      var c = clusters[i];
      if(words.some(function(w){ return c.words[w]; })) hit = c;
    }
    if(hit){ hit.items.push(it); words.forEach(function(w){ hit.words[w] = 1; }); }
    else { var c2 = { words:{}, items:[it] }; words.forEach(function(w){ c2.words[w] = 1; }); clusters.push(c2); }
  });
  return clusters.sort(function(a, b){ return b.items.length - a.items.length; });
}
