];
var GURU = { data:null, view:'pie', q:'', loading:null };

function guruById(id){ for(var i = 0; i < GURUS.length; i++) if(GURUS[i].id === id) return GURUS[i]; return null; }
function guruImg(g){ return 'assets/gurus/' + g.id + '.webp'; }
function guruLoad(){
  if(GURU.data) return Promise.resolve(GURU.data);
  if(!GURU.loading) GURU.loading = fetch('assets/gurus/holdings.json').then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){ GURU.data = j.investors || {}; return GURU.data; })
    .catch(function(e){ GURU.loading = null; throw e; });
  return GURU.loading;
}
function guruPeriod(d){
  if(!d || !d.period) return '';
  if(d.source !== '13F-HR') return d.source;
  var m = +d.period.slice(5, 7);
  return 'Q' + Math.ceil(m / 3) + ' ' + d.period.slice(0, 4) + ' 13F';
}
function guruLogo(h, cls){
  var t = h.t || '', src = !t ? '' : 'https://financialmodelingprep.com/image-stock/' + encodeURIComponent(h.cr ? t + 'USD' : t.replace('.', '-')) + '.png';
  return '<span class="gu-logo' + (cls ? ' ' + cls : '') + '" data-l="' + esc((t || h.n || '?').slice(0, 2)) + '">' +
    (src ? '<img src="' + src + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '</span>';
}
/* Change versus the previous filing: ps = last quarter's shares (0 = new); mv overrides for disclosures without share counts. */
function guruMove(h){
  if(h.mv) return { k:h.mv };
  if(h.ps == null) return null;
  if(!h.ps) return { k:'new' };
  var p = (h.s / h.ps - 1) * 100;
  return Math.abs(p) < 0.5 ? { k:'same', p:0 } : { k:p > 0 ? 'add' : 'trim', p:p };
}
function guruChip(m){
  if(!m || m.k === 'same') return '<span class="gu-ch"></span>';
  var txt = m.k === 'new' ? 'NEW' : m.p == null ? (m.k === 'add' ? 'ADDED' : 'TRIMMED') : (m.p > 0 ? '+' : '−') + (Math.abs(m.p) >= 1000 ? '999+' : num(Math.abs(m.p), Math.abs(m.p) < 10 ? 1 : 0)) + '%';
  return '<span class="gu-ch ' + (m.k === 'trim' ? 'dn' : 'up') + '">' + txt + '</span>';
}
function guruPrevLabel(d){ return d.prev ? d.prev.label || guruPeriod({ source:'13F-HR', period:d.prev.period }) : ''; }
function guruPc(h){ return h.pc ? '<span class="gu-pc ' + h.pc.toLowerCase() + '">' + esc(h.pc.toUpperCase()) + '</span>' : ''; }
function guruHref(h){ return h.t ? '#/quote/' + encodeURIComponent(h.t) : ''; }

function renderInvestors(id){
  var g = id && guruById(id);
  if(id && !g){ go('#/investors'); return; }
  CUR.guru = g ? g.id : '';
  $('main').innerHTML = '<div class="section">' + skeletonRows(4, 140) + '</div>';
  return guruLoad().then(function(data){
    if(CUR.view !== 'investors' || CUR.guru !== (g ? g.id : '')) return;
    if(g) paintGuru(g, data[g.id]); else paintGuruIndex(data);
  }).catch(function(e){
    $('main').innerHTML = '<div class="section"><div class="card empty">Could not load investor holdings (' + esc(e.message) + '). ' +
      'Open the app through <code>python3 serve.py</code> or the hosted site; browsers block local files.</div></div>';
  });
}

function guruCardMoves(d){
  if(!d.prev || d.source !== '13F-HR') return '';
  var n = d.holdings.filter(function(h){ var m = guruMove(h); return m && m.k === 'new'; }).length, x = (d.sold || []).length;
  return '<span class="fm num"><span class="up">' + n + ' new</span> · <span class="down">' + x + ' sold out</span> vs ' + esc(guruPrevLabel(d)) + '</span>';
}

function paintGuruIndex(data){
  var html = '<div class="section"><div class="section-head"><h2>Smart Money</h2></div>' +
    '<p class="gu-sub" style="margin:-4px 0 16px">What the best-known investors own, from their latest SEC 13F filings and public disclosures. Pick one to explore.</p><div class="gu-grid">';
  GURUS.forEach(function(g, i){
    var d = data[g.id] || { holdings:[] };
    html += '<a class="gu-card" href="#/investors/' + g.id + '" style="--d:' + (i * 55) + 'ms">' +
      '<div class="ph"><img src="' + guruImg(g) + '" alt="' + esc(g.name) + '" loading="lazy"><span class="gu-tag">' + esc(g.tag) + '</span></div>' +
      '<div class="bd"><span class="nm">' + esc(g.name) + '</span><span class="fm">' + esc(g.firm) + '</span>' +
      '<span class="fm num">$' + compact(d.total) + ' · ' + d.holdings.length + ' holdings · ' + esc(guruPeriod(d)) + '</span>' + guruCardMoves(d) +
      '<div class="tops">' + d.holdings.slice(0, 5).map(function(h){ return guruLogo(h); }).join('') +
      (d.holdings.length > 5 ? '<span class="more">+' + (d.holdings.length - 5) + '</span>' : '') + '</div></div></a>';
  });
  html += '</div></div>';

  // Crowd favourites: tickers that show up in several investors' top 25
  var cnt = {};
  GURUS.forEach(function(g){
    var seen = {};
    ((data[g.id] || {}).holdings || []).slice(0, 25).forEach(function(h){
      if(!h.t || h.pc || seen[h.t]) return; seen[h.t] = 1;
      (cnt[h.t] = cnt[h.t] || { h:h, who:[] }).who.push(g);
    });
  });
  var crowd = Object.keys(cnt).map(function(k){ return cnt[k]; }).filter(function(c){ return c.who.length > 1; })
    .sort(function(a, b){ return b.who.length - a.who.length; }).slice(0, 12);
  if(crowd.length){
    html += '<div class="section"><div class="section-head"><h2>Crowd favourites</h2></div>' +
      '<p class="gu-sub" style="margin:-4px 0 12px">Stocks in the top 25 of more than one of these portfolios.</p><div class="gu-crowd">' +
      crowd.map(function(c, i){
        return '<a href="' + guruHref(c.h) + '" style="--d:' + (i * 40) + 'ms">' + guruLogo(c.h) + '<span><b>' + esc(c.h.t) + '</b><br><span class="gu-sub">' + c.who.length + ' investors</span></span>' +
          '<span class="who">' + c.who.map(function(g){ return '<img src="' + guruImg(g) + '" alt="' + esc(g.name) + '" title="' + esc(g.name) + '">'; }).join('') + '</span></a>';
      }).join('') + '</div></div>';
  }
  html += footerHTML();
  $('main').innerHTML = html;
}

function paintGuru(g, d){
  d = d || { holdings:[], total:0 };
  var hs = d.holdings, top10 = hs.slice(0, 10).reduce(function(a, h){ return a + h.w; }, 0);
  var link = d.accession ? 'https://www.sec.gov/Archives/edgar/data/' + d.cik + '/' + d.accession.replace(/-/g, '') + '/' : d.url;
  var i = GURUS.indexOf(g), prev = GURUS[(i + GURUS.length - 1) % GURUS.length], next = GURUS[(i + 1) % GURUS.length];
  var html = '<div class="section"><div class="gu-hero"><img class="av" src="' + guruImg(g) + '" alt="' + esc(g.name) + '">' +
    '<div><span class="gu-tag">' + esc(g.tag) + '</span><h2>' + esc(g.name) + '</h2><div class="gu-sub">' + esc(g.firm) + ' · ' + esc(g.born) + '</div>' +
    '<div class="tl">' + esc(g.tl) + '</div>' +
    '<div class="gu-stats">' +
      '<div class="gu-stat"><b class="num">$' + compact(d.total) + '</b><span>' + (d.est ? 'Estimated value' : 'Reported value') + '</span></div>' +
      '<div class="gu-stat"><b class="num">' + hs.length + '</b><span>Holdings</span></div>' +
      '<div class="gu-stat"><b class="num">' + num(top10, 1) + '%</b><span>In top 10</span></div>' +
      '<div class="gu-stat"><b>' + esc(hs[0] ? hs[0].t || hs[0].n : '—') + '</b><span>Biggest position</span></div>' +
      '<div class="gu-stat"><b>' + esc(guruPeriod(d)) + '</b><span>Filed ' + esc(d.filed || '—') + '</span></div>' +
    '</div></div></div></div>';

  html += '<div class="section"><div class="card"><div class="section-head" style="margin:0"><h3 style="flex:1;margin:0">Holdings</h3>' +
    '<div class="gu-seg" role="tablist"><button class="' + (GURU.view === 'pie' ? 'on' : '') + '" data-gview="pie">Top 10 pie</button>' +
    '<button class="' + (GURU.view === 'list' ? 'on' : '') + '" data-gview="list">All ' + hs.length + '</button></div></div>' +
    '<div id="guHold"></div>' +
    '<div class="movers-note">' + (d.note ? esc(d.note) : 'From ' + esc(d.filer || g.firm) + '\'s 13F-HR for the period ending ' + esc(d.period) +
      '. 13Fs list U.S.-listed long equity and option positions only, reported up to 45 days after quarter end. Options are shown at the value of the underlying shares.') +
    (link ? ' <a href="' + esc(link) + '" target="_blank" rel="noopener">Source filing</a>' : '') + '</div></div></div>';

  html += guruMovesHTML(d);
  html += '<div class="section"><div class="grid-2"><div class="card gu-story"><h3>The story</h3>' + g.story.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') +
    (g.q ? '<blockquote class="gu-quote">“' + esc(g.q[0]) + '”<cite>' + esc(g.q[1]) + '</cite></blockquote>' : '') + '</div>' +
    '<div class="card"><h3>Worth knowing</h3><ul class="gu-facts">' + g.facts.map(function(f){ return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></div></div></div>';

  html += '<div class="section"><div class="section-head"><h2>Philosophy</h2></div><div class="gu-ph">' + g.ph.map(function(p, k){
    return '<div class="card" style="--d:' + (k * 70) + 'ms"><div class="n">0' + (k + 1) + '</div><h4>' + esc(p[0]) + '</h4><p>' + esc(p[1]) + '</p></div>';
  }).join('') + '</div></div>';

  html += '<div class="section gu-nav"><a href="#/investors/' + prev.id + '"><img src="' + guruImg(prev) + '" alt="">← ' + esc(prev.name) + '</a>' +
    '<a href="#/investors">All investors</a>' +
    '<a href="#/investors/' + next.id + '"><img src="' + guruImg(next) + '" alt="">' + esc(next.name) + ' →</a></div>';
  html += footerHTML();
  $('main').innerHTML = html;
  GURU.q = '';
  paintGuruHold(d);
  $$('[data-gview]').forEach(function(b){
    b.onclick = function(){ GURU.view = b.getAttribute('data-gview'); $$('[data-gview]').forEach(function(x){ x.classList.toggle('on', x === b); }); paintGuruHold(d); };
  });
}

function paintGuruHold(d){
  var box = $('guHold'); if(!box) return;
  var hs = d.holdings;
  if(!hs.length){ box.innerHTML = '<div class="empty">No holdings in this filing.</div>'; return; }
  box.innerHTML = GURU.view === 'pie' ? guruPie(hs.slice(0, 10)) : guruListShell(hs.length);
  if(GURU.view === 'list'){
    var inp = $('guQ'), paint = function(){ $('guList').innerHTML = guruRows(hs, GURU.q); };
    inp.value = GURU.q; paint();
    inp.oninput = function(){ GURU.q = inp.value; paint(); };
  }
  guruHover(box, hs);
}

/* Donut of the top 10. Slices are revealed by a mask sweeping clockwise; hover pops a slice outward. */
function guruPie(top){
  var S = 340, cx = S / 2, R = 150, r = 88, tot = top.reduce(function(a, h){ return a + h.w; }, 0) || 1, a0 = -Math.PI / 2, paths = [];
  var pt = function(rad, a){ return (cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cx + rad * Math.sin(a)).toFixed(2); };
  top.forEach(function(h, i){
    var a1 = a0 + h.w / tot * Math.PI * 2, mid = (a0 + a1) / 2, big = a1 - a0 > Math.PI ? 1 : 0;
    if(a1 - a0 >= Math.PI * 2 - 1e-6) a1 -= 1e-4;   // a single 100% slice still needs two distinct arc ends
    paths.push('<path class="gu-slice" data-gi="' + i + '" style="--dx:' + (Math.cos(mid) * 10).toFixed(1) + 'px;--dy:' + (Math.sin(mid) * 10).toFixed(1) + 'px" fill="var(--gp' + (i + 1) + ')" d="M' + pt(R, a0) +
      ' A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + pt(R, a1) + ' L' + pt(r, a1) + ' A' + r + ' ' + r + ' 0 ' + big + ' 0 ' + pt(r, a0) + ' Z"/>');
    a0 = a1;
  });

  var svg = '<svg class="gu-pie" id="guPie" width="' + S + '" height="' + S + '" viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="Top 10 holdings by weight">' +

/* Sidebar sectors are GICS-style; the TradingView scan uses its own names. */
var SECTOR_MAP = {
  'Technology':['Electronic Technology', 'Technology Services'], 'Communications':['Communications'],
  'Discretionary':['Retail Trade', 'Consumer Durables', 'Consumer Services'], 'Staples':['Consumer Non-Durables', 'Distribution Services'],
  'Financials':['Finance'], 'Health care':['Health Technology', 'Health Services'],
  'Industrials':['Producer Manufacturing', 'Industrial Services', 'Transportation', 'Commercial Services'],
  'Energy':['Energy Minerals'], 'Materials':['Process Industries', 'Non-Energy Minerals'], 'Utilities':['Utilities'], 'Real estate':['Finance']
};
function sectorMatch(r, sel){
  if(r.sector === sel) return true;
  var m = SECTOR_MAP[sel];
  if(!m || m.indexOf(r.sector) < 0) return false;
  return sel !== 'Real estate' || /\b(REIT|realty|propert|real estate|land|residential)\b/i.test(r.name || '');
}
function screenUniverse(){
  var f = CUR.screen || defaultScreen();
  var snap = screenRows();
  var list = snap.length
    ? snap.map(function(r){ return { sym:r.sym, name:r.name, sector:r.sector || sectorOf(r.sym) || '', c:r.c, ch:r.ch, pct:r.pct, mc:r.mc }; })
    : UNIVERSE.map(function(u){
        var q = DATA.quotes[u[0]] || {};

        return { sym:u[0], name:u[1], sector:u[2], c:q.c, ch:ch.abs, pct:ch.pct, mc:q.mc };
      });

    if(f.q && r.sym.indexOf(f.q.toUpperCase()) < 0 && String(r.name).toLowerCase().indexOf(f.q.toLowerCase()) < 0) return false;
    if(f.minPx !== '' && !(r.c >= parseFloat(f.minPx))) return false;

    if(f.maxPct !== '' && !(r.pct <= parseFloat(f.maxPct))) return false;
    if(f.minMc !== '' && !(r.mc >= parseFloat(f.minMc) * 1e9)) return false;
    if(f.maxMc !== '' && !(r.mc <= parseFloat(f.maxMc) * 1e9)) return false;
    return true;
  });
}

/* Form 4 trades from OpenInsider's screener page. It sends no CORS headers, so
   it goes through serve.py's proxy, or the public relay on the hosted site. */
var INS = { sym:'', name:'', rows:[], hist:[], period:180, type:'all', who:'', day:'', q:'', sort:'d', dir:-1, shown:40,
            show:{ close:true, buy:true, sell:true, other:false } };
var INS_PERIODS = [[90, '3M'], [180, '6M'], [365, '1Y'], [730, '2Y']];
var INS_KIND = { P:'buy', S:'sell' };

function insUrl(sym){
  return 'http://openinsider.com/screener?s=' + encodeURIComponent(sym) +
    '&fd=730&xp=1&xs=1&xa=1&xd=1&xg=1&xf=1&xm=1&xx=1&xc=1&xw=1&cnt=1000&page=1';
}
/* serve.py's /api/insiders (openinsider_scraper.py: retries, paging, 30-min cache) first;
   the hosted static site has no such endpoint, so parse OpenInsider in the browser there. */
function insFetch(sym){
  return fetchJSON('/api/insiders?s=' + encodeURIComponent(sym), 30000).then(function(j){
    return (j.rows || []).map(function(r){
      return { filed:r.filed, d:r.trade_date, name:r.insider, title:r.title, type:r.trade_type, kind:r.kind,
               px:r.price, qty:r.qty, own:r.owned, dOwn:r.delta_own, val:r.value, url:r.filing_url };
    });
  }).catch(function(){ return fetchText(insUrl(sym), 25000).then(insParse); });
}
function insNum(t){ var v = parseFloat(String(t || '').replace(/[$,+%]/g, '')); return isFinite(v) ? v : null; }
function insParse(html){
  var t = new DOMParser().parseFromString(html, 'text/html').querySelector('table.tinytable');
  if(!t) return [];
  var seen = {};
  return [].slice.call(t.querySelectorAll('tbody tr')).map(function(tr){
    var c = tr.children;
    if(c.length < 12) return null;
    var tx = function(i){ return (c[i].textContent || '').replace(/\s+/g, ' ').trim(); };
    var a = c[1].querySelector('a'), code = tx(6).charAt(0);
    return { filed:tx(1).slice(0, 10), d:tx(2), name:tx(4), title:tx(5), type:tx(6).replace(/^[A-Z] - /, ''), kind:INS_KIND[code] || 'other',
             px:insNum(tx(7)), qty:insNum(tx(8)), own:insNum(tx(9)), dOwn:tx(10), val:insNum(tx(11)),
             url:a ? String(a.getAttribute('href') || '').replace(/^http:/, 'https:') : '' };
  }).filter(function(r){
    if(!r || !/^\d{4}-\d\d-\d\d$/.test(r.d)) return false;
    var k = [r.d, r.name, r.qty, r.px, r.own].join('|');   // joint filers repeat the same trade: count it once
    return seen[k] ? false : (seen[k] = 1);
  });
}
/* Unit check for the parser: run insSelfTest() in the console. */
function insSelfTest(){
  var r = insParse('<table class="tinytable"><tbody><tr><td></td><td><a href="http://www.sec.gov/x.xml">2026-09-29 16:15:06</a></td><td>2026-09-25</td><td>TEM</td>' +
    '<td>Doe Jane</td><td>CEO</td><td>S - Sale+OE</td><td>$85.00</td><td>-10,281</td><td>76,740</td><td>-12%</td><td>-$873,885</td></tr></tbody></table>')[0];
  console.assert(r && r.kind === 'sell' && r.type === 'Sale+OE' && r.qty === -10281 && r.val === -873885 && r.px === 85 && r.url === 'https://www.sec.gov/x.xml', 'insParse', r);

function insBindSearch(base){
  base = base || 'insiders';
  var f = $('insForm'), q = $('insQ'), box = $('insSug'), items = [], at = -1, timer = 0, seq = 0;
  if(!f) return;
  function pick(it){ INS.pickName = { s:it.sym, n:it.name }; go('#/' + base + '/' + encodeURIComponent(it.sym)); }
  function draw(){
    box.hidden = !items.length; q.setAttribute('aria-expanded', String(!!items.length));
    box.innerHTML = items.map(function(it, i){
      return '<button type="button" role="option" class="' + (i === at ? 'on' : '') + '" data-i="' + i + '" style="--d:' + (i * 30) + 'ms">' + guruLogo({ t:it.sym }) +
        '<b>' + esc(it.sym) + '</b><span>' + esc(it.name || '') + '</span><i>' + (it.kind === 'etf' ? 'ETF' : 'Stock') + '</i></button>';
    }).join('');
  }
  q.oninput = function(){
    var v = q.value.trim(), my = ++seq;
    clearTimeout(timer);
    if(!v){ items = []; at = -1; draw(); f.classList.remove('busy'); return; }
    timer = setTimeout(function(){
      f.classList.add('busy');
      searchSymbols(v).then(function(l){ if(my !== seq) return; f.classList.remove('busy'); items = l.filter(function(x){ return x.kind === 'stock'; }).concat(l.filter(function(x){ return x.kind !== 'stock'; })); at = items.length ? 0 : -1; draw(); });
    }, 180);
  };
  q.onkeydown = function(e){
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ if(!items.length) return; e.preventDefault(); at = (at + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; draw(); }
    else if(e.key === 'Escape'){ items = []; draw(); e.stopPropagation(); }
  };
  q.onblur = function(){ setTimeout(function(){ items = []; draw(); }, 150); };
  box.onmousedown = function(e){ var b = e.target.closest('[data-i]'); if(b){ e.preventDefault(); pick(items[+b.getAttribute('data-i')]); } };
  f.onsubmit = function(e){
    e.preventDefault();
    var v = q.value.trim().toUpperCase();
    if(at >= 0 && items[at]) return pick(items[at]);
    if(/^[A-Z.\-]{1,6}$/.test(v)) return pick({ sym:v });
    if(v) toast('No company matches “' + q.value.trim() + '”');
  };
}

function insPaintSummary(){
  var rs = insInPeriod(), b = { n:0, v:0 }, sl = { n:0, v:0 }, people = {};
  rs.forEach(function(r){
    if(r.kind === 'buy'){ b.n++; b.v += Math.abs(r.val || 0); }
    if(r.kind === 'sell'){ sl.n++; sl.v += Math.abs(r.val || 0); }
    if(r.kind !== 'other') people[r.name] = 1;
  });
  var lbl = { 90:'3 months', 180:'6 months', 365:'year', 730:'2 years' }[INS.period];
  var net = b.v - sl.v, ratio = b.v + sl.v ? b.v / (b.v + sl.v) : null;
  $('insSum').innerHTML = !rs.length ? 'No Form 4 filings for ' + esc(INS.sym) + ' over the last ' + lbl + '.' :
    'Over the last ' + lbl + ', ' + esc(INS.sym) + ' insiders made <b class="down">' + sl.n + ' sale' + (sl.n === 1 ? '' : 's') + '</b> worth <b class="down">' + insMoney(sl.v) +
    '</b> and <b class="up">' + b.n + ' purchase' + (b.n === 1 ? '' : 's') + '</b> worth <b class="up">' + insMoney(b.v) + '</b> on the open market.';
  var tilt = ratio == null ? '—' : ratio >= .6 ? 'Buying' : ratio <= .4 ? 'Selling' : 'Mixed';
  $('insStats').innerHTML = [
    [(net >= 0 ? '+' : '') + insMoney(net), 'Net insider flow', net >= 0 ? 'up' : 'down'],
    ['<span class="ins-meter" title="Share of buy value"><i style="--w:' + Math.round((ratio || 0) * 100) + '%"></i></span>' + tilt, 'Buy / sell balance'],
    [String(Object.keys(people).length), 'Insiders trading'],
    [String(rs.filter(function(r){ return r.kind === 'other'; }).length), 'Grants, tax & other'],
    [rs[0] ? insDate(rs[0].d) : '—', 'Latest trade']
  ].map(function(x, i){ return '<div class="gu-stat" style="--d:' + (i * 50) + 'ms"><b class="num ' + (x[2] || '') + '">' + x[0] + '</b><span>' + x[1] + '</span></div>'; }).join('');
}

function insGroups(rows){
  var m = {};
  rows.forEach(function(r){
    if(!INS.show[r.kind]) return;
    var k = r.d + r.kind, g = m[k] || (m[k] = { k:k, d:r.d, kind:r.kind, v:0, px:0, n:0, rows:[] });
    g.v += Math.abs(r.val || 0); g.px += r.px || 0; g.n++; g.rows.push(r);
  });
  return Object.keys(m).map(function(k){ var g = m[k]; g.px /= g.n; return g; }).sort(function(a, b){ return a.d < b.d ? -1 : 1; });
}

function insPaintChart(){
  var box = $('insChart');
  if(!box) return;
  $('insLegend').innerHTML = [['close', 'Closing price'], ['buy', 'Purchase'], ['sell', 'Sale'], ['other', 'Grant / tax / other']].map(function(l){
    return '<button data-il="' + l[0] + '" class="lg-' + l[0] + (INS.show[l[0]] ? ' on' : '') + '" aria-pressed="' + INS.show[l[0]] + '"><i></i>' + l[1] + '</button>';
  }).join('') + '<span class="gu-sub">Bubble size = trade value · click a bubble to see its trades</span>';
  var from = insFrom(), hist = INS.hist.filter(function(r){ return r.d >= from; });
  var groups = insGroups(insInPeriod());
  var W = Math.max(300, box.clientWidth), H = W < 600 ? 230 : 320, P = { l:6, r:52, t:18, b:26 };
  if(!hist.length && !groups.length){ box.innerHTML = '<div class="empty" style="padding:40px 0;text-align:center">No price history or trades to plot.</div>'; return; }
  var t0 = new Date(from + 'T00:00:00').getTime(), t1 = Date.now();
  var X = function(d){ return P.l + (new Date(d + 'T00:00:00').getTime() - t0) / (t1 - t0) * (W - P.l - P.r); };
  var closeAt = function(d){                                  // last close on or before d
    var lo = 0, hi = hist.length - 1, ans = null;
    while(lo <= hi){ var mid = (lo + hi) >> 1; if(hist[mid].d <= d){ ans = hist[mid].c; lo = mid + 1; } else hi = mid - 1; }
    return ans;
  };
  groups.forEach(function(g){ g.y = closeAt(g.d); if(g.y == null) g.y = g.px || null; });
  groups = groups.filter(function(g){ return g.y != null; });
  var vals = hist.map(function(r){ return r.c; }).concat(groups.map(function(g){ return g.y; }));
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), pad = (hi - lo) * .12 || hi * .1 || 1;
  lo = Math.max(0, lo - pad); hi += pad;
  var Y = function(v){ return P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b); };
  var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '"><defs><linearGradient id="insFill" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="var(--mf-gold)" stop-opacity=".28"/><stop offset="1" stop-color="var(--mf-gold)" stop-opacity="0"/></linearGradient></defs>';
  for(var i = 0; i <= 4; i++){
    var v = lo + (hi - lo) * i / 4, y = Y(v);
    svg += '<line class="gl" x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y + '" y2="' + y + '"/><text class="ax" x="' + (W - P.r + 8) + '" y="' + (y + 4) + '">' + num(v, v < 10 ? 2 : 0) + '</text>';
  }
  var months = Math.round(INS.period / 30), step = Math.max(1, Math.ceil(months / (W < 600 ? 4 : 7))), seen = 0;
  for(var m = new Date(t0); m.getTime() <= t1; m.setMonth(m.getMonth() + 1, 1)){
    if(m.getTime() < t0 || seen++ % step) continue;
    var mx = X(ymd(m));
    svg += '<text class="ax" x="' + mx + '" y="' + (H - 6) + '" text-anchor="middle">' + m.toLocaleDateString('en-US', INS.period > 365 ? { month:'short', year:'2-digit' } : m.getMonth() ? { month:'short' } : { year:'numeric' }) + '</text>';
  }
  if(hist.length && INS.show.close){
    var line = hist.map(function(r, i){ return (i ? 'L' : 'M') + X(r.d).toFixed(1) + ' ' + Y(r.c).toFixed(1); }).join('');
    svg += '<path class="area" d="' + line + 'L' + X(hist[hist.length - 1].d).toFixed(1) + ' ' + (H - P.b) + 'L' + X(hist[0].d).toFixed(1) + ' ' + (H - P.b) + 'Z"/>' +
      '<path class="ln" pathLength="1" d="' + line + '"/>';
  }
  var maxV = Math.max.apply(null, groups.map(function(g){ return g.v; }).concat([1]));
  /* biggest first so small bubbles stay clickable on top */
  groups.slice().sort(function(a, b){ return b.v - a.v; }).forEach(function(g, j){
    var r = 4 + 13 * Math.sqrt(g.v / maxV);
    svg += '<circle class="bub ' + g.kind + (INS.day === g.d ? ' sel' : '') + '" data-k="' + g.k + '" cx="' + X(g.d).toFixed(1) + '" cy="' + Y(g.y).toFixed(1) + '" r="' + r.toFixed(1) +
      '" style="--d:' + Math.min(900, 300 + j * 12) + 'ms"/>';
  });
  svg += '<line class="xh" id="insXh" y1="' + P.t + '" y2="' + (H - P.b) + '"/><circle class="xd" id="insXd" r="4"/></svg>';
  box.innerHTML = svg + '<div class="ins-tip" id="insTip"></div>';
  var byK = {}; groups.forEach(function(g){ byK[g.k] = g; });
  var el = box.querySelector('svg'), tip = $('insTip'), xh = $('insXh'), xd = $('insXd');
  function tipAt(x, y, html){
    tip.innerHTML = html; tip.classList.add('on');
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.max(0, Math.min(W - tw, x + 14 + tw > W ? x - tw - 14 : x + 14)) + 'px';
    tip.style.top = Math.max(0, Math.min(H - th, y - th / 2)) + 'px';
  }
  function tradesHTML(g){
    return '<div class="tt ' + g.kind + '">' + g.n + ' ' + (g.kind === 'buy' ? 'purchase' : g.kind === 'sell' ? 'sale' : 'other filing') + (g.n === 1 ? '' : 's') + ' · ' + insMoney(g.v) + '</div>' +
      g.rows.slice(0, 4).map(function(r){ return '<div class="tr"><span>' + esc(r.name) + '</span><b class="num">' + (r.qty == null ? '' : num(Math.abs(r.qty), 0)) + (r.px ? ' @ $' + num(r.px, 2) : '') + '</b></div>'; }).join('') +
      (g.rows.length > 4 ? '<div class="tr mut">+' + (g.rows.length - 4) + ' more</div>' : '');
  }
  el.onmousemove = function(e){
    var rc = el.getBoundingClientRect(), x = e.clientX - rc.left, b = e.target.closest('.bub');
    if(b){
      var g = byK[b.getAttribute('data-k')];
      xh.style.opacity = xd.style.opacity = 0;
      return tipAt(+b.getAttribute('cx'), +b.getAttribute('cy'), '<div class="td">' + insDate(g.d) + ' · close $' + num(g.y, 2) + '</div>' + tradesHTML(g));
    }
    if(!hist.length || !INS.show.close){ tip.classList.remove('on'); return; }
    var best = hist[0], bd = Infinity;
    hist.forEach(function(r){ var dd = Math.abs(X(r.d) - x); if(dd < bd){ bd = dd; best = r; } });
    var hx = X(best.d), hy = Y(best.c);
    xh.setAttribute('x1', hx); xh.setAttribute('x2', hx); xd.setAttribute('cx', hx); xd.setAttribute('cy', hy);
    xh.style.opacity = xd.style.opacity = 1;
    var same = ['buy', 'sell', 'other'].map(function(k){ return byK[best.d + k]; }).filter(Boolean);
    tipAt(hx, hy, '<div class="td">' + insDate(best.d) + '</div><div class="tp num">$' + num(best.c, 2) + '</div>' + same.map(tradesHTML).join(''));
  };
  el.onmouseleave = function(){ tip.classList.remove('on'); xh.style.opacity = xd.style.opacity = 0; };
  el.onclick = function(e){
    var b = e.target.closest('.bub');
    if(!b) return;
    var d = byK[b.getAttribute('data-k')].d;
    INS.day = INS.day === d ? '' : d; INS.shown = 40;
    $$('#insChart .bub').forEach(function(x){ x.classList.toggle('sel', !!INS.day && x.getAttribute('data-k').indexOf(INS.day) === 0); });
    insPaintTable();
    if(INS.day) $('insTable').scrollIntoView({ behavior:'smooth', block:'nearest' });
  };
}

function insPaintWho(){
  var m = {};
  insInPeriod().forEach(function(r){
    if(r.kind === 'other') return;
    var p = m[r.name] || (m[r.name] = { name:r.name, title:r.title, b:0, s:0, n:0 });
    p[r.kind === 'buy' ? 'b' : 's'] += Math.abs(r.val || 0); p.n++;
  });
  var ps = Object.keys(m).map(function(k){ return m[k]; }).sort(function(a, b){ return (b.b + b.s) - (a.b + a.s); }).slice(0, 8);
  var max = Math.max.apply(null, ps.map(function(p){ return Math.max(p.b, p.s); }).concat([1]));
  $('insWho').innerHTML = !ps.length ? '<div class="gu-sub">No open-market buys or sales in this period.</div>' :
    '<div class="ins-who-axis"><span class="down">Sold</span><span class="up">Bought</span></div>' +
    ps.map(function(p, i){
      return '<button class="ins-who' + (INS.who === p.name ? ' on' : '') + '" data-iw="' + esc(p.name) + '" style="--d:' + (i * 50) + 'ms" title="Show only ' + esc(p.name) + '’s trades">' +
        '<span class="nm"><b>' + esc(p.name) + '</b><small>' + esc(p.title) + ' · ' + p.n + ' trade' + (p.n === 1 ? '' : 's') + '</small></span>' +
        '<span class="bars"><span class="s"><i style="--w:' + (p.s / max * 100).toFixed(1) + '%"></i></span><span class="b"><i style="--w:' + (p.b / max * 100).toFixed(1) + '%"></i></span></span>' +
        '<span class="vv num"><span class="down">' + (p.s ? insMoney(-p.s) : '') + '</span><span class="up">' + (p.b ? insMoney(p.b) : '') + '</span></span></button>';

function insCSV(){
  var rs = insFiltered(), head = ['filed', 'trade_date', 'ticker', 'insider', 'title', 'trade_type', 'kind', 'price', 'qty', 'owned', 'delta_own', 'value', 'filing_url'];
  if(!rs.length) return toast('No filings to export');
  var name = INS.sym + '_insiders_' + ymd(new Date()).replace(/-/g, '') + '.csv';
  download(name, [head].concat(rs.map(function(r){
    return [r.filed, r.d, INS.sym, r.name, r.title, r.type, r.kind, r.px, r.qty, r.own, r.dOwn, r.val, r.url];
  })).map(function(r){ return r.map(csvCell).join(','); }).join('\n'));
  toast('Exported ' + rs.length + ' filings to ' + name);
}

function insFiltered(){
  var rs = insInPeriod().filter(function(r){
    return (INS.type === 'all' || r.kind === INS.type) && (!INS.who || r.name === INS.who) && (!INS.day || r.d === INS.day) &&
      (!INS.q || (r.name + ' ' + r.title).toLowerCase().indexOf(INS.q) >= 0);
  });
  var k = INS.sort, dir = INS.dir;
  rs.sort(function(a, b){
    var x = a[k], y = b[k];
    if(k === 'val' || k === 'qty'){ x = Math.abs(x || 0); y = Math.abs(y || 0); }
    if(x == null) return 1; if(y == null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * dir || (a.filed < b.filed ? 1 : -1);
  });
  return rs;
}

  }).join('') + '</tr>';

  }).join('');
  $('insTable').innerHTML = !rs.length ? '<div class="empty" style="padding:28px 0;text-align:center">No trades match these filters.</div>' :
    '<div class="ins-twrap"><table class="ins-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
    '<div class="ins-tfoot"><span class="gu-sub">Showing ' + Math.min(INS.shown, rs.length) + ' of ' + rs.length + ' filings</span>' +
    (rs.length > INS.shown ? '<button class="btn text" data-imore="1">Show more</button>' : '') + '</div>';
}

function filCat(r){

/* Same block-aware text extraction as edgar_filings.html_to_text, for the no-server path. */
function filHtmlText(html){

/* Split extracted text into display lines; "Item 7." alone on a line joins its title. */
function filLines(text){

    var t = raw[i].trim();
    if(!t) continue;
    if(/^item\s+\d+[a-c]?\.?$/i.test(t) && raw[i + 1] && raw[i + 1].length < 120){ t += ' ' + raw[i + 1].trim(); i++; }
    out.push({ t:t, h:t.length < 140 && /^(part\s+[iv]+\b|item\s+\d+[a-c]?[.:\s])/i.test(t) });

/* Jump list: last occurrence of each heading, so the table of contents doesn't win. */

  return Object.keys(last).map(function(k){ return { i:last[k], t:lines[last[k]].t }; }).sort(function(a, b){ return a.i - b.i; });

/* What Marvell gets: the whole text when it fits, else risk factors + MD&A (where things hide). */
function filExcerpt(lines, max){

  if(full.length <= max) return full;
  var secs = filSections(lines), part = function(re, cap){
    var s = secs.filter(function(x){ return re.test(x.t); }).pop();
    return s ? lines.slice(s.i).map(function(l){ return l.t; }).join('\n').slice(0, cap) : '';
  };
  var risk = part(/risk factors/i, max / 2), pick = [risk, part(/management.s discussion/i, max - risk.length)].filter(Boolean);   // MD&A gets what risk factors leave

function drawCompareChart(syms){
  var host = $('cmpChart');
  if(!host) return;
  var series = syms.map(function(s){
    var h = DATA.hist['cmp1y_' + s] || DATA.hist['h3_' + sq(s) + '_380'] || [];
    if(h.length < 2) return null;
    var base = h[0].c;
    return { sym:s, pts:h.map(function(r){ return { d:r.d, v:(r.c / base - 1) * 100 }; }) };
  }).filter(Boolean);
  if(!series.length){ host.innerHTML = '<div class="empty">History unavailable for these symbols right now.</div>'; return; }
  var W = 1000, H = 300, padL = 8, padR = 64, padT = 12, padB = 24;
  var all = [];
  series.forEach(function(s){ s.pts.forEach(function(p){ all.push(p.v); }); });
  var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all), sp = (mx - mn) || 1;
  mn -= sp * .08; mx += sp * .08; sp = mx - mn;
  var maxLen = Math.max.apply(null, series.map(function(s){ return s.pts.length; }));
  var X = function(i){ return padL + (i / Math.max(1, maxLen - 1)) * (W - padL - padR); };
  var Y = function(v){ return padT + (H - padT - padB) - ((v - mn) / sp) * (H - padT - padB); };
  var out = [];
  for(var g = 0; g <= 4; g++){
    var yy = padT + ((H - padT - padB) / 4) * g;
    var val = mx - (sp / 4) * g;
    out.push('<line class="gridline" x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '"/>');
    out.push('<text class="axis" x="' + (W - padR + 8) + '" y="' + (yy + 4) + '">' + num(val, 1) + '%</text>');
  }
  if(mn <= 0 && mx >= 0) out.push('<line x1="' + padL + '" y1="' + Y(0) + '" x2="' + (W - padR) + '" y2="' + Y(0) + '" stroke="var(--fh-foreground-on-surface-de-emphasis)" stroke-dasharray="4 4"/>');
  series.forEach(function(s, i){
    var d = s.pts.map(function(p, j){ return (j ? 'L' : 'M') + X(j).toFixed(1) + ' ' + Y(p.v).toFixed(1); }).join(' ');
    out.push('<path d="' + d + '" fill="none" stroke="' + CHART_PALETTE[i % CHART_PALETTE.length] + '" stroke-width="2"/>');
  });
  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + out.join('') + '</svg>' +
    '<div class="legend" style="margin-top:8px">Normalized to 0% at the start of the series · 1 year of daily closes</div>';
}

function computeStats(){
  var sym = dispSym(CUR.sym);
  var h = DATA.hist['h3_' + sq(sym) + '_380'] || loadHistCache(sym, 380) || DATA.hist['q_' + sym + '_1Y'] || [];
  if(h.length > 200) DATA.hist['q_' + sym + '_1Y'] = h;
  var closes = h.map(function(r){ return r.c; });
  var vols = h.map(function(r){ return r.v || 0; }).filter(function(v){ return v > 0; });
  var stats = { hi52:null, lo52:null, avgVol:null, beta:null, ytd:null, ret1y:null };
  if(closes.length > 2){
    var yr = h.filter(function(r){ return Date.parse(r.d) > Date.now() - 365 * 864e5; });
    var yc = yr.length > 2 ? yr.map(function(r){ return r.c; }) : closes;
    stats.hi52 = Math.max.apply(null, yc);
    stats.lo52 = Math.min.apply(null, yc);
    stats.ret1y = (yc[yc.length - 1] / yc[0] - 1) * 100;
    var jan = new Date().getFullYear() + '-01-01', ytdBase = null;
    for(var i = 0; i < h.length; i++){ if(h[i].d >= jan){ ytdBase = h[i].c; break; } }
    if(ytdBase) stats.ytd = (closes[closes.length - 1] / ytdBase - 1) * 100;
  }
  if(vols.length){ var last = vols.slice(-63); stats.avgVol = last.reduce(function(a, b){ return a + b; }, 0) / last.length; }
  var idx = DATA.hist['h3_' + sq('SPY') + '_380'] || loadHistCache('SPY', 380);
  if(idx && idx.length > 30 && h.length > 30){
    var byDate = {}, idxByDate = {};
    h.forEach(function(r){ byDate[r.d] = r.c; });
    idx.forEach(function(r){ idxByDate[r.d] = r.c; });
    var dates = idx.map(function(r){ return r.d; }).filter(function(d){ return byDate[d]; });
    var ra = [], rb = [];
    for(var j = 1; j < dates.length; j++){
      ra.push(byDate[dates[j]] / byDate[dates[j - 1]] - 1);
      rb.push(idxByDate[dates[j]] / idxByDate[dates[j - 1]] - 1);
    }
    if(ra.length > 20){
      var ma = ra.reduce(function(x, y){ return x + y; }, 0) / ra.length;
      var mb = rb.reduce(function(x, y){ return x + y; }, 0) / rb.length;
      var cov = 0, varb = 0;
      for(var k2 = 0; k2 < ra.length; k2++){ cov += (ra[k2] - ma) * (rb[k2] - mb); varb += Math.pow(rb[k2] - mb, 2); }
      if(varb) stats.beta = cov / varb;
    }
  }
  Q.stats = stats;
  return stats;
}

  return list;
}

function targetChartHTML(a, price, cur){
  if(!a.target || !price) return '<div class="empty">No consensus target available for this instrument yet. Enter one on the left to plot the range.</div>';
  var t = parseFloat(a.target), lo = parseFloat(a.lo), hi = parseFloat(a.hi);
  if(!isFinite(lo)) lo = Math.min(t, price); if(!isFinite(hi)) hi = Math.max(t, price);
  if(lo > hi){ var sw = lo; lo = hi; hi = sw; }
  var mn = Math.min(lo, price, t), mx = Math.max(hi, price, t), pad = (mx - mn || mx * .1 || 1) * .06;
  mn -= pad; mx += pad;
  var X = function(v){ return Math.max(0, Math.min(100, (v - mn) / (mx - mn) * 100)); };
  var lab = function(x){ return 'left:min(max(' + x.toFixed(2) + '%,18%),82%)'; };   // keep labels inside the card; the marker itself stays exact
  var up = (t / price - 1) * 100;
  return '<div class="tc">' +
    '<div class="tc-track"></div>' +
    '<div class="tc-band" style="left:' + X(lo).toFixed(2) + '%;width:' + Math.max(0.8, X(hi) - X(lo)).toFixed(2) + '%"></div>' +
    '<div class="tc-stem tc-up" style="left:' + X(price).toFixed(2) + '%"></div><i class="tc-dot tc-px" style="left:' + X(price).toFixed(2) + '%"></i>' +
    '<div class="tc-lab tc-top" style="' + lab(X(price)) + '"><span>Price</span><b class="num">' + money(price, cur) + '</b></div>' +
    '<div class="tc-stem tc-down" style="left:' + X(t).toFixed(2) + '%"></div><i class="tc-dot tc-tg" style="left:' + X(t).toFixed(2) + '%"></i>' +
    '<div class="tc-lab tc-bot" style="' + lab(X(t)) + '"><span>Avg target <em class="' + (up >= 0 ? 'up' : 'down') + '">' + pct(up, 1) + '</em></span><b class="num tc-gold">' + money(t, cur) + '</b></div>' +
    '</div>' +
    '<div class="tc-ends"><span>Low <b class="num">' + money(lo, cur) + '</b></span><span>High <b class="num">' + money(hi, cur) + '</b></span></div>';
}

function drawFinChart(){
  var host = $('finChart');
  if(!host) return;
  var data = Q.fin.data || SAMPLE_FIN[Q.fin.kind];
  var rows = data.rows.slice(0, 6);
  var all = [];
  rows.forEach(function(r){ r.slice(1).forEach(function(v){ if(isFinite(v)) all.push(Math.abs(v)); }); });
  var mx = Math.max.apply(null, all.concat([1]));
  var W = 1000, H = 240, padB = 46, padT = 10, groupW = (W - 40) / rows.length;
  var out = [];
  rows.forEach(function(r, gi){
    var vals = r.slice(1);
    var bw = (groupW - 18) / Math.max(1, vals.length);
    vals.forEach(function(v, i){
      var h = (Math.abs(v) / mx) * (H - padT - padB);
      var x = 20 + gi * groupW + i * bw;
      out.push('<rect x="' + x.toFixed(1) + '" y="' + (H - padB - h).toFixed(1) + '" width="' + Math.max(2, bw - 3).toFixed(1) + '" height="' + Math.max(1, h).toFixed(1) +
        '" rx="2" fill="' + CHART_PALETTE[i % CHART_PALETTE.length] + '" opacity=".9"/>');
    });
    out.push('<text class="axis" x="' + (20 + gi * groupW + (groupW - 18) / 2) + '" y="' + (H - padB + 18) + '" text-anchor="middle">' + esc(String(r[0]).slice(0, 14)) + '</text>');
  });
  var legend = data.cols.map(function(c, i){
    return '<span><span class="sw" style="background:' + CHART_PALETTE[i % CHART_PALETTE.length] + '"></span>' + esc(c) + '</span>';
  }).join('');
  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' + out.join('') + '</svg><div class="legend" style="margin-top:8px">' + legend + '</div>';
}

function attImage(file){

      URL.revokeObjectURL(url);

function attPdf(file){

    document.head.appendChild(sc);

    return file.arrayBuffer();

function attAdd(files){
  [].slice.call(files).forEach(function(f){

    var t = f.type || '';
    if(/^(video|audio)\//.test(t)){ toast(f.name + ': videos and audio aren’t supported'); return; }
    var p;
    if(/^image\/(png|jpeg|webp|gif)$/.test(t)){ if(f.size > 20e6){ toast(f.name + ' is over 20 MB'); return; } p = attImage(f); }
    else if(t === 'application/pdf' || /\.pdf$/i.test(f.name)){ if(f.size > 25e6){ toast(f.name + ' is over 25 MB'); return; } p = attPdf(f); }
    else if(/^text\//.test(t) || ATT_TEXT.test(f.name) || t === 'application/json'){

/* Where a provider's request goes and in which wire format:

function aiEndpoint(prov, model){
  if(prov === 'anthropic') return { prov:prov, wire:'a', url:'https://api.anthropic.com/v1/messages' };
  if(prov === 'gemini') return { prov:prov, wire:'g', url:'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent' };
  var BASE = { openai:'https://api.openai.com/v1', xai:'https://api.x.ai/v1', deepseek:'https://api.deepseek.com',
    groq:'https://api.groq.com/openai/v1', openrouter:'https://openrouter.ai/api/v1',
    'opencode-go':'https://opencode.ai/zen/go/v1', opencode:'https://opencode.ai/zen/v1' };
  var w = aiWire(prov, model);
  var url = prov === 'custom' ? (KEYS.url || 'https://api.openai.com/v1/chat/completions')
    : (BASE[prov] || BASE.openai) + (w === 'r' ? '/responses' : w === 'm' ? '/messages' : '/chat/completions');

  } else if(ep.wire === 'g'){
    body.generationConfig = Object.assign(body.generationConfig || {}, { thinkingConfig:{ thinkingBudget:GEMINI_THINK_BUDGET[effortKey] || 2048 } });
  } else if(ep.wire === 'r'){
    body.reasoning = { effort:lvl };
  } else if(ep.prov === 'openrouter'){
    body.reasoning = { effort:lmh };
  } else if(ep.prov === 'openai'){
    if(noTemp(model)) body.reasoning_effort = lvl;
  } else if(ep.prov === 'deepseek'){

/* Candle loop: 3 candles; the right-hand one is live (body and wicks move, red or green) and locks when the next one arrives.
   Every candle has its own size: a few tall, the rest short. */
var TKC = { cs:[], shift:0, t:0 };
function tkcNew(o){ return { o:o, c:o, sz:Math.random() < .4 ? .95 + Math.random() * .35 : .38 + Math.random() * .32, v:(Math.random() - .5) * .2, wu:.04 + Math.random() * .08, wl:.04 + Math.random() * .08 }; }
function tkcStep(){
  var cs = TKC.cs, L = cs[cs.length - 1];
  L.v = L.v * .75 + (Math.random() - .5) * .42;   // momentum, so the body swings rather than jitters
  L.c = Math.max(.06, Math.min(.94, L.c + L.v)); if(L.c <= .06 || L.c >= .94) L.v = -L.v * .8;
  L.wu = Math.max(.02, Math.min(.34, L.wu + (Math.random() - .5) * .22));
  L.wl = Math.max(.02, Math.min(.34, L.wl + (Math.random() - .5) * .22));
  if(++TKC.t % 15 === 0){ cs.push(tkcNew(L.c)); cs.shift(); TKC.shift = 14; }   // ~1.6s: lock it, open the next at its close
  if(TKC.shift > 0) TKC.shift = Math.max(0, TKC.shift - 3.5);
  var H = 25, y = function(p){ return (1.5 + (1 - p) * H).toFixed(1); };
  var html = cs.map(function(k, i){
    var x = 7 + (i - 1) * 14 + TKC.shift, up = k.c >= k.o, col = up ? 'var(--fh-positive,#34a853)' : 'var(--fh-negative,#ea4335)';
    var f = function(p){ return k.o + (p - k.o) * k.sz; };
    var top = f(Math.max(k.o, k.c)), bot = f(Math.min(k.o, k.c)), hy = y(Math.min(1, top + k.wu * k.sz)), ly = y(Math.max(0, bot - k.wl * k.sz));
    var by = y(top), bh = Math.max(2, (top - bot) * H).toFixed(1), o = i === 0 ? Math.min(1, x / 7 + .2) : 1;
    return '<g opacity="' + Math.max(0, o) + '"><line x1="' + x + '" x2="' + x + '" y1="' + hy + '" y2="' + ly + '" stroke="' + col + '" stroke-width="1.1" stroke-linecap="round"/>' +
      '<rect x="' + (x - 2.5) + '" y="' + by + '" width="5" height="' + bh + '" rx="1.2" fill="' + col + '"/></g>';
  }).join('');
  [].forEach.call(document.querySelectorAll('.tk-candles'), function(svg){ svg.innerHTML = html; });
}
/* Shared by the Agent chat and Deep Research; the timers run while either needs them. */
function thinkStart(key){
  THINK.users[key] = 1;
  if(THINK.timer) return;
  THINK.i = 0;
  THINK.order = THINK_VERBS.slice().sort(function(){ return Math.random() - 0.5; });   // shuffled, no repeats until the list is exhausted
  var p = .5, seed = [];
  for(var q = 0; q < 4; q++){ var k = tkcNew(p); k.c = Math.max(.15, Math.min(.85, p + (Math.random() - .5) * .4)); p = k.c; seed.push(k); }
  TKC.cs = seed; TKC.shift = 0; TKC.t = 0; TKC.timer = null;
  THINK.ctimer = setInterval(tkcStep, 105);
  THINK.timer = setInterval(function(){
    THINK.i++;
    var vs = document.querySelectorAll('.tk-v');
    [].forEach.call(vs, function(v){ v.classList.add('out'); });
    setTimeout(function(){ [].forEach.call(document.querySelectorAll('.tk-v'), function(v){ v.textContent = thinkVerb() + '…'; v.classList.remove('out'); }); }, 220);

function pickFile(accept, cb){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = accept;
  inp.style.display = 'none';
  inp.addEventListener('change', function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){ cb(String(rd.result), f.name); inp.remove(); };
    rd.readAsText(f);
  });
  document.body.appendChild(inp);
  inp.click();
}

  document.body.appendChild(a);

}

    var iS = head.findIndex(function(h){ return h.indexOf('sym') >= 0 || h === 'ticker'; });
    var iQ = head.findIndex(function(h){ return h.indexOf('qty') >= 0 || h.indexOf('share') >= 0; });
    var iP = head.findIndex(function(h){ return h.indexOf('cost') >= 0 || h.indexOf('price') >= 0 || h.indexOf('avg') >= 0; });
    if(iS < 0){ toast('CSV needs a symbol column.'); return; }
    var added = 0;
    grid.slice(1).forEach(function(r){

      added++;
    });
    savePfs(); renderPortfolio(); toast(added + ' holdings imported');
  });
}

function rsShowTab(tab, focus){

/* ---- Task list + progress: planned when a run starts, ticked as the agent finishes each job ---- */
function rsPlan(){
  var t = [{ id:'scope', label:'Understand the question' }];
  if(rsFocusOn('auto')) t.push({ id:'gather', label:'Gather relevant sources' }, { id:'filter', label:'Filter noise from signal' }, { id:'check', label:'Cross-check key facts' });
  else RS_FOCUS.filter(function(x){ return x.id !== 'auto' && rsFocusOn(x.id); }).forEach(function(x){ t.push({ id:x.id, label:x.label === 'Auto' ? x.label : x.label, kw:x.kw }); });
  t.push({ id:'write', label:'Write the report' });
  RS.tasks = t.map(function(x){ return { id:x.id, label:x.label, kw:x.kw || null, st:'todo' }; });
  RS.cur = 0; RS.round = 0; RS.t0 = Date.now(); RS.planId = String(RS.t0); RS.tasks[0].st = 'active';
}
function rsTaskAdvance(to){   // everything before `to` is finished; `to` becomes the active job
  if(!RS.tasks || to <= RS.cur && RS.tasks[RS.cur].st === 'active') return;
  to = Math.min(to, RS.tasks.length - 1);
  for(var i = 0; i < to; i++) RS.tasks[i].st = 'done';
  if(RS.tasks[to].st !== 'done') RS.tasks[to].st = 'active';
  RS.cur = Math.max(RS.cur, to);
}
function rsTaskEvent(o){
  if(!RS.tasks) return;
  var n = RS.tasks.length;
  if(o.kind === 'round_start'){
    RS.round = o.round || (RS.round + 1);
    if(RS.round >= 1) rsTaskAdvance(Math.max(RS.cur, 1));          // scoping is done once research begins
    if(rsFocusOn('auto')){                                         // no topics to match: advance with the rounds
      var step = Math.min(n - 2, Math.floor((RS.round - 1) / 2) + 1);
      rsTaskAdvance(Math.max(RS.cur, step));
    }
  } else if(o.kind === 'tool_call' || o.kind === 'phase'){
    var hay = (o.name || '') + ' ' + (o.label || '') + ' ' + (o.args ? JSON.stringify(o.args) : '');
    for(var i = RS.tasks.length - 2; i >= 1; i--){
      if(RS.tasks[i].kw && RS.tasks[i].kw.test(hay)){ rsTaskAdvance(Math.max(RS.cur, i)); break; }
    }
    if(/answer|final|report|write/i.test((o.label || '') + (o.name || ''))) rsTaskAdvance(n - 1);
  } else if(o.kind === 'token' && RS.cur < n - 1 && RS.tokens.length > 200){
    rsTaskAdvance(n - 1);                                          // the report is being written
  }
}
function rsTaskFinish(ok){
  if(!RS.tasks) return;
  RS.tasks.forEach(function(t){ if(ok) t.st = 'done'; else if(t.st === 'active') t.st = 'todo'; });
  if(ok) RS.cur = RS.tasks.length - 1;
}
function rsProgress(){
  if(!RS.tasks) return 0;
  var done = RS.tasks.filter(function(t){ return t.st === 'done'; }).length, act = RS.tasks.some(function(t){ return t.st === 'active'; }) ? .5 : 0;
  return Math.min(1, (done + act) / RS.tasks.length);
}
function rsClock(ms){ var s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function rsLiveHTML(){
  if(!RS.tasks) return '<div id="rsLive" hidden></div>';
  return '<div id="rsLive" data-plan="' + RS.planId + '"><div class="rs-think"' + (RS.running ? '' : ' hidden') + '>' + (RS.running ? thinkHTML() : '') + '</div>' +
    '<div class="rs-prog' + (RS.running ? ' run' : '') + '" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="rsBar" style="width:' + Math.round(rsProgress() * 100) + '%"></i></div>' +
    '<div class="rs-pm"><span id="rsPm"></span><span id="rsEl"></span></div>' +
    '<ul class="rs-tasks" id="rsTasks">' + RS.tasks.map(function(t){ return '<li class="' + t.st + '" data-id="' + t.id + '"><i class="tick"></i><span>' + esc(t.label) + '</span></li>'; }).join('') + '</ul></div>';
}
function rsLiveSync(){
  var live = $('rsLive'); if(!live || !RS.tasks) return;
  if(live.getAttribute('data-plan') !== RS.planId){ live.outerHTML = rsLiveHTML(); live = $('rsLive'); }   // new run: build the task list once
  live.hidden = false;
  var bar = $('rsBar'), p = Math.round(rsProgress() * 100);
  if(bar) bar.style.width = (RS.running ? Math.min(p, 96) : p) + '%';
  var pr = live.querySelector('.rs-prog'); if(pr){ pr.classList.toggle('run', !!RS.running); pr.classList.toggle('fin', !RS.running && p === 100); pr.setAttribute('aria-valuenow', p); }
  var done = RS.tasks.filter(function(t){ return t.st === 'done'; }).length;
  var pm = $('rsPm'); if(pm) pm.textContent = RS.running ? (done + ' of ' + RS.tasks.length + ' tasks') : (p === 100 ? 'All ' + RS.tasks.length + ' tasks complete' : done + ' of ' + RS.tasks.length + ' tasks');
  var el = $('rsEl'); if(el) el.textContent = rsClock(((RS.running ? Date.now() : RS.tEnd) || Date.now()) - RS.t0);
  [].forEach.call(live.querySelectorAll('.rs-tasks li'), function(li, i){ var t = RS.tasks[i]; if(t && li.className !== t.st) li.className = t.st; });
  var th = live.querySelector('.rs-think');
  if(th){ if(RS.running && th.hidden){ th.hidden = false; th.innerHTML = thinkHTML(); } else if(!RS.running && !th.hidden){ th.hidden = true; th.innerHTML = ''; } }
}

function rsPlain(t){ return String(t || '').replace(/\s*\[(\d{1,3})\]/g, '').replace(/\*\*([^*]+)\*\*/g, '$1').replace(/`([^`]+)`/g, '$1').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/^[#>\-*\s\d.]+/gm, function(m){ return /[-*\d]/.test(m) ? '• ' : ''; }).trim(); }
function rsSummary(md){
  md = String(md || ''); var m = md.match(/^#{1,6}\s*(summary|tl;?dr|conclusion|bottom line|verdict|key takeaways?)[^\n]*\n([\s\S]*?)(?=\n#{1,6}\s|(?![\s\S]))/im), body = m ? m[2] : '';

  var out = rsPlain(body).split(/\n/).filter(Boolean).slice(0, 4).join('\n');

function rsInline(t){
  return t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[(\d{1,3})\]/g, '<sup><a href="#rs-cite-$1">$1</a></sup>');
}

function rsMarkdown(md){
  var lines = esc(String(md || '')).split('\n');
  var out = [], mode = null;
  function close(){
    if(mode === 'ul' || mode === 'ol') out.push('</' + mode + '>');
    else if(mode === 'p') out.push('</p>');
    mode = null;
  }
  lines.forEach(function(raw){
    var line = raw.replace(/\s+$/, ''), m;
    if(!line.trim()){ close(); return; }
    if((m = line.match(/^(#{1,6})\s+(.*)$/))){ close(); out.push('<h4>' + rsInline(m[2]) + '</h4>'); return; }
    if(/^\s*[-*]\s+/.test(line)){
      if(mode !== 'ul'){ close(); out.push('<ul>'); mode = 'ul'; }
      out.push('<li>' + rsInline(line.replace(/^\s*[-*]\s+/, '')) + '</li>');
      return;
    }
    if(/^\s*\d+\.\s+/.test(line)){
      if(mode !== 'ol'){ close(); out.push('<ol>'); mode = 'ol'; }
      out.push('<li>' + rsInline(line.replace(/^\s*\d+\.\s+/, '')) + '</li>');
      return;
    }
    if(/^-{3,}$/.test(line.trim())){ close(); out.push('<hr>'); return; }
    if(mode !== 'p'){ close(); out.push('<p>'); mode = 'p'; } else { out.push('<br>'); }
    out.push(rsInline(line));
  });
  close();
  return out.join('');
}
function rsReportHTML(){
  var body = RS.report || RS.tokens || '';
  var h = '';
  if(RS.error) h += '<div class="msg err" style="margin-top:12px"><b>Research failed</b><br>' + esc(RS.error) + '</div>';
  if(!body && !RS.error) return h;
  if(!RS.running && !RS.error && body) h = rsDoneHTML() + h;
  h += '<div class="rs-report" id="rsReportBody">' + rsMarkdown(body) + (RS.running ? '<span class="mut">▍</span>' : '') + '</div>';
  if(RS.citations && RS.citations.length){
    h += '<div class="rs-cites"><h5>Sources (' + RS.citations.length + ')</h5><ol>' +
      RS.citations.map(function(c){
        return '<li id="rs-cite-' + c.index + '"><a href="' + esc(c.url) + '" target="_blank" rel="noopener">' +
          esc(c.title || c.url) + '</a></li>';
      }).join('') + '</ol></div>';
  }
  h += '<div class="rs-actions">' +
    '</div>';
  return h;
}

function rsPaintSoon(){

function rsStep(kind, label, detail, ok){

function rsRun(){
  var qEl = $('rsQ');
  RS.question = qEl ? qEl.value.trim() : (RS.question || '');
  if(!RS.question){ toast('Type a research question first'); return; }
  var sk = skillRsResolve(RS.question);
  if(!sk.go) return;
  var prov = RS.provider || KEYS.provider || 'openrouter';
  var key = (KEYS.keysBy || {})[prov] || (prov === KEYS.provider ? KEYS.key : '');
  if(!key){ toast('Add your ' + aiProvLabel(prov) + ' key under Keys first'); return; }
  RS.provider = prov;
  if(!RS.model) RS.model = RS_DEFAULT_MODEL[prov] || AI_DEFAULT_MODEL[prov] || '';
  rsSaveCfg();
  RS.running = true; RS.steps = []; RS.report = ''; RS.tokens = ''; RS.error = null; RS.tEnd = 0;
  RS.citations = []; RS.meta = { runId:'h' + Date.now().toString(36) };
  rsPlan(); thinkStart('rs');
  clearInterval(RS.clock); RS.clock = setInterval(function(){ if(RS.running) rsLiveSync(); else clearInterval(RS.clock); }, 1000);
  rsStep('round', 'Marvell harness', aiProvLabel(prov) + ' · ' + (RS.model || 'default model') + ' · ' + RS_EFFORT[rsEffortKey()].label + ' effort');
  rsPaint();
  var stop = { stopped:false };
  RS.ctl = { abort:function(){ stop.stopped = true; } };
  MH.run({ mode:'research', provider:prov, model:RS.model, key:key, effort:rsEffortKey(), system:aiSystem(), stop:stop,
    user:'Research question: ' + sk.question + rsFocusBrief() + '\n\nToday is ' + new Date().toISOString().slice(0, 10) + '.',
    onStep:function(st){
      if(st.kind === 'round'){ rsStep('round', st.label, st.detail); if(st.round) rsTaskEvent({ kind:'round_start', round:st.round }); }
      else if(st.ok === undefined){ rsStep('tool', st.label); rsTaskEvent({ kind:'tool_call', name:st.name, label:st.label, args:st.args }); }
      else { for(var i = RS.steps.length - 1; i >= 0; i--){ if(RS.steps[i].kind === 'tool' && RS.steps[i].label === st.label && RS.steps[i].ok === undefined){ RS.steps[i].ok = st.ok; if(st.error) RS.steps[i].detail = st.error.slice(0, 120); break; } } }
      rsPaintSoon();
    },
    onPlan:function(steps){
      if(!steps.length) return;
      RS.tasks = steps.map(function(x, i){ return { id:'p' + i, label:String(x.step || '').slice(0, 90), kw:null, st:x.status === 'completed' ? 'done' : x.status === 'in_progress' ? 'active' : 'todo' }; });
      RS.cur = Math.max(0, RS.tasks.map(function(t){ return t.st; }).lastIndexOf('active'));
      RS.planId = String(Date.now()); rsPaintSoon();
    }
  }).then(function(r){
    if(r.stopped){ rsStep('log', 'Stopped by you'); return; }
    RS.report = r.text; RS.citations = r.sources; RS.meta.rounds = r.rounds;
    if(!r.text) RS.error = 'the model returned an empty report';
    setTimeout(function(){ var el = $('rsResult'); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }, 350);
  }).catch(function(e){
    RS.error = String((e && e.message) || e); rsStep('log', 'Error: ' + RS.error, null, false);
  }).then(function(){
    RS.running = false; RS.tEnd = Date.now(); RS.meta.elapsedSeconds = Math.round((RS.tEnd - RS.t0) / 1000); thinkStop('rs');
    if(RS.tasks) rsTaskFinish(!RS.error && !!RS.report);
    rsLogSave(); rsPaint();
  });
}

function rsDownload(){
  var text = RS.report || RS.tokens || '';
  if(!text){ toast('Nothing to download yet'); return; }
  var day = new Date().toISOString().slice(0, 10);
  var slug = (RS.question || 'research').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').split('-').slice(0, 6).join('-') || 'research';
  var head = '# ' + (RS.question || 'Research') + '\n\n_MercerFargo Deep Research · ' + day + ' · focus: ' + rsFocusLabels().join(', ') + '_\n\n';
  var cites = (RS.citations && RS.citations.length) ? '\n\n## Sources\n' + RS.citations.map(function(c){ return c.index + '. ' + (c.title || c.url) + ' — ' + c.url; }).join('\n') : '';
  var foot = '\n\n---\nFor informational purposes only — not financial advice. Do your own research. AI can make mistakes.\n';
  var blob = new Blob([head + text + cites + foot], { type:'text/markdown;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'MercerFargo-Research_' + slug + '_' + day + '.md';

        if(!q.trim()){ toast('Type a question first.'); break; }
        aiRun('custom', q.trim());
        if($('tabPrompt')) $('tabPrompt').value = '';
        if($('pagePrompt')) $('pagePrompt').value = '';
        break;
      }
      case 'keys': openKeys(); break;
      case 'gl-toggle': {
        CFG.glopen = !CFG.glopen; saveCfg();
        var gf = $('glFull'); if(gf) gf.classList.toggle('open', CFG.glopen);
        el.setAttribute('aria-expanded', String(!!CFG.glopen)); el.textContent = CFG.glopen ? 'Hide portfolio \u2303' : 'Full portfolio \u2304';
        if(CFG.glopen) setTimeout(function(){ var g2 = $('glFull'); if(g2) g2.scrollIntoView({ behavior:'smooth', block:'nearest' }); }, 380);
        break;
      }
      case 'tour-start': ev.preventDefault(); closeMenu(); tourStart(); break;
      case 'gl-range': CFG.glr = el.getAttribute('data-r'); saveCfg(); repaintGlance(); break;
      case 'key-save': keySave(el.getAttribute('data-p'), false); break;
      case 'key-clear': keySave(el.getAttribute('data-p'), true); break;
      case 'key-test': keyTest(el, el.getAttribute('data-p')); break;
      case 'key-use': keySwitch(el.getAttribute('data-p')); KEYS.model = AI_DEFAULT_MODEL[KEYS.provider] || ''; saveKeys(); updateAiChip(); paintAiPick(); paintKeysPage(); renderPicker(); break;
      case 'settings': openSettings(); break;
      case 'dlg-close': closeDialog(); break;
      case 'auth-open': openAuth(el.getAttribute('data-m')); break;
      case 'auth-mode': openAuth(el.getAttribute('data-m')); break;
      case 'ask-ok': askOk(); break;
      case 'auth-finish': authFinish(); break;
      case 'auth-go': authGo(el.getAttribute('data-m')); break;
      case 'fb-send': fbSend(el.getAttribute('data-k')); break;
      case 'profile-save': profileSave(); break;
      case 'proxy-save': CFG.ocProxy = ($('ocProxy').value || '').trim().replace(/\/+$/, ''); saveCfg(); toast(CFG.ocProxy ? 'Proxy saved' : 'Proxy cleared'); break;
      case 'signout': closeMenu(); acctSignOut(); toast('Signed out'); break;
      case 'theme': toggleTheme(); break;
      case 'menu-more': ev.stopPropagation(); menu(el, moreMenuHTML()); break;
      case 'signin': openAuth('register'); break;
      case 'togglelist': openAddToList(sym); break;
      case 'list-add': {
        var lid = el.getAttribute('data-id'), ls = el.getAttribute('data-sym');
        if(LISTS[lid].syms.indexOf(ls) < 0) LISTS[lid].syms.push(ls);
        saveLists(); closeDialog(); renderRail(); toast(ls + ' added to ' + LISTS[lid].name);
        if(CUR.view === 'quote') paintQuote();
        break;
      }
      case 'list-new-with': {
        var nm = ($('newListName') && $('newListName').value.trim()) || 'New watchlist';
        var id = 'l' + Date.now().toString(36);
        LISTS[id] = { name:nm, syms:[sym] };
        saveLists(); closeDialog(); renderRail(); toast('Created ' + nm);
        break;
      }
      case 'newlist': {
        askText('New watchlist', 'Name', 'New watchlist', function(name){ var nid = 'l' + Date.now().toString(36); LISTS[nid] = { name:name, syms:[] }; saveLists(); renderRail(); go('#/list/' + nid); });
        break;
      }
      case 'addtolist': openAddToList(dispSym(CUR.sym)); break;
      case 'newpf': {
        askText('New portfolio', 'Name', 'Portfolio ' + (Object.keys(PFS).length + 1), function(pname){ var pid = 'p' + Date.now().toString(36); PFS[pid] = { name:pname, holdings:[] }; savePfs(); renderRail(); go('#/portfolio/' + pid); });
        break;
      }
      case 'addholding': openAddHolding(CUR.pf); break;
      case 'h-save': {
        var hSym = dispSym($('hSym').value.trim().toUpperCase());
        var hQ = parseFloat($('hQty').value) || 0, hPx = parseFloat($('hPx').value) || 0;
        if(!hSym || !hQ){ toast('Symbol and share count are required.'); break; }
        PFS[el.getAttribute('data-pf')].holdings.push({ s:hSym, q:hQ, px:hPx });
        savePfs(); closeDialog(); renderPortfolio(); renderRail(); toast('Holding added');
        break;
      }
      case 'delholding': {
        var pf2 = PFS[CUR.pf];
        pf2.holdings = pf2.holdings.filter(function(h){ return dispSym(h.s) !== dispSym(sym); });
        savePfs(); renderPortfolio(); renderRail();
        break;
      }
      case 'importpf': pfImport(); break;
      case 'pf-ask': pfAskDo(el.getAttribute('data-w')); break;
      case 'exportpf': {
        var rows = [['symbol', 'shares', 'avg_cost']].concat(PFS[CUR.pf].holdings.map(function(h){ return [h.s, h.q, h.px]; }));
        download('portfolio.csv', rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n'));
        break;
      }
      case 'nlportfolio': aiRun('custom', 'Propose a diversified 8-position starter portfolio for a long-horizon investor, with a one-line rationale per position and the main risk. Do not invent specific prices.'); break;
      case 'screen-apply': {
        var f = CUR.screen = defaultScreen();
        f.q = $('fq').value; f.sector = $('fsector') ? $('fsector').value : f.sector; f.minPx = $('fminPx').value; f.maxPx = $('fmaxPx').value;
        f.minPct = $('fminPct').value; f.maxPct = $('fmaxPct').value;
        f.minMc = $('fminMc') ? $('fminMc').value : ''; f.maxMc = $('fmaxMc') ? $('fmaxMc').value : '';
        renderScreener();
        break;
      }
      case 'screen-reset': CUR.screen = defaultScreen(); renderScreener(); break;
      case 'screen-addlist': {
        var picks = screenUniverse().slice(0, 20).map(function(r){ return r.sym; });
        askText('Save matches as a watchlist', 'Watchlist name (' + picks.length + ' matches)', 'Screened ' + new Date().toLocaleDateString(), function(nm2){ var nid2 = 'l' + Date.now().toString(36); LISTS[nid2] = { name:nm2, syms:picks }; saveLists(); renderRail(); toast('Created ' + nm2); });
        break;
      }
      case 'cmp-add': {
        askText('Add to comparison', 'Symbol', '', function(v2){ CUR.cmpSel.push(v2.toUpperCase()); renderCompare(); });
        break;
      }
      case 'cmp-del': {
        var d = el.getAttribute('data-sym');
        CUR.cmpSel = CUR.cmpSel.filter(function(s){ return s !== d; });
        renderCompare();
        break;
      }
      case 'earn-add': openEarningsDialog(sym || dispSym(CUR.sym)); break;
      case 'earn-save': {
        var es = dispSym($('eSym').value.trim().toUpperCase());
        var rec = { s:es, date:$('eDate').value, when:$('eWhen').value, note:$('eNote').value };
        EARNINGS = EARNINGS.filter(function(x){ return dispSym(x.s) !== es; }).concat([rec]);
        save('fh3_earn', EARNINGS); closeDialog();
        if(CUR.view === 'earnings') renderEarnings(); else paintQuotePanel();
        toast('Earnings date saved');
        break;
      }
      case 'brief-add': openBriefingDialog(); break;
      case 'brief-save': {
        TASKS.push({ name:$('bName').value || 'Briefing', sym:dispSym($('bSym').value.trim().toUpperCase()), when:$('bWhen').value, instruction:$('bInstr').value, created:Date.now() });
        save(LS.tasks, TASKS); closeDialog();
        if(CUR.view === 'research') renderResearchPage(); else paintQuotePanel();
        toast('Briefing created');
        break;
      }
      case 'brief-del': TASKS.splice(parseInt(el.getAttribute('data-i'), 10), 1); save(LS.tasks, TASKS); renderResearchPage(); break;
      case 'notif': enableNotifications(); break;
      case 'chat-clear': {
        var csid = chatCurrentSession();
        if(csid){
          CHAT = CHAT.filter(function(m){ return m.sid !== csid; });
          save(LS.chat, CHAT); CHAT_SID = null; chatRender();
          if(CUR.view === 'research') renderResearchPage();
          toast('Chat cleared');
        }
        break;
      }
      case 'chat-new': chatNewSession(); break;
      case 'chat-open': chatSetSession(el.getAttribute('data-sid'), true); if(CUR.view === 'research') renderResearchPage(); break;
      case 'chat-del': chatDeleteSession(el.getAttribute('data-sid')); break;
      case 'chat-export': download('research-history.csv', [['role', 'when', 'text']].concat(CHAT.map(function(m){ return [m.role, new Date(m.ts).toISOString(), m.text]; })).map(function(r){ return r.map(csvCell).join(','); }).join('\n')); break;
      case 'exp': exportCSV(el.getAttribute('data-what')); break;
      case 'sheets': openSheetsDialog(); break;
      case 'sheets-copy': {
        var s = dispSym(CUR.sym);
        var txt = ['price', 'change', 'volume', 'high52', 'low52', 'marketcap', 'pe', 'eps', 'dividendyield'].map(function(a){ return '=GOOGLEFINANCE("' + s + '","' + a + '")'; }).join('\n');
        if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ toast('Formulas copied'); });
        else toast('Copy not available in this browser');
        break;
      }
      case 'refresh-news': loadNewsData().then(function(){ if(CUR.view === 'home') paintHome(); }); break;
      case 'fin-sec': loadSecFin(); break;
      case 'fin-csv': {
        pickFile('.csv,text/csv', function(text){
          var grid = parseCSVGrid(text);
          if(grid.length < 2){ toast('CSV looks empty.'); return; }
          var cols = grid[0].slice(1);
          var rows = grid.slice(1).map(function(r){ return [r[0]].concat(r.slice(1).map(function(v){ return parseFloat(String(v).replace(/[^0-9.\-]/g, '')); })); });
          Q.fin.data = { cols:cols, rows:rows };
          Q.fin.status = 'csv'; Q.fin.note = '';
          paintQuotePanel();
          toast('CSV imported into the statement');
        });
        break;
      }
      case 'a-save': {
        var a = ANALYSIS[dispSym(CUR.sym)] = ANALYSIS[dispSym(CUR.sym)] || { rows:[] };
        var pint = function(id){ var v = $(id).value.trim(); return v === '' ? null : (parseInt(v, 10) || 0); };   // blank stays blank, so the feed numbers show
        a.buy = pint('aBuy'); a.hold = pint('aHold'); a.sell = pint('aSell');
        a.target = $('aTarget').value; a.hi = $('aHi').value; a.lo = $('aLo').value;
        save('fh3_analysis', ANALYSIS); paintQuotePanel(); toast('Saved');
        break;
      }
      case 'a-load-tv': {
        var al = ANALYSIS[dispSym(CUR.sym)] = ANALYSIS[dispSym(CUR.sym)] || { rows:[] };
        var dd = (DATA.summary[dispSym(CUR.sym)] || {}).d || {};
        if(numOf(dd['1 Year Target']) != null) al.target = String(numOf(dd['1 Year Target']));
        if(numOf(dd['PriceTargetHigh']) != null) al.hi = String(numOf(dd['PriceTargetHigh']));
        if(numOf(dd['PriceTargetLow']) != null) al.lo = String(numOf(dd['PriceTargetLow']));
        if(numOf(dd['AnalystTotal']) > 0){
          al.buy = (numOf(dd['AnalystSB']) || 0) + (numOf(dd['AnalystB']) || 0); al.hold = numOf(dd['AnalystH']) || 0; al.sell = (numOf(dd['AnalystS']) || 0) + (numOf(dd['AnalystSS']) || 0);
        }
        al.note = 'Consensus loaded from TradingView';
        save('fh3_analysis', ANALYSIS); paintQuotePanel(); toast('TradingView consensus loaded into the fields');
        break;
      }
      case 'a-addrow': {
        var a2 = ANALYSIS[dispSym(CUR.sym)] = ANALYSIS[dispSym(CUR.sym)] || { rows:[] };
        a2.rows = (a2.rows || []).concat([{ who:'Analyst, Firm', rec:'Buy', action:'Maintained', pt:'', proj:'', date:new Date().toISOString().slice(0, 10) }]);
        save('fh3_analysis', ANALYSIS); paintQuotePanel();
        break;
      }
      case 'drawer-close': closeDrawer(); break;
    }
  });

  $('searchForm').addEventListener('submit', function(ev){ ev.preventDefault(); doSearch($('searchInput').value); });
  $('searchForm2').addEventListener('submit', function(ev){ ev.preventDefault(); doSearch($('searchInput2').value); });
  $('brandLink').addEventListener('click', function(ev){ ev.preventDefault(); go('#/'); });
  $('themeBtn').addEventListener('click', toggleTheme);
  $('keysBtn').addEventListener('click', function(ev){
    ev.stopPropagation();
    var ok = aiReady() && KEY_OK !== false;
    menu(this, '<div class="mhead">' + (ok ? 'Key Live' : 'Disconnected') + '</div><a class="mi" href="#/settings/ai">Manage keys</a>');
  });
  $('moreBtn').addEventListener('click', function(ev){ ev.stopPropagation(); menu(this, moreMenuHTML()); });
  document.addEventListener('change', function(ev){ var t = ev.target; if(t.id === 'setTheme' || t.id === 'setMarket'){ CFG.theme = $('setTheme') ? $('setTheme').value : CFG.theme; CFG.market = $('setMarket') ? $('setMarket').value : CFG.market; saveCfg(); applyTheme(); renderSubnav(); } });
  $('signInBtn').addEventListener('click', function(ev){ ev.stopPropagation(); if(acct()) menu(this, acctMenuHTML()); else openAuth('register'); });
  $('rsBtn').addEventListener('click', rsTogglePanel);
  $('railBtn').addEventListener('click', function(){
    var r = $('rail');
    r.classList.toggle('drawer-open');
  });
  $('drawerClose').addEventListener('click', closeDrawer);
  $('runBtn').addEventListener('click', function(){
    var v = $('prompt').value.trim();
    var sr = skillSend(v);
    if(sr === 'keep') return;
    if(sr !== true){
      if(!v && ATT.length) v = 'Please analyze the attached file(s).';
      aiRun(v ? 'custom' : 'summary', v || null);
    }
    $('prompt').value = ''; $('prompt').style.height = 'auto';
  });
  $('skillFile').addEventListener('change', function(){ skillUpload(this.files); this.value = ''; });
  $('prompt').addEventListener('keydown', function(ev){ skillKey(ev, 'chat'); });
  document.addEventListener('keydown', function(ev){ if(ev.target && ev.target.id === 'rsQ') skillKey(ev, 'rs'); }, true);
  $('micBtn').addEventListener('click', dictate);
  $('attFile').addEventListener('change', function(){ attAdd(this.files); this.value = ''; });
  var dz = $('drawer'); dz.addEventListener('dragover', function(ev){ ev.preventDefault(); }); dz.addEventListener('drop', attDrop);
  $('prompt').addEventListener('paste', function(ev){ var f = [].slice.call((ev.clipboardData && ev.clipboardData.files) || []); if(f.length){ ev.preventDefault(); attAdd(f); } });
  if($('model')) $('model').addEventListener('input', paintAiPick);
  $('prompt').addEventListener('keydown', function(ev){   // Enter sends, Shift+Enter starts a new line
    if(ev.key !== 'Enter' || ev.shiftKey || ev.isComposing || ev.keyCode === 229) return;
    var sm = $('slashMenu'); if(sm && !sm.hidden && SLASH.items.length) return;   // Enter picks a /skill while its menu is open
    ev.preventDefault();
    var b = $('runBtn'); if(b && !b.disabled) b.click();
  });
  document.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter' && ev.target && ev.target.id === 'askVal'){ ev.preventDefault(); askOk(); return; }
    if(ev.key === 'Escape'){
      var pickerOpen = (PICK.ctx && PICK.ctx !== 'page') || (RS.optsOpen && $('rsOptsBtn'));
      if(pickerOpen){ closeAiPickers(); return; }   // Esc closes the picker, not the whole drawer
      closeMenu(); closeDialog();
      if($('drawer').classList.contains('full')) setFull(false); else closeDrawer();   // Esc leaves full screen first
    }
    if(ev.key === '/' && !/input|textarea|select/i.test((ev.target.tagName || ''))){ ev.preventDefault(); var s = $('searchInput'); if(s) s.focus(); }
  });
  window.addEventListener('hashchange', route);
}

function doSearch(q){
  var v = String(q || '').trim();
  if(!v) return;
  var sym = v.toUpperCase().replace(/\s+/g, '');
  var known = INSTRUMENTS[sym] || UNIVERSE.filter(function(u){ return u[0] === sym; })[0];
  var looksLikeSymbol = /^[\^A-Z0-9.\-\/]{1,12}$/.test(sym) && !/\s/.test(v);
  if(known || (looksLikeSymbol && v.length <= 6)){
    go('#/quote/' + encodeURIComponent(sym));
    return;
  }
  var byName = UNIVERSE.filter(function(u){ return u[1].toLowerCase().indexOf(v.toLowerCase()) >= 0; })[0];
  if(byName){ go('#/quote/' + encodeURIComponent(byName[0])); return; }
  aiRun('deep', v);
}

function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme') === 'dark';
  CFG.theme = cur ? 'light' : 'dark';
  saveCfg(); applyTheme();
}
function applyTheme(){
  var t = CFG.theme;
  if(!t){ t = 'dark'; }
  else if(t === 'auto'){
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
  var b = $('themeBtn');
  if(b) b.title = 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' theme';
}

function enableNotifications(){
  if(!('Notification' in window)){ toast('Notifications unsupported here.'); return; }
  Notification.requestPermission().then(function(p){
    toast(p === 'granted' ? 'Notifications enabled' : 'Notifications blocked');
  });
}
function dictate(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Speech recognition is not available in this browser.'); return; }
  var rec = new SR();
  rec.lang = 'en-US';
  rec.onresult = function(e){ var t = e.results[0][0].transcript; $('prompt').value = t; };
  rec.start();
  toast('Listening…');
}

function exportCSV(what){
  var rows = [];
  if(what === 'watchlist'){
    rows = [['list', 'symbol', 'name', 'price', 'change_pct']];
    Object.keys(LISTS).forEach(function(id){
      LISTS[id].syms.forEach(function(s){
        var r = quoteRow(s, false);
        rows.push([LISTS[id].name, r.sym, r.name, r.q.c == null ? '' : r.q.c, r.ch.pct == null ? '' : r.ch.pct.toFixed(2)]);
      });
    });
  } else if(what === 'portfolio'){
    var st = pfStats(PFS[CUR.pf]);
    rows = [['symbol', 'shares', 'avg_cost', 'price', 'value', 'return_pct']].concat(st.rows.map(function(r){
      return [r.s, r.q, r.costPx, r.price, r.value.toFixed(2), r.retPct.toFixed(2)];
    }));
  } else if(what === 'quotes'){
    rows = [['symbol', 'name', 'price', 'change', 'change_pct', 'volume']];
    Object.keys(DATA.quotes).forEach(function(s){
      var q = DATA.quotes[s], ch = chgFrom(q);
      rows.push([s, labelOf(s), q.c == null ? '' : q.c, ch.abs == null ? '' : ch.abs.toFixed(4), ch.pct == null ? '' : ch.pct.toFixed(2), q.v || '']);
    });
  } else {
    rows = [['date', 'open', 'high', 'low', 'close', 'volume']];
    var h = DATA.hist[CUR.key] || [];
    rows = rows.concat(h.map(function(r){ return [r.d, r.o, r.h, r.l, r.c, r.v || '']; }));
  }
  download(what + '.csv', rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n'));
  toast('Exported ' + what + '.csv');
}

function loadSecFin(){
  var sym = dispSym(CUR.sym);
  Q.fin.status = 'loading';
  paintQuotePanel();
  secFinancials(sym, Q.fin.kind).then(function(res){
    var rows = res.rows.map(function(r){
      return [r.label].concat(r.values.map(function(v){ return v / 1e6; }));
    });
    var cols = (res.rows[0].ends || []).map(function(d){ return String(d).slice(0, 7); });
    Q.fin.data = { cols:cols, rows:rows };
    Q.fin.status = 'sec'; Q.fin.note = res.entity;
    var epsRow = rows.filter(function(r){ return r[0].indexOf('EPS') >= 0; })[0];
    if(epsRow) Q.eps = epsRow[epsRow.length - 1];
    paintQuotePanel();
    toast('Loaded ' + res.entity + ' from SEC XBRL');
  }).catch(function(e){
    Q.fin.status = 'error';
    Q.fin.note = (e && e.message) ? e.message : 'unreachable';
    Q.fin.data = null;
    paintQuotePanel();
  });
}

/* Briefings: run while the tab is open, like the earlier build. */
var briefTimers = [];
function scheduleBriefings(){
  briefTimers.forEach(clearInterval);
  briefTimers = [];
  TASKS.forEach(function(t){
    if(t.when === 'Once, in 30 seconds'){
      briefTimers.push(setTimeout(function(){ runBriefing(t); }, 30000));
    } else if(t.when === 'Every 60 seconds'){
      briefTimers.push(setInterval(function(){ runBriefing(t); }, 60000));
    } else {
      briefTimers.push(setTimeout(function(){ runBriefing(t); }, 1500));
    }
  });
}
function runBriefing(t){
  if(!aiReady()) return;
  if(t.sym) CUR.sym = t.sym;
  aiRun('custom', (t.instruction || 'Give me a short briefing.') + ' (briefing: ' + t.name + ')').then(function(text){
    if(!text) return;
    if('Notification' in window && Notification.permission === 'granted'){
      try{ new Notification(t.name, { body:String(text).slice(0, 180) }); }catch(e){}
    }
    toast(t.name + ': briefing ready');
  });
}

/* ------------------------------------------------------------ 10. bootstrap */

function boot(){
  if(boot.done) return;
  boot.done = true;
  applyTheme();
  var pane = $('rsPane');
  if(pane) pane.innerHTML = rsPanelHTML();
  rsShowTab(CFG.rtab || 'chat', false);
  acctRefresh();
  aiQuickButtons();
  bindEvents();
  if(!KEYS.provider) KEYS.provider = 'openrouter';
  // The model field is gone (the picker owns it), so only fill what exists.
  if($('model')) $('model').value = KEYS.model || AI_DEFAULT_MODEL[KEYS.provider] || AI_DEFAULT_MODEL.openrouter;
  if(!KEYS.model) KEYS.model = AI_DEFAULT_MODEL[KEYS.provider] || '';
  if($('apikey')) $('apikey').value = KEYS.key || '';
  if($('customUrl')) $('customUrl').value = KEYS.url || '';
  paintKeySegs();
  if($('customUrlField')) $('customUrlField').hidden = (KEYS.provider || 'openrouter') !== 'custom';
  chatRender();
  renderSubnav();
  renderRail();
  $('main').innerHTML = '<div class="section">' + skeletonRows(3, 140) + '</div><div class="section">' + skeletonCards(5) + '</div>';
  probeProxy().then(function(){
    renderSubnav();
    renderRail();
    return route();
  }).then(function(){
    return loadUniverseQuotes();
  }).then(function(){
    if(CUR.view === 'home') paintHome();
    tourMaybeStart();
  });
  scheduleBriefings();
  window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if(!CFG.theme || CFG.theme === 'auto') applyTheme(); });
}
document.addEventListener('DOMContentLoaded', boot);
if(document.readyState !== 'loading') boot();
