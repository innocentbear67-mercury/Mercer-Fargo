<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MercerFargo Finance Superhub — Market Prices, Quotes &amp; Business News</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="description" content="MercerFargo Finance Superhub — a charcoal-and-gold market dashboard with your own AI keys and free delayed market data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   MercerFargo Finance Superhub — market dashboard UI
   Design tokens keep the market-terminal naming they were modelled on
   (--fh-*) so the visual language matches the real product 1:1.
   ========================================================================== */

/* ---------- Light theme (default) ---------------------------------------- */
:root{
  --fh-background-canvas:#fcfcfd;
  --fh-background-surface:#fff;
  --fh-background-surface-elevated:#fff;
  --fh-background-surface-container:#f0f2f5;
  --fh-background-surface-container-high:#e9ebf0;
  --fh-background-surface-container-highest:#e1e3e8;
  --fh-background-surface-container-de-emphasis:#f7f8fa;
  --fh-background-brand-surface-container-high:#e5edff;
  --fh-background-brand-surface-container-highest:#d3e3fd;
  --fh-background-highlight:#d3e3fd;
  --fh-background-surface-inverted:#1f1f1f;
  --fh-background-scrim:rgba(0,0,0,.32);
  --fh-border-stroke-default:#f0f2f5;
  --fh-border-stroke-emphasis:#cccfd9;
  --fh-stroke-emphasis:#dcdfe5;
  --fh-foreground-on-surface-emphasis:#0a0a0a;
  --fh-foreground-on-surface-default:#36373a;
  --fh-foreground-on-surface-de-emphasis:#56595e;
  --fh-foreground-icon-primary:#0b57d0;
  --fh-foreground-icon-secondary:#5e5e5e;
  --fh-foreground-on-surface-inverted:#fff;
  --fh-foreground-on-primary:#fff;
  --fh-foreground-on-highlight:#001d35;
  --fh-colors-and-accents-primary:#0b57d0;
  --fh-colors-and-accents-primary-inverted:#a8c7fa;
  --fh-foreground-on-surface-link-default:#1558d6;
  --fh-foreground-on-surface-link-visited:#6b1da8;
  --fh-states-neutral-hovered:rgba(16,18,24,.04);
  --fh-states-neutral-pressed:rgba(16,18,24,.12);
  --fh-states-neutral-selected:#e9ebf0;
  --fh-states-branded-medium-hovered:rgba(11,87,208,.08);
  --fh-states-branded-medium-pressed:rgba(11,87,208,.16);
  --fh-states-branded-medium-selected:#b8d5ff;
  --fh-positive:#1f8b1a;         /* --fh-dataviz-charts-green */
  --fh-negative:#e32935;         /* --fh-dataviz-charts-red */
  --fh-neutral:#de7300;
  --fh-chart-blue:#3364f0;
  --fh-chart-grid:rgba(60,64,67,.12);
  --fh-sentiment-positive-container:#cdf5c6;
  --fh-sentiment-on-positive-container:#013a00;
  --fh-sentiment-negative-container:#ffd5d8;
  --fh-sentiment-on-negative-container:#690002;
  --fh-sentiment-neutral-container:#ffdf92;
  --fh-sentiment-on-neutral-container:#241a00;
  --fh-elevation-1:0 1px 2px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.08);
  --fh-elevation-2:0 2px 6px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.08);
  --fh-elevation-3:0 8px 24px rgba(0,0,0,.12);
  --fh-cta-background:#f6f8fc;
  --fh-cta-hover:#f0f4fc;
  --fh-cta-gradient:radial-gradient(ellipse 90% 20px at 50% 100%,rgba(132,157,255,.45) 0%,rgba(184,207,255,.25) 50%,transparent 100%);
  --fh-radius-card:12px;
  --fh-radius-chip:8px;
  --fh-shell-max:1200px;
  --fh-rail-w:248px;
  color-scheme:light;
}

/* ---------- Dark theme --------------------------------------------------- */
[data-theme="dark"]{
  --fh-background-canvas:#040506;
  --fh-background-surface:#101218;
  --fh-background-surface-elevated:#222328;
  --fh-background-surface-container:#1d1e26;
  --fh-background-surface-container-high:#22232b;
  --fh-background-surface-container-highest:#2a2b36;
  --fh-background-surface-container-de-emphasis:#17181f;
  --fh-background-brand-surface-container-high:#2c303d;
  --fh-background-brand-surface-container-highest:#3a3f50;
  --fh-background-highlight:#3a457f;
  --fh-background-surface-inverted:#fff;
  --fh-border-stroke-default:#21232b;
  --fh-border-stroke-emphasis:#31323d;
  --fh-stroke-emphasis:#2d2f38;
  --fh-foreground-on-surface-emphasis:#e6e8f0;
  --fh-foreground-on-surface-default:#c9cbd1;
  --fh-foreground-on-surface-de-emphasis:#adafb8;
  --fh-foreground-icon-primary:#a8c7fa;
  --fh-foreground-icon-secondary:#c3c6d6;
  --fh-foreground-on-surface-inverted:#202124;
  --fh-foreground-on-primary:#202124;
  --fh-foreground-on-highlight:#eef0ff;
  --fh-colors-and-accents-primary:#a8c7fa;
  --fh-colors-and-accents-primary-inverted:#0b57d0;
  --fh-foreground-on-surface-link-default:#7eaaff;
  --fh-foreground-on-surface-link-visited:#d19efa;
  --fh-states-neutral-hovered:rgba(228,230,235,.06);
  --fh-states-neutral-pressed:rgba(228,230,235,.16);
  --fh-states-neutral-selected:#22232b;
  --fh-states-branded-medium-hovered:rgba(168,199,250,.10);
  --fh-states-branded-medium-pressed:rgba(168,199,250,.24);
  --fh-states-branded-medium-selected:#2b4468;
  --fh-positive:#4db848;
  --fh-negative:#ff5c67;
  --fh-neutral:#ffbe73;
  --fh-chart-blue:#618eff;
  --fh-chart-grid:rgba(255,255,255,.08);
  --fh-sentiment-positive-container:#013a00;
  --fh-sentiment-on-positive-container:#cdf5c6;
  --fh-sentiment-negative-container:#690002;
  --fh-sentiment-on-negative-container:#ffd5d8;
  --fh-sentiment-neutral-container:#f4bf00;
  --fh-sentiment-on-neutral-container:#241a00;
  --fh-elevation-1:0 1px 2px rgba(0,0,0,.5);
  --fh-elevation-2:0 2px 8px rgba(0,0,0,.6);
  --fh-elevation-3:0 8px 28px rgba(0,0,0,.7);
  --fh-cta-background:#22242a;
  --fh-cta-hover:#22242a;
  --fh-cta-gradient:radial-gradient(ellipse 90% 20px at 50% 100%,rgba(132,157,255,.30) 0%,rgba(49,134,255,.15) 50%,transparent 100%);
  color-scheme:dark;
}

/* ---------- Base --------------------------------------------------------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fh-background-canvas);
  color:var(--fh-foreground-on-surface-default);
  font:400 14px/20px "Google Sans Text","Google Sans",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0;font-weight:400;color:var(--fh-foreground-on-surface-emphasis);letter-spacing:0}
h1{font-size:22px;line-height:28px}
h2{font-size:20px;line-height:26px}
h3{font-size:16px;line-height:24px;font-weight:500}
a{color:var(--fh-foreground-on-surface-link-default);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fh-colors-and-accents-primary);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.up{color:var(--fh-positive)}
.down{color:var(--fh-negative)}
.mut{color:var(--fh-foreground-on-surface-de-emphasis)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:var(--fh-background-surface-container-highest);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- App header --------------------------------------------------- */
.appbar{
  position:sticky;top:0;z-index:40;background:var(--fh-background-surface);
  display:flex;align-items:center;gap:8px;padding:8px 16px;min-height:64px;
}
.appbar.flat{box-shadow:none}
.appbar .brand{
  display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:24px;
  font-size:21px;line-height:24px;color:var(--fh-foreground-on-surface-emphasis);
  white-space:nowrap;font-family:"Google Sans","Google Sans Text",Roboto,Arial,sans-serif;
  letter-spacing:-.2px;text-decoration:none
}
.appbar .brand:hover{background:var(--fh-states-neutral-hovered);text-decoration:none}
.wordmark{display:inline-flex;align-items:center;gap:6px}
.wordmark .mk{width:22px;height:22px;display:block}
.wordmark .nm{font-weight:500}
.wordmark .nm em{font-style:normal;color:var(--fh-colors-and-accents-primary)}
.beta-badge{
  font:500 10px/16px Roboto,Arial,sans-serif;letter-spacing:.4px;text-transform:uppercase;
  color:var(--fh-foreground-on-surface-de-emphasis);
  border:1px solid var(--fh-border-stroke-emphasis);border-radius:4px;padding:0 5px;margin-left:2px
}
.search{
  flex:1;max-width:640px;display:flex;align-items:center;gap:10px;
  background:var(--fh-background-surface-container);border-radius:24px;padding:0 16px;height:44px;
  margin:0 8px;transition:background .15s ease,box-shadow .15s ease
}
.search:focus-within{background:var(--fh-background-surface-elevated);box-shadow:var(--fh-elevation-2);border:1px solid var(--fh-border-stroke-emphasis)}
.search svg{flex:0 0 auto;color:var(--fh-foreground-icon-secondary)}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:15px;min-width:0}
.search input::placeholder{color:var(--fh-foreground-on-surface-de-emphasis)}
.grow{flex:1}
.icon-btn{
  width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;
  border:0;border-radius:50%;background:transparent;color:var(--fh-foreground-icon-secondary);
  flex:0 0 auto
}
.icon-btn:hover{background:var(--fh-states-neutral-hovered)}
.icon-btn.on{color:var(--fh-foreground-icon-primary);background:var(--fh-states-branded-medium-selected)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:20px;border:1px solid transparent;padding:9px 20px;font-size:14px;font-weight:500;
  background:transparent;transition:background .15s ease,box-shadow .15s ease;white-space:nowrap
}
.btn.filled{background:var(--fh-colors-and-accents-primary);color:var(--fh-foreground-on-primary)}
.btn.filled:hover{box-shadow:var(--fh-elevation-1);filter:brightness(1.06)}
.btn.tonal{background:var(--fh-background-brand-surface-container-high);color:var(--fh-colors-and-accents-primary)}
.btn.tonal:hover{background:var(--fh-background-brand-surface-container-highest)}
.btn.outlined{border-color:var(--fh-border-stroke-emphasis);color:var(--fh-colors-and-accents-primary)}
.btn.outlined:hover{background:var(--fh-states-branded-medium-hovered)}
.btn.text{color:var(--fh-colors-and-accents-primary);padding:8px 12px}
.btn.text:hover{background:var(--fh-states-branded-medium-hovered)}
.btn.cta{
  width:100%;border-radius:24px;height:48px;font-size:15px;
  background:var(--fh-cta-background);color:var(--fh-foreground-on-surface-emphasis);
  border:1px solid var(--fh-border-stroke-emphasis);box-shadow:inset 0 -2px 6px -1px rgba(169,168,255,.35)
}
.btn.cta:hover{background:var(--fh-cta-hover)}
.btn.sm{padding:6px 14px;font-size:13px;height:34px}
.avatar-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--fh-border-stroke-emphasis);
  background:var(--fh-background-surface-container);color:var(--fh-foreground-on-surface-emphasis);
  font-weight:500;font-size:13px;display:inline-flex;align-items:center;justify-content:center
}
.status-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:18px;
  color:var(--fh-foreground-on-surface-de-emphasis);background:var(--fh-background-surface-container);
  border-radius:12px;padding:2px 10px;white-space:nowrap
}
.status-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--fh-neutral)}
.status-chip.live .dot{background:var(--fh-positive)}
.status-chip.offline .dot{background:var(--fh-negative)}

/* ---------- Market tab strip -------------------------------------------- */
.subnav{
  position:sticky;top:64px;z-index:35;background:var(--fh-background-surface);
  border-bottom:1px solid var(--fh-border-stroke-default);display:flex;align-items:center;gap:4px;
  padding:0 16px;overflow-x:auto;scrollbar-width:none
}
.subnav::-webkit-scrollbar{display:none}
.subnav .sec-tabs{display:flex;gap:4px;margin-right:12px}
.subnav .sec-tab{
  border:0;background:transparent;padding:14px 14px 12px;font-size:15px;color:var(--fh-foreground-on-surface-de-emphasis);
  border-bottom:3px solid transparent;white-space:nowrap;border-radius:0
}
.subnav .sec-tab:hover{color:var(--fh-foreground-on-surface-emphasis)}
.subnav .sec-tab.on{color:var(--fh-colors-and-accents-primary);border-bottom-color:var(--fh-colors-and-accents-primary);font-weight:500}
.subnav .sep{width:1px;height:22px;background:var(--fh-border-stroke-emphasis);margin:0 10px;flex:0 0 auto}
.mkt-tabs{display:flex;gap:6px;padding:8px 0;overflow-x:auto;scrollbar-width:none}
.mkt-tabs::-webkit-scrollbar{display:none}
.mkt-tab{
  border:1px solid var(--fh-border-stroke-emphasis);background:var(--fh-background-surface);
  color:var(--fh-foreground-on-surface-default);border-radius:18px;padding:7px 16px;font-size:14px;white-space:nowrap
}
.mkt-tab:hover{background:var(--fh-states-neutral-hovered)}
.mkt-tab.on{background:var(--fh-states-branded-medium-selected);border-color:transparent;color:var(--fh-foreground-on-highlight);font-weight:500}

/* ---------- Layout ------------------------------------------------------ */
.shell{display:grid;grid-template-columns:var(--fh-rail-w) minmax(0,1fr);align-items:start;max-width:1600px;margin:0 auto}
.rail{
  position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;padding:16px 8px 64px 16px;
  border-right:1px solid var(--fh-border-stroke-default);background:var(--fh-background-canvas)
}
.rail.hidden{display:none}
.main{padding:20px 24px 96px;max-width:var(--fh-shell-max);min-width:0}
.rail .rail-new{
  display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;
  border-radius:20px;padding:10px 14px;font-size:14px;color:var(--fh-foreground-on-surface-default)
}
.rail .rail-new:hover{background:var(--fh-states-neutral-hovered)}
.rail .rail-head{
  display:flex;align-items:center;justify-content:space-between;gap:6px;padding:18px 14px 6px;
  font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--fh-foreground-on-surface-de-emphasis)
}
.rail .rail-item{
  display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:0 20px 20px 0;
  color:var(--fh-foreground-on-surface-default);cursor:pointer;border:0;background:transparent;width:100%;text-align:left
}
.rail .rail-item:hover{background:var(--fh-states-neutral-hovered)}
.rail .rail-item.on{background:var(--fh-states-branded-medium-selected);color:var(--fh-foreground-on-highlight);font-weight:500}
.rail .rail-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .rail-item .cnt{font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis)}
.rail .rail-sub{padding-left:26px}
.rail .sym-chip{
  display:flex;align-items:center;gap:8px;padding:7px 14px 7px 26px;font-size:13px;
  color:var(--fh-foreground-on-surface-de-emphasis);cursor:pointer;border:0;background:transparent;width:100%;text-align:left
}
.rail .sym-chip:hover{background:var(--fh-states-neutral-hovered);color:var(--fh-foreground-on-surface-emphasis)}
.rail .sym-chip .sc{flex:0 0 auto;font-weight:500;color:var(--fh-foreground-on-surface-default)}
.rail .sym-chip .scv{margin-left:auto;font-size:12px}
.rail .sect-link{display:block;padding:7px 14px 7px 26px;font-size:13px;color:var(--fh-foreground-on-surface-de-emphasis)}
.rail .sect-link:hover{color:var(--fh-colors-and-accents-primary);text-decoration:none}
.rail-foot{margin-top:24px;padding:12px 14px;font-size:11px;line-height:16px;color:var(--fh-foreground-on-surface-de-emphasis)}

/* ---------- Cards, sections -------------------------------------------- */
.section{margin:0 0 28px}
.section-head{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.section-head h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{
  background:var(--fh-background-surface);border:1px solid var(--fh-border-stroke-default);
  border-radius:var(--fh-radius-card);padding:16px
}
.card.plain{background:transparent;border:0;padding:0}
.card.tint{background:var(--fh-background-surface-container-de-emphasis)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}

/* Market index card rail */
.card-rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(178px,1fr);gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.card-rail::-webkit-scrollbar{height:8px}
.mkt-card{
  position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;
  background:var(--fh-background-surface);border:1px solid var(--fh-border-stroke-default);
  border-radius:var(--fh-radius-card);padding:14px 14px 0;overflow:hidden;min-height:132px;
  scroll-snap-align:start;text-decoration:none;color:inherit
}
.mkt-card:hover{background:var(--fh-background-surface-container-de-emphasis);text-decoration:none}
.mkt-card .nm{font-size:13px;color:var(--fh-foreground-on-surface-de-emphasis);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkt-card .pv{font-size:17px;font-weight:500;color:var(--fh-foreground-on-surface-emphasis)}
.mkt-card .pc{font-size:12.5px;display:flex;align-items:center;gap:6px}
.mkt-card .spark{position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none}
.mkt-card .spark svg{display:block;width:100%;height:100%}

/* ---------- Tables ------------------------------------------------------ */
.tbl-wrap{overflow-x:auto}
table.fh{width:100%;border-collapse:collapse;font-size:14px}
table.fh th,table.fh td{padding:0 12px;height:56px;border-bottom:1px solid var(--fh-border-stroke-default);vertical-align:middle}
table.fh thead th{
  height:44px;font-weight:400;font-size:12.5px;color:var(--fh-foreground-on-surface-de-emphasis);
  white-space:nowrap;text-align:right;position:relative
}
table.fh thead th:first-child{text-align:left}
table.fh td{text-align:right;color:var(--fh-foreground-on-surface-default)}
table.fh td:first-child{text-align:left}
table.fh tbody tr:hover{background:var(--fh-states-neutral-hovered)}
table.fh th.sortable button{
  border:0;background:transparent;color:inherit;display:inline-flex;align-items:center;gap:4px;padding:6px 4px;border-radius:14px
}
table.fh th.sortable button:hover{background:var(--fh-states-neutral-hovered);color:var(--fh-foreground-on-surface-emphasis)}
table.fh th.sorted button{color:var(--fh-colors-and-accents-primary);font-weight:500}
table.fh td.sym{display:flex;flex-direction:column;gap:1px;height:auto;padding-top:10px;padding-bottom:10px}
td.sym .s{font-weight:500;color:var(--fh-foreground-on-surface-emphasis)}
td.sym .n{font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
table.fh .col-trend{width:120px}
.movers-note{padding:12px 0 0;font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis)}

/* Compact watchlist rows (Daily gainers / losers / most active) */
.rowlist{display:flex;flex-direction:column}
.rowlist .row{
  display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 4px;
  border-bottom:1px solid var(--fh-border-stroke-default);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left
}
.rowlist .row:hover{background:var(--fh-states-neutral-hovered)}
.rowlist .row .id{flex:1;min-width:0;display:flex;flex-direction:column}
.rowlist .row .id b{font-weight:500;color:var(--fh-foreground-on-surface-emphasis)}
.rowlist .row .id span{font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowlist .row .val{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rowlist .row .val b{font-weight:500}
.rowlist .row .val span{font-size:12.5px;display:flex;align-items:center;gap:5px}

/* ---------- Change pill + arrow icon ------------------------------------ */
.chg{display:inline-flex;align-items:center;gap:5px;justify-content:flex-end}
.arw{width:14px;height:14px;flex:0 0 auto}
.arw circle{opacity:1}
.arw .gl{fill:none;stroke-width:2}
.spark .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}

/* ---------- Underline tabs + range pills -------------------------------- */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--fh-border-stroke-default);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .tab{
  border:0;background:transparent;padding:14px 18px 12px;font-size:15px;color:var(--fh-foreground-on-surface-de-emphasis);
  border-bottom:3px solid transparent;white-space:nowrap
}
.tabs .tab:hover{color:var(--fh-foreground-on-surface-emphasis)}
.tabs .tab.on{color:var(--fh-colors-and-accents-primary);border-bottom-color:var(--fh-colors-and-accents-primary);font-weight:500}
.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{
  border:1px solid var(--fh-border-stroke-emphasis);background:var(--fh-background-surface);
  color:var(--fh-foreground-on-surface-default);border-radius:16px;padding:6px 14px;font-size:13px
}
.pill:hover{background:var(--fh-states-neutral-hovered)}
.pill.on{background:var(--fh-states-neutral-selected);border-color:transparent;color:var(--fh-foreground-on-surface-emphasis);font-weight:500}
.pill.clearbtn{border-style:dashed}
.sub-tabs{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 16px}
.sub-tabs button{
  border:0;background:transparent;padding:8px 14px;border-radius:16px;font-size:13.5px;color:var(--fh-foreground-on-surface-de-emphasis)
}
.sub-tabs button:hover{background:var(--fh-states-neutral-hovered)}
.sub-tabs button.on{background:var(--fh-states-neutral-selected);color:var(--fh-foreground-on-surface-emphasis);font-weight:500}

/* ---------- Quote header ------------------------------------------------ */
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fh-foreground-on-surface-de-emphasis);margin-bottom:10px}
.insight-bar{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;
  background:var(--fh-background-surface-container-de-emphasis);border-radius:12px;padding:12px 16px;margin:0 0 16px;
  color:var(--fh-foreground-on-surface-default)
}
.insight-bar:hover{background:var(--fh-background-surface-container)}
.insight-bar .ttl{flex:1;font-size:14px}
.insight-bar b{font-weight:500}
.quote-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.quote-head .co{flex:1;min-width:260px}
.quote-head .ticker-line{font-size:12.5px;color:var(--fh-foreground-on-surface-de-emphasis);margin-bottom:6px}
.quote-head .name{font-size:20px;line-height:28px;color:var(--fh-foreground-on-surface-emphasis);display:flex;align-items:center;gap:10px}
.price-block{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:10px 0 4px}
.price-block .px{font-size:32px;line-height:40px;font-weight:400;color:var(--fh-foreground-on-surface-emphasis)}
.price-block .d{font-size:16px;display:inline-flex;align-items:center;gap:6px}
.price-block .rng{font-size:12.5px;color:var(--fh-foreground-on-surface-de-emphasis)}
.mkt-state{font-size:12.5px;color:var(--fh-foreground-on-surface-de-emphasis);display:flex;gap:6px;flex-wrap:wrap}
.ext-hours{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fh-foreground-on-surface-de-emphasis);margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;line-height:16px;padding:1px 8px;border-radius:8px;background:var(--fh-background-surface-container-high);color:var(--fh-foreground-on-surface-de-emphasis)}
.tag.live{background:var(--fh-sentiment-positive-container);color:var(--fh-sentiment-on-positive-container)}

/* ---------- Chart ------------------------------------------------------- */
.chart-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--fh-border-stroke-default);border-bottom:1px solid var(--fh-border-stroke-default);margin-top:16px}
.chart-toolbar .tbtn{
  display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:18px;
  padding:8px 14px;font-size:13.5px;color:var(--fh-foreground-on-surface-default)
}
.chart-toolbar .tbtn:hover{background:var(--fh-states-neutral-hovered)}
.chart-toolbar .tbtn.on{background:var(--fh-states-neutral-selected)}
.chart-box{position:relative;margin:16px 0 8px;min-height:680px}
.chart-box svg{display:block;width:100%;height:680px;overflow:visible}
@media (max-width:760px){ .chart-box{min-height:460px} .chart-box svg{height:460px} }
.chart-box .gridline{stroke:var(--fh-chart-grid);stroke-width:1}
.chart-box.loading svg{opacity:.45;transition:opacity .2s}
.vol-layer{opacity:.5;cursor:ns-resize;transition:none}
.vol-layer .vol-hit{fill:transparent}
.vol-layer:hover{opacity:.65}
.vol-layer.anim,.vol-slider b.anim{transition:transform .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1)}
.vol-slider{position:absolute;left:6px;width:22px;cursor:pointer;touch-action:none;outline:none}
.vol-slider i{position:absolute;left:7px;top:-4px;bottom:-4px;width:8px;border-radius:4px;background:var(--fh-border-stroke-emphasis);box-shadow:inset 0 0 0 1px var(--fh-foreground-on-surface-de-emphasis);opacity:.7}
.vol-slider b{position:absolute;left:2px;width:18px;height:46px;margin-top:-23px;border-radius:9px;background:var(--fh-background-surface);
  border:2px solid var(--fh-foreground-on-surface-de-emphasis);box-shadow:var(--fh-elevation-1,0 1px 3px rgba(0,0,0,.3));cursor:grab}
.vol-slider b span{position:absolute;left:24px;top:50%;transform:translateY(-50%);font-size:9.5px;font-weight:600;letter-spacing:.4px;
  color:var(--fh-foreground-on-surface-de-emphasis);opacity:0;transition:opacity .15s;pointer-events:none}
.vol-slider:hover b span,.vol-slider:focus-visible b span{opacity:1}
.vol-slider.moved b{border-color:var(--fh-colors-and-accents-primary)}
.vol-slider:focus-visible b{outline:2px solid var(--fh-colors-and-accents-primary);outline-offset:2px}
body.vol-dragging,body.vol-dragging *{cursor:grabbing!important;user-select:none}
.vol-none{position:absolute;left:8px;bottom:30px;font-size:11px;color:var(--fh-foreground-on-surface-de-emphasis)}
.chart-box .axis{fill:var(--fh-foreground-on-surface-de-emphasis);font-size:11px}
.chart-tip{
  position:absolute;pointer-events:none;background:var(--fh-background-surface-inverted);
  color:var(--fh-foreground-on-surface-inverted);font-size:12px;line-height:18px;border-radius:8px;
  padding:8px 10px;box-shadow:var(--fh-elevation-2);white-space:nowrap;z-index:5;opacity:0;transition:opacity .1s ease
}
.chart-tip.on{opacity:1}
.range-row{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;margin:12px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--fh-foreground-on-surface-de-emphasis);align-items:center}
.legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}

/* ---------- Stats grid -------------------------------------------------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px;margin-top:8px}
.stat-grid .kv{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;border-bottom:1px solid var(--fh-border-stroke-default)}
.stat-grid .kv span{color:var(--fh-foreground-on-surface-de-emphasis);font-size:14px}
.stat-grid .kv b{font-weight:500;color:var(--fh-foreground-on-surface-emphasis)}

/* ---------- Sentiment / outlook ----------------------------------------- */
.sent-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:10px 0 8px;background:var(--fh-background-surface-container)}
.sent-bar i{display:block;height:100%}
.sent-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--fh-foreground-on-surface-de-emphasis)}
.ul-dot{display:flex;gap:10px;margin:10px 0;font-size:14px;color:var(--fh-foreground-on-surface-default)}
.ul-dot .dotm{width:6px;height:6px;border-radius:50%;background:var(--fh-foreground-on-surface-de-emphasis);margin-top:8px;flex:0 0 auto}
.ai-chip{
  display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;
  color:var(--fh-colors-and-accents-primary);font-size:13px;font-weight:500;padding:6px 12px;border-radius:16px
}
.ai-chip:hover{background:var(--fh-states-branded-medium-hovered)}
.ai-chip .sp{width:16px;height:16px}

/* ---------- News -------------------------------------------------------- */
.news-cluster{border-bottom:1px solid var(--fh-border-stroke-default);padding:18px 0}
.news-cluster:last-child{border-bottom:0}
.news-cluster h3{font-size:18px;line-height:24px;margin-bottom:10px}
.src-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--fh-foreground-on-surface-de-emphasis);margin-bottom:10px;flex-wrap:wrap}
.src-row .avs{display:flex}
.src-row .av{
  width:20px;height:20px;border-radius:50%;background:var(--fh-background-surface-container-highest);
  color:var(--fh-foreground-on-surface-de-emphasis);font-size:10px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;margin-left:-6px;border:2px solid var(--fh-background-surface)
}
.src-row .av:first-child{margin-left:0}
.news-item{display:block;padding:12px 0;border-bottom:1px solid var(--fh-border-stroke-default);text-decoration:none;color:inherit}
.news-item:last-child{border-bottom:0}
.news-item:hover{text-decoration:none}
.news-item .hl{font-size:15px;line-height:22px;color:var(--fh-foreground-on-surface-emphasis)}
.news-item:hover .hl{text-decoration:underline}
.news-item .meta{font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis);margin-top:3px;display:flex;align-items:center;gap:6px}
.news-item .meta .av{width:16px;height:16px;border-radius:50%;background:var(--fh-background-surface-container-highest);font-size:9px;display:inline-flex;align-items:center;justify-content:center}
.news-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 32px}

/* Earnings calendar rows */
.earn-row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--fh-border-stroke-default);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.earn-row:hover{background:var(--fh-states-neutral-hovered)}
.earn-row .day{width:52px;flex:0 0 auto;font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis);line-height:16px}
.earn-row .who{flex:1;min-width:0}
.earn-row .who b{font-weight:500;color:var(--fh-foreground-on-surface-emphasis)}
.earn-row .who span{display:block;font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis)}
.earn-row .when{text-align:right;font-size:12.5px;color:var(--fh-foreground-on-surface-de-emphasis)}

/* ---------- AI drawer --------------------------------------------------- */
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:var(--panel-w);z-index:60;
  background:var(--fh-background-surface);border-left:1px solid var(--fh-border-stroke-default);
  box-shadow:var(--fh-elevation-3);display:flex;flex-direction:column;transform:translateX(100%);
  top:64px;height:calc(100vh - 64px);visibility:hidden;
  transition:transform .22s cubic-bezier(.2,0,0,1),visibility 0s linear .22s
}
.drawer.open{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.2,0,0,1),visibility 0s}
.drawer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--fh-border-stroke-default)}
.drawer-head .ttl{flex:1;font-size:16px;font-weight:500;color:var(--fh-foreground-on-surface-emphasis)}
.drawer-body{flex:1;overflow-y:auto;padding:16px}
.msg{border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;line-height:21px;white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--fh-border-stroke-default);background:var(--fh-background-surface-container-de-emphasis)}
.msg.me{background:var(--fh-background-brand-surface-container-high);color:var(--fh-foreground-on-surface-emphasis);border-color:transparent}
.msg.err{background:var(--fh-sentiment-negative-container);color:var(--fh-sentiment-on-negative-container);border-color:transparent}
.msg h4{font-size:13.5px;margin:8px 0 4px;color:var(--fh-foreground-on-surface-emphasis)}
.msg ul{margin:6px 0 6px 18px;padding:0}
.msg li{margin:3px 0}
.msg code{background:var(--fh-background-surface-container-high);border-radius:4px;padding:0 4px;font-size:12.5px}
.drawer-foot{border-top:1px solid var(--fh-border-stroke-default);padding:12px 16px;background:var(--fh-background-surface)}
.field{display:block;margin-bottom:8px}
.field label{display:block;font-size:11.5px;color:var(--fh-foreground-on-surface-de-emphasis);margin-bottom:4px}
.field input,.field select,.field textarea{
  width:100%;background:var(--fh-background-surface-container);border:1px solid transparent;border-radius:10px;
  padding:10px 12px;font-size:13.5px;outline:none
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--fh-colors-and-accents-primary);background:var(--fh-background-surface)}
.field textarea{resize:vertical;min-height:64px;font-family:inherit}
.ai-quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ai-quick button{
  border:1px solid var(--fh-border-stroke-emphasis);background:var(--fh-background-surface);border-radius:16px;
  padding:6px 12px;font-size:12.5px;color:var(--fh-foreground-on-surface-default)
}
.ai-quick button:hover{background:var(--fh-states-branded-medium-hovered);border-color:transparent;color:var(--fh-colors-and-accents-primary)}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--fh-foreground-on-surface-de-emphasis);animation:bl 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* ---------- Menu / dialog / toast --------------------------------------- */
.menu{position:fixed;z-index:70;min-width:240px;max-height:70vh;overflow-y:auto;background:var(--fh-background-surface-elevated);
  border:1px solid var(--fh-border-stroke-default);border-radius:12px;box-shadow:var(--fh-elevation-3);padding:8px}
.menu .mi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:11px 14px;border-radius:10px;font-size:14px;text-align:left;color:var(--fh-foreground-on-surface-default)}
.menu a.mi{text-decoration:none;color:inherit;box-sizing:border-box}
.menu .mi:hover{background:var(--fh-states-neutral-hovered)}
.menu .mi.on{background:var(--fh-states-branded-medium-selected);color:var(--fh-foreground-on-highlight)}
.menu .mhead{padding:10px 14px 6px;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--fh-foreground-on-surface-de-emphasis)}
.menu .msep{height:1px;background:var(--fh-border-stroke-default);margin:6px 8px}
.dlg-wrap{position:fixed;inset:0;z-index:80;background:var(--fh-background-scrim);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--fh-background-surface-elevated);border-radius:20px;box-shadow:var(--fh-elevation-3);width:min(620px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.dlg-head{display:flex;align-items:center;gap:12px;padding:20px 22px 8px}
.dlg-head h2{flex:1;font-size:20px}
.dlg-body{padding:8px 22px 4px;overflow-y:auto}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px 20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:90;background:var(--fh-background-surface-inverted);
  color:var(--fh-foreground-on-surface-inverted);border-radius:10px;padding:12px 18px;font-size:13.5px;box-shadow:var(--fh-elevation-3);
  opacity:0;transition:opacity .18s ease;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.skel{background:linear-gradient(90deg,var(--fh-background-surface-container) 25%,var(--fh-background-surface-container-high) 37%,var(--fh-background-surface-container) 63%);
  background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:8px;height:14px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.empty{padding:28px 4px;color:var(--fh-foreground-on-surface-de-emphasis);font-size:14px;text-align:center}
.hr{height:1px;background:var(--fh-border-stroke-default);margin:20px 0}
.kv-inline{display:flex;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--fh-foreground-on-surface-de-emphasis)}
.footer{border-top:1px solid var(--fh-border-stroke-default);margin-top:40px;padding:22px 4px 30px;font-size:12.5px;color:var(--fh-foreground-on-surface-de-emphasis)}
.footer .disc{max-width:640px;line-height:19px}
.footer .links{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.footer .links a{color:var(--fh-foreground-on-surface-de-emphasis)}
.bottombar{display:none}
.mobile-only{display:none}
.donut{display:block}
.bar-row{display:grid;grid-template-columns:120px 1fr 74px;align-items:center;gap:12px;margin:8px 0;font-size:13px}
.bar-row .track{height:10px;border-radius:6px;background:var(--fh-background-surface-container);overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:6px}
.bar-row .val{text-align:right;color:var(--fh-foreground-on-surface-de-emphasis)}
.analyst-bar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:12px 0 8px}
.analyst-bar i{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.heat .h{
  border-radius:10px;padding:12px 10px;color:#fff;font-size:12px;line-height:16px;display:flex;flex-direction:column;justify-content:space-between;min-height:74px
}
.heat .h b{font-size:13px;font-weight:500}
.heat .h .p{font-size:11.5px;opacity:.92}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:14px}
.fchip{display:flex;align-items:center;gap:8px}
.fchip .pill{padding:7px 12px;font-size:13px}
.inp{
  width:100%;background:var(--fh-background-surface-container);border:1px solid transparent;border-radius:10px;
  padding:10px 12px;font-size:13.5px;outline:none
}
.inp:focus{border-color:var(--fh-colors-and-accents-primary);background:var(--fh-background-surface)}
.cmp-legend{display:flex;gap:8px;flex-wrap:wrap}
.cmp-legend .c{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--fh-border-stroke-emphasis);border-radius:16px;padding:4px 10px;font-size:12.5px}
.cmp-legend .c button{border:0;background:transparent;color:inherit;font-size:14px;line-height:1;padding:0 0 0 2px}

/* ---------- Responsive -------------------------------------------------- */
@media (max-width:1200px){
  :root{--fh-rail-w:212px}
  .rsec-cnt{display:none}
  .rsec-tog{gap:8px;padding-right:6px}
  .rsec-ic{width:26px;height:26px}
  .main{padding:18px 18px 90px}
}

  .shell{grid-template-columns:minmax(0,1fr)}
  .grid-2,.grid-3{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .rail.drawer-open{display:block;position:fixed;top:64px;left:0;width:min(320px,86vw);z-index:50;background:var(--fh-background-surface);box-shadow:var(--fh-elevation-3)}
  .mobile-only{display:inline-flex}
}
@media (max-width:760px){
  .drawer{top:56px;height:calc(100vh - 56px)}
  .appbar{padding:6px 8px;min-height:56px}
  .subnav{top:56px;padding:0 8px}
  .appbar .search{display:none}
  .bottombar{
    display:block;position:fixed;left:0;right:0;bottom:0;z-index:45;padding:10px 12px;
    background:var(--fh-background-canvas);border-top:1px solid var(--fh-border-stroke-default)
  }
  .bottombar .search{display:flex;margin:0;max-width:none;height:46px;background:var(--fh-background-surface-container)}
  .main{padding:14px 12px 96px}
  .stat-grid{grid-template-columns:minmax(0,1fr)}
  .card-rail{grid-auto-columns:minmax(150px,1fr)}
  .price-block .px{font-size:27px;line-height:34px}
  .footer .links{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ------------------------------------------------ deep research panel */
/* Deep Research panel — Marvell harness */
.rs-note{font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis);margin:2px 0 12px;line-height:1.5}
.rs-note a{color:var(--fh-foreground-on-surface-link-default)}
.rs-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
@media (max-width:880px){.rs-grid{grid-template-columns:1fr}}
.rs-opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.rs-opts label{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--fh-foreground-on-surface-de-emphasis)}
.rs-opts input,.rs-opts select{background:var(--fh-background-surface-container);border:1px solid var(--fh-border-stroke-default);color:inherit;border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px;max-width:190px}
.rs-modes{display:inline-flex;background:var(--fh-background-surface-container);border-radius:999px;padding:2px}
.rs-modes button{background:none;border:0;color:var(--fh-foreground-on-surface-de-emphasis);font:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.rs-modes button.on{background:var(--fh-background-surface-elevated);color:var(--fh-foreground-on-surface-emphasis);box-shadow:var(--fh-elevation-1)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--fh-background-surface-container);border-radius:12px;padding:3px;max-width:100%}
.seg button{background:none;border:0;color:var(--fh-foreground-on-surface-de-emphasis);font:inherit;font-size:12px;padding:5px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--fh-foreground-on-surface-emphasis)}
.seg button.on{background:var(--fh-background-surface-elevated);color:var(--fh-foreground-on-surface-emphasis);box-shadow:var(--fh-elevation-1)}
.seg.wrap{width:100%}
.field .seg{margin-bottom:6px}
.field .seg + input{margin-top:0}
/* Collapsed model picker — one compact pill (ChatGPT-style); the provider,
   model, effort and key toggles only appear when it is clicked. */
.ai-pick{display:flex;align-items:center;gap:8px;width:100%;background:var(--fh-background-surface-container);
  border:1px solid var(--fh-border-stroke-default);border-radius:14px;padding:7px 12px;cursor:pointer;
  color:var(--fh-foreground-on-surface-emphasis);font:inherit;font-size:12.5px;text-align:left}
.ai-pick:hover{background:var(--fh-background-surface-elevated)}
.ai-pick .ap-dot{width:7px;height:7px;border-radius:50%;background:var(--fh-foreground-on-surface-de-emphasis);flex:0 0 auto}
.ai-pick.ready .ap-dot{background:var(--fh-positive)}
.ai-pick .ap-k{color:var(--fh-foreground-on-surface-de-emphasis);font-size:11.5px;flex:0 0 auto}
.ai-pick .ap-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-pick .chev{flex:0 0 auto;color:var(--fh-foreground-icon-secondary);transition:transform .18s ease}
.ai-pick[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ai-pick-wrap{display:flex;flex-direction:column;gap:8px}
.rs-opts-body[hidden]{display:none}
/* --- Minimalist assistant (Claude/GPT-like): airy groups, big tappable pills --- */
#drawer .drawer-body{padding:20px 18px}
#drawer .drawer-foot{padding:14px 16px 18px;position:relative}
#rsOpts{position:relative}
.pickmenu{position:absolute;left:10px;right:10px;bottom:100%;margin-bottom:6px;z-index:8;background:var(--fh-background-surface-elevated);border:1px solid var(--fh-border-stroke-default);border-radius:16px;box-shadow:var(--fh-elevation-3);display:flex;flex-direction:column;overflow:hidden;max-height:min(440px,70vh)}
#pickMenuR{left:0;right:0;bottom:auto;top:100%;margin:6px 0 0}
.pickmenu[hidden]{display:none}
#slashMenu{padding:6px}
.sl-row{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;font:inherit;background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--fh-foreground-on-surface-emphasis)}
.sl-row b{font-weight:600;font-size:13.5px}
.sl-row span{font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-row.on,.sl-row:hover{background:var(--fh-states-branded-medium-hovered)}
.sl-row.on b{color:var(--fh-colors-and-accents-primary)}
.sl-foot{display:flex;gap:6px;border-top:1px solid var(--fh-border-stroke-default);margin-top:4px;padding-top:6px}
.sk-card{margin-top:10px;border:1px solid var(--fh-border-stroke-default);border-radius:12px;padding:10px 12px}
.sk-card pre,.sk-edit{max-height:240px;overflow:auto;white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;margin:8px 0 0}
.sk-edit{width:100%;min-height:200px;box-sizing:border-box}
.sk-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--fh-border-stroke-default)}
.sk-row:first-of-type{border-top:0}
.pm-tabs{display:flex;gap:2px;overflow-x:auto;padding:8px 8px 6px;border-bottom:1px solid var(--fh-border-stroke-default);scrollbar-width:none;flex:0 0 auto}
.pm-tabs::-webkit-scrollbar{display:none}
.pm-tab{background:none;border:0;border-radius:999px;color:var(--fh-foreground-on-surface-de-emphasis);font:inherit;font-size:12.5px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.pm-tab:hover{color:var(--fh-foreground-on-surface-emphasis)}
.pm-tab.on{background:var(--fh-states-branded-medium-selected);color:var(--fh-foreground-on-surface-emphasis);font-weight:600}
.pm-cols{display:flex;min-height:0;flex:1;overflow:hidden}
.pm-models{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1.2;min-width:0;overflow-y:auto;padding:6px;border-right:1px solid var(--fh-border-stroke-default)}
.pm-effort{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;flex:1;min-width:0;overflow-y:auto;padding:6px}
.pm-m,.pm-e{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:10px;color:inherit;font:inherit;font-size:13px;padding:7px 10px;cursor:pointer;text-align:left}
.pm-m:hover,.pm-e:hover{background:var(--fh-states-neutral-hovered)}
.pm-m.hov{background:var(--fh-states-neutral-hovered)}
.pm-m.cur,.pm-e.cur{font-weight:600}
.pm-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-eh{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--fh-foreground-on-surface-de-emphasis);padding:6px 10px 4px}
.pm-e span:first-child{flex:1}
.pm-empty{color:var(--fh-foreground-on-surface-de-emphasis);font-size:12.5px;padding:10px}
.pm-check{margin-left:auto;color:var(--fh-colors-and-accents-primary);font-weight:700}
.pm-switch{margin-left:auto;width:34px;height:20px;border-radius:999px;background:var(--fh-background-surface-container-high);border:1px solid var(--fh-border-stroke-default);position:relative;flex:0 0 auto}
.pm-switch.on{background:var(--fh-colors-and-accents-primary);border-color:transparent}
.pm-knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s ease}
.pm-switch.on .pm-knob{left:16px;background:#1a1a1a}
.pm-foot{display:flex;gap:4px;border-top:1px solid var(--fh-border-stroke-default);padding:4px 6px;flex:0 0 auto}
.pm-foot button{background:none;border:0;color:var(--fh-foreground-on-surface-de-emphasis);font:inherit;font-size:12px;padding:7px 9px;border-radius:8px;cursor:pointer}
.pm-foot button:hover{background:var(--fh-states-neutral-hovered);color:var(--fh-foreground-on-surface-emphasis)}
#drawer .msg{border:0;background:transparent;padding:6px 2px;margin:0 0 16px;font-size:14px;line-height:1.65}
#drawer .msg.me{background:var(--fh-background-surface-container);border-radius:16px;padding:10px 14px;margin-left:28px}
#drawer .msg.err{background:var(--fh-sentiment-negative-container);border-radius:12px;padding:10px 14px}
.seg{gap:8px;background:transparent;padding:2px 0}
.seg button{font-size:13px;padding:10px 16px;min-height:40px;border-radius:999px;border:1px solid var(--fh-border-stroke-default);background:transparent}
.seg button.on{background:var(--fh-background-surface-elevated);border-color:var(--fh-colors-and-accents-primary);color:var(--fh-foreground-on-surface-emphasis);font-weight:600;box-shadow:var(--fh-elevation-1)}
#drawer .field{margin-bottom:18px}
#drawer .field>span{display:block;font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis);margin-bottom:8px}
#aiPick{margin-bottom:12px}
.ai-quick{gap:8px;margin-bottom:12px}
.ai-quick button{font-size:12.5px;padding:8px 14px;border-radius:999px;min-height:34px}
.composer{display:flex;gap:6px;align-items:flex-end;background:var(--fh-background-surface-container);border:1px solid var(--fh-border-stroke-default);border-radius:22px;padding:6px 6px 6px 16px;margin-top:6px}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;outline:none;resize:none;font:inherit;font-size:14px;line-height:1.5;max-height:130px;padding:8px 0;color:inherit}
.composer textarea::placeholder{color:var(--fh-foreground-on-surface-de-emphasis)}
.sendbtn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--fh-colors-and-accents-primary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.sendbtn:disabled{opacity:.55;cursor:default}
.sendbtn svg{width:16px;height:16px}
.rs-opts{margin-bottom:14px}
.rs-opts input{background:var(--fh-background-surface-container);border:1px solid var(--fh-border-stroke-default);border-radius:999px;padding:9px 14px;font-size:13px;min-height:40px}
.rs-actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.rs-steps{margin:14px 0 0;border-left:2px solid var(--fh-border-stroke-default);padding-left:0}
.rs-step{position:relative;padding:3px 0 3px 16px;font-size:12.5px;color:var(--fh-foreground-on-surface-de-emphasis);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.rs-step::before{content:"";position:absolute;left:-5px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--fh-neutral)}
.rs-step.round{color:var(--fh-foreground-on-surface-emphasis);font-weight:600}
.rs-step.round::before{background:var(--fh-colors-and-accents-primary)}
.rs-step.ok::before{background:var(--fh-positive)}
.rs-step.fail::before{background:var(--fh-negative)}
.rs-step b{font-weight:600;color:var(--fh-foreground-on-surface-default)}
.rs-report{margin-top:12px;font-size:14px;line-height:1.62;color:var(--fh-foreground-on-surface-default);max-width:80ch}
.rs-report h4{font-size:15.5px;margin:16px 0 6px;color:var(--fh-foreground-on-surface-emphasis)}
.rs-report h4:first-child{margin-top:0}
.rs-report ul{margin:6px 0 6px 18px;padding:0}
.rs-report li{margin:3px 0}
.rs-report a{color:var(--fh-foreground-on-surface-link-default)}
.rs-report code{background:var(--fh-background-surface-container);padding:1px 5px;border-radius:5px;font-size:12.5px}
.rs-report hr{border:0;border-top:1px solid var(--fh-border-stroke-default);margin:14px 0}
.rs-cites{margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--fh-border-stroke-default);font-size:12.5px}
.rs-cites h5{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--fh-foreground-on-surface-de-emphasis);margin:0 0 8px}
.rs-cites ol{margin:0 0 0 20px;padding:0}
.rs-cites li{margin:4px 0;color:var(--fh-foreground-on-surface-de-emphasis)}
.rs-cites a{color:var(--fh-foreground-on-surface-link-default);text-decoration:none}
.rs-cites a:hover{text-decoration:underline}
.rs-run{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--fh-border-stroke-default);font-size:12.5px}
.rs-run:last-child{border-bottom:0}
.rs-run .q{color:var(--fh-foreground-on-surface-default)}
.rs-run .m{color:var(--fh-foreground-on-surface-de-emphasis);font-size:11.5px}
/* Portfolio at a glance */
.glance{padding:20px 22px}
.gl-top{display:flex;gap:28px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.gl-lab{font-size:12px;letter-spacing:.3px}
.gl-big{font-size:clamp(32px,5vw,46px);font-weight:600;line-height:1.1;margin:2px 0 4px;color:var(--fh-foreground-on-surface-emphasis)}
.gl-day{font-size:17px;font-weight:500}
.gl-spark{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;min-width:180px;flex:0 1 320px}
.gl-spark svg{width:100%;height:72px}
.gl-rng{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:2px}
.gl-rng button{background:none;border:0;border-radius:999px;color:var(--fh-foreground-on-surface-de-emphasis);font:inherit;font-size:12px;font-weight:500;padding:4px 10px;cursor:pointer}
.gl-rng button:hover{color:var(--fh-foreground-on-surface-emphasis)}
.gl-rng button.on{background:var(--fh-states-branded-medium-selected);color:var(--fh-foreground-on-surface-emphasis)}
.gl-wait{height:72px;display:flex;align-items:center;font-size:12.5px}
.gl-leg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.gl-leg i{width:14px;height:3px;border-radius:2px;display:inline-block;margin-left:6px}
.gl-vs{display:inline-flex;gap:10px;align-items:center;margin:14px 0 0;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600}
.gl-vs span{font-weight:400;font-size:12.5px;opacity:.85}
.gl-vs.win{background:rgba(77,184,72,.16);color:var(--fh-positive)}
.gl-vs.lose{background:rgba(255,92,103,.16);color:var(--fh-negative)}
.gl-ret{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:15px}
.gl-ret b{font-size:20px;font-weight:600}
.gl-line{margin:10px 0 10px;font-size:14.5px;color:var(--fh-foreground-on-surface-default)}
.gl-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:12px}
.gl-bar i{display:block;min-width:3px}
.gl-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.gl-tile{display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-radius:12px;text-decoration:none;color:inherit;font-size:13px}
.gl-tile b{font-size:14px}
.gl-tile small{color:var(--fh-foreground-on-surface-de-emphasis);font-size:11px}
.gl-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px}
.gl-foot a{color:var(--fh-foreground-on-surface-link-default);text-decoration:none;font-weight:500}
.gl-empty{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.gl-empty .gl-big{font-size:24px}
.gl-cta{display:flex;gap:8px}
.glance.loading .gl-big{opacity:.6}
/* ============================================================================
   MercerFargo brand layer
   Palette: Charcoal Black #333333 (main), Deep Navy Blue #1A2E50, Antique Gold #C1A578
   The Google-derived token names below are kept; only their values change, so
   every component picks up the brand without touching component CSS.
   ========================================================================== */
:root{
  --mf-charcoal:#333333;
  --mf-charcoal-deep:#1c1c1c;
  --mf-navy:#1a2e50;
  --mf-navy-deep:#132340;
  --mf-gold:#c1a578;
  --mf-gold-deep:#8a6f3d;
  --mf-offwhite:#f5f1e8;
  --mf-serif:'Playfair Display',Georgia,'Times New Roman',serif;
}

/* ---------- Charcoal black (main theme) ---------------------------------- */
[data-theme="dark"]{
  --fh-background-canvas:#141414;
  --fh-background-surface:#1c1c1c;
  --fh-background-surface-elevated:#2a2a2a;
  --fh-background-surface-container:#212121;
  --fh-background-surface-container-high:#2a2a2a;
  --fh-background-surface-container-highest:#333333;
  --fh-background-surface-container-de-emphasis:#191919;
  --fh-background-brand-surface-container-high:#22314d;
  --fh-background-brand-surface-container-highest:#2c3f63;
  --fh-background-highlight:#2b3c5e;
  --fh-background-surface-inverted:#f5f1e8;
  --fh-background-scrim:rgba(0,0,0,.66);
  --fh-border-stroke-default:#2e2e2e;
  --fh-border-stroke-emphasis:#3f3f3f;
  --fh-stroke-emphasis:#3a3a3a;
  --fh-foreground-on-surface-emphasis:#f5f1e8;
  --fh-foreground-on-surface-default:#d9d5cc;
  --fh-foreground-on-surface-de-emphasis:#a6a29a;
  --fh-foreground-icon-primary:#c1a578;
  --fh-foreground-icon-secondary:#b3aea5;
  --fh-foreground-on-surface-inverted:#1c1c1c;
  --fh-foreground-on-primary:#241a05;
  --fh-foreground-on-highlight:#f2e9d8;
  --fh-colors-and-accents-primary:#c1a578;
  --fh-colors-and-accents-primary-inverted:#1a2e50;
  --fh-foreground-on-surface-link-default:#d8bf94;
  --fh-foreground-on-surface-link-visited:#c3a2d0;
  --fh-states-neutral-hovered:rgba(245,241,232,.06);
  --fh-states-neutral-pressed:rgba(245,241,232,.14);
  --fh-states-neutral-selected:#333333;
  --fh-states-branded-medium-hovered:rgba(193,165,120,.12);
  --fh-states-branded-medium-pressed:rgba(193,165,120,.26);
  --fh-states-branded-medium-selected:#3a3226;
  --fh-positive:#5cb98c;
  --fh-negative:#e0685f;
  --fh-neutral:#c1a578;
  --fh-chart-blue:#c1a578;
  --fh-chart-grid:rgba(245,241,232,.09);
  --fh-sentiment-positive-container:#1e3a2b;
  --fh-sentiment-on-positive-container:#cfe8d9;
  --fh-sentiment-negative-container:#3a1f1e;
  --fh-sentiment-on-negative-container:#f3d3cf;
  --fh-sentiment-neutral-container:#c1a578;
  --fh-sentiment-on-neutral-container:#241a05;
  --fh-elevation-1:0 1px 2px rgba(0,0,0,.55);
  --fh-elevation-2:0 2px 10px rgba(0,0,0,.6);
  --fh-elevation-3:0 10px 30px rgba(0,0,0,.72);
  --fh-cta-background:#2a2a2a;
  --fh-cta-hover:#333333;
  --fh-cta-gradient:radial-gradient(ellipse 90% 20px at 50% 100%,rgba(193,165,120,.28) 0%,rgba(26,46,80,.22) 55%,transparent 100%);
  color-scheme:dark;
}

/* ---------- Light counterpart: warm ivory + deep gold --------------------- */
:root:not([data-theme="dark"]){
  --fh-background-canvas:#f7f5f0;
  --fh-background-surface:#fffefb;
  --fh-background-surface-elevated:#ffffff;
  --fh-background-surface-container:#efece4;
  --fh-background-surface-container-high:#e8e4da;
  --fh-background-surface-container-highest:#ddd8cc;
  --fh-background-surface-container-de-emphasis:#f2efe8;
  --fh-background-brand-surface-container-high:#e2e8f2;
  --fh-background-brand-surface-container-highest:#cfd9e8;
  --fh-background-highlight:#dbe3f0;
  --fh-background-surface-inverted:#1c1c1c;
  --fh-border-stroke-default:#eae6dd;
  --fh-border-stroke-emphasis:#cdc7b9;
  --fh-stroke-emphasis:#d8d3c7;
  --fh-foreground-on-surface-emphasis:#1c1c1c;
  --fh-foreground-on-surface-default:#3a3833;
  --fh-foreground-on-surface-de-emphasis:#6b675e;
  --fh-foreground-icon-primary:#1a2e50;
  --fh-foreground-icon-secondary:#6b675e;
  --fh-foreground-on-surface-inverted:#fffefb;
  --fh-foreground-on-primary:#fffdf7;
  --fh-foreground-on-highlight:#12203a;
  --fh-colors-and-accents-primary:#8a6f3d;
  --fh-colors-and-accents-primary-inverted:#d8bf94;
  --fh-foreground-on-surface-link-default:#1a2e50;
  --fh-foreground-on-surface-link-visited:#5b3f7a;
  --fh-states-neutral-hovered:rgba(28,28,28,.05);
  --fh-states-neutral-pressed:rgba(28,28,28,.12);
  --fh-states-neutral-selected:#e8e4da;
  --fh-states-branded-medium-hovered:rgba(138,111,61,.10);
  --fh-states-branded-medium-pressed:rgba(138,111,61,.20);
  --fh-states-branded-medium-selected:#e4dbc6;
  --fh-positive:#1f7a4d;
  --fh-negative:#c0392b;
  --fh-neutral:#8a6f3d;
  --fh-chart-blue:#8a6f3d;
  --fh-chart-grid:rgba(40,38,34,.12);
  --fh-sentiment-positive-container:#d8ecdf;
  --fh-sentiment-on-positive-container:#0d2b1c;
  --fh-sentiment-negative-container:#f6dbd6;
  --fh-sentiment-on-negative-container:#4a120c;
  --fh-sentiment-neutral-container:#eadfc4;
  --fh-sentiment-on-neutral-container:#2b2214;
  --fh-cta-background:#f1eee7;
  --fh-cta-hover:#e8e4da;
  --fh-cta-gradient:radial-gradient(ellipse 90% 20px at 50% 100%,rgba(193,165,120,.45) 0%,rgba(26,46,80,.16) 55%,transparent 100%);
  color-scheme:light;
}

/* ---------- Logotype ----------------------------------------------------- */
.logo-wm{height:30px;width:auto;display:block}
.logo-box{font-family:var(--mf-serif);font-weight:500;font-size:13px;letter-spacing:1.3px;text-transform:uppercase;line-height:1;white-space:nowrap;
  color:var(--fh-foreground-on-surface-emphasis);border:1.5px solid currentColor;padding:7px 10px;margin-left:12px;opacity:.9}
:root:not([data-theme="dark"]) .logo-wm{filter:brightness(0) opacity(.85)}
@media (max-width:1100px){ .logo-box{font-size:10.5px;letter-spacing:.9px;padding:5px 7px;margin-left:8px} }
@media (max-width:760px){ .logo-box{display:none} }
@media (max-width:520px){ .logo-wm{height:26px} }
.wordmark{gap:9px}
.wordmark .mk{width:30px;height:30px;display:block;flex:none;border-radius:8px}
.wordmark .nm{
  font-family:var(--mf-serif);font-size:19.5px;font-weight:600;letter-spacing:.3px;
  color:var(--fh-foreground-on-surface-emphasis)
}
.wordmark .nm em{font-style:normal;font-weight:700;color:var(--mf-gold)}
.beta-badge{
  font:600 9.5px/17px Roboto,Arial,sans-serif;letter-spacing:1px;
  color:var(--mf-gold);border:1px solid rgba(193,165,120,.42);
  background:rgba(26,46,80,.42);border-radius:5px;padding:0 7px;margin-left:4px
}
@media (max-width:720px){ .beta-badge{display:none} }

/* ---------- Brand chrome ------------------------------------------------- */
[data-theme="dark"] .appbar{
  background:linear-gradient(90deg,rgba(26,46,80,.50) 0%,rgba(20,20,20,0) 46%),
             var(--fh-background-canvas);
  border-bottom:1px solid var(--fh-border-stroke-default)
}
:root:not([data-theme="dark"]) .appbar{
  background:linear-gradient(90deg,rgba(26,46,80,.07) 0%,rgba(255,255,255,0) 40%),
             var(--fh-background-surface);
  border-bottom:1px solid var(--fh-border-stroke-default)
}
.brand:hover .wordmark .nm em{color:#d8bf94}
::selection{background:rgba(193,165,120,.32)}
.btn.filled{background:var(--mf-gold);color:#241a05;border-color:var(--mf-gold)}

/* ---------- Deep Research: focus chips, tasks, progress ------------------ */

.fc:hover{color:var(--fh-foreground-on-surface-emphasis);background:var(--fh-background-surface-container)}

@keyframes rsRun{from{background-position:-60% 0}to{background-position:160% 0}}
.rs-prog.fin i{background:var(--fh-positive,#34a853)}
.rs-pm{display:flex;justify-content:space-between;margin:8px 0 14px;font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis);font-variant-numeric:tabular-nums}
.rs-tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}

.rs-tasks li.done{color:var(--fh-foreground-on-surface-emphasis)}

.newres{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 11px;margin-left:auto;border-radius:999px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  color:var(--r,#c1a578);background:rgba(193,165,120,.14);border:1px solid rgba(193,165,120,.6);box-shadow:0 0 0 0 rgba(193,165,120,0);transition:background .18s,box-shadow .18s,transform .15s,opacity .2s}

.gl-full{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .4s cubic-bezier(.3,.7,.2,1),margin .4s,visibility 0s .4s;margin-top:0}   /* hidden = not focusable either */

.pm-search{padding:8px 10px 2px;flex:0 0 auto}

.pm-search input:focus{box-shadow:0 0 0 1.5px var(--fh-border-stroke-emphasis,#666)}
.pm-grp{padding:10px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--fh-foreground-on-surface-de-emphasis)}
.pm-name{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;text-overflow:ellipsis}

.pm-new{flex:none;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;color:var(--r,#c1a578);background:rgba(193,165,120,.16);margin-right:4px}
.pm-free{flex:none;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;color:var(--fh-positive,#34a853);background:rgba(52,168,83,.14)}
.pfask p{margin:0 0 12px;line-height:1.6}
.pfask ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;line-height:1.55;font-size:14px}

.an-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:2px 0 8px}
.an-head b{font-family:var(--mf-serif);font-size:20px;font-weight:500}
.tc{position:relative;height:128px;margin:6px 0 4px}
.tc-track,.tc-band{position:absolute;top:56px;height:8px;border-radius:5px}
.tc-track{left:0;right:0;background:var(--fh-background-surface-container-high,rgba(128,128,128,.22))}
.tc-band{background:var(--fh-colors-and-accents-primary,#c1a578);opacity:.38}
.tc-dot{position:absolute;top:54px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--fh-background-surface,#1c1c1c);box-sizing:content-box;margin-top:-2px}
.tc-px{background:var(--fh-foreground-on-surface-emphasis,#f3efe6)}
.tc-tg{background:var(--fh-colors-and-accents-primary,#c1a578)}
.tc-stem{position:absolute;width:1.5px;transform:translateX(-50%);background:var(--fh-border-stroke-emphasis,rgba(160,160,160,.6))}
.tc-up{top:34px;height:22px}
.tc-down{top:64px;height:22px}
.tc-lab{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1.25}
.tc-top{top:0}.tc-bot{top:88px}
.tc-lab span{display:block;font-size:11.5px;color:var(--fh-foreground-on-surface-de-emphasis)}
.tc-lab b{font-size:14px;font-weight:600}
.tc-lab em{font-style:normal;font-weight:600}
.tc-gold{color:var(--fh-colors-and-accents-primary,#c1a578)}
.tc-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis);padding-top:8px;border-top:1px solid var(--fh-border-stroke-default)}
.tc-ends b{color:var(--fh-foreground-on-surface-emphasis);font-weight:500;margin-left:4px}
/* full screen: centred reading column */
.drawer.full{--gut:max(20px,calc((100vw - 760px)/2))}
.drawer.full #rsPane{--gut:max(20px,calc((100vw - 880px)/2))}
.drawer.full #rsPane .rs-grid{grid-template-columns:1fr}
.drawer.full #rsPane textarea{min-height:150px;font-size:16px}
.drawer.full .drawer-head{padding:14px var(--gut) 6px}
.drawer.full .drawer-head .rs-tabs{flex:0 0 auto}
.drawer.full #chat .msg{font-size:16px;line-height:1.75;padding:0;border-radius:0;margin-bottom:26px}

/* ---- First-run tour: spotlight, bubble, arrow ---------------------------- */
#tour{position:fixed;inset:0;z-index:9999;pointer-events:none}
#tour .tr-shield{position:absolute;inset:0;pointer-events:auto}
#tour.pass .tr-shield{pointer-events:none}
#tour .tr-dim{position:absolute;inset:0;background:rgba(8,8,10,.62);opacity:0;transition:opacity .3s}
#tour.center .tr-dim{opacity:1}
#tour .tr-hole{position:absolute;border-radius:12px;box-shadow:0 0 0 100vmax rgba(8,8,10,.62);opacity:0;
  transition:top .38s cubic-bezier(.4,0,.2,1),left .38s cubic-bezier(.4,0,.2,1),width .38s cubic-bezier(.4,0,.2,1),height .38s cubic-bezier(.4,0,.2,1),opacity .25s}
#tour.has-target .tr-hole{opacity:1}
#tour .tr-hole::after{content:"";position:absolute;inset:-3px;border-radius:inherit;border:2px solid var(--fh-colors-and-accents-primary);animation:trPulse 1.6s ease-out infinite}
#tour .tr-bubble{position:absolute;box-sizing:border-box;width:330px;max-width:calc(100vw - 24px);padding:16px 18px 14px;border-radius:16px;pointer-events:auto;
  background:var(--fh-background-surface-elevated);color:var(--fh-foreground-on-surface-emphasis);border:1px solid var(--fh-border-stroke-default);
  box-shadow:0 12px 40px rgba(0,0,0,.45);opacity:0}
#tour .tr-bubble.in{animation:trIn .38s cubic-bezier(.2,.8,.2,1) both}
#tour .tr-step{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--fh-colors-and-accents-primary);margin-bottom:4px}
#tour .tr-title{font-family:var(--mf-serif);font-size:19px;line-height:26px;font-weight:500;margin:0 0 6px}
#tour .tr-text{font-size:14px;line-height:21px;color:var(--fh-foreground-on-surface-default);margin:0 0 14px}
#tour .tr-foot{display:flex;align-items:center;gap:8px}
#tour .tr-dots{display:flex;gap:5px;flex:1;min-width:0}
#tour .tr-dots i{width:6px;height:6px;border-radius:50%;background:var(--fh-border-stroke-default);transition:background .25s,transform .25s}
#tour .tr-dots i.on{background:var(--fh-colors-and-accents-primary);transform:scale(1.35)}
#tour .tr-dots i.done{background:var(--fh-colors-and-accents-primary);opacity:.55}
#tour .tr-arrow{position:absolute;width:28px;height:40px;color:var(--fh-colors-and-accents-primary);opacity:0;pointer-events:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
#tour .tr-arrow.show{opacity:1}
#tour .tr-arrow svg{display:block;width:100%;height:100%;animation:trNudge 1s ease-in-out infinite}
#tour .tr-arrow.up{transform:none}
#tour .tr-arrow.down{transform:rotate(180deg)}
#tour .tr-arrow.left{transform:rotate(-90deg)}
#tour .tr-arrow.right{transform:rotate(90deg)}
@keyframes trIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
@keyframes trPulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.07)}}
@keyframes trNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.tr-note{font:inherit;font-size:13px;color:var(--fh-colors-and-accents-primary);background:none;border:0;padding:0;margin:-8px 0 14px;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.empty .tr-row{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){
  #tour .tr-hole,#tour .tr-dim{transition:none}
  #tour .tr-hole::after,#tour .tr-arrow svg,#tour .tr-bubble.in{animation:none;opacity:1}
}
/* ---------- Famous investors ------------------------------------------- */
/* Pie slots: the dataviz reference palette + two validated extras (both modes pass the six checks). */
:root{--gp1:#2a78d6;--gp2:#eb6834;--gp3:#1baf7a;--gp4:#eda100;--gp5:#e87ba4;--gp6:#008300;--gp7:#4a3aa7;--gp8:#e34948;--gp9:#1593b5;--gp10:#9a6424}
[data-theme="dark"]{--gp1:#3987e5;--gp2:#d95926;--gp3:#199e70;--gp4:#c98500;--gp5:#d55181;--gp6:#008300;--gp7:#9085e9;--gp8:#e66767;--gp9:#2aa3c9;--gp10:#a8742a}
.rail a.rail-item{text-decoration:none}

.rsec-ic{flex:0 0 auto;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;color:var(--mf-gold);
  background:linear-gradient(140deg,var(--mf-navy) 0%,var(--mf-navy-deep) 100%);box-shadow:inset 0 0 0 1px rgba(193,165,120,.35);transition:transform .25s}

.rsec-body{padding:2px 0 6px 18px}
.rail .rsec-body .rail-item{padding:7px 12px;font-size:13.5px;border-radius:10px}
.rsec .rail-fold>div{position:relative}

.ri-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--fh-border-stroke-emphasis);transition:background .2s}

.rail-fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}

:root:not([data-theme="dark"]) .gu-hero h2,:root:not([data-theme="dark"]) .gu-hero .tl,:root:not([data-theme="dark"]) .gu-hero .gu-sub{color:#fffdf7}
.gu-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.gu-stat{padding:10px 12px;border-radius:12px;background:var(--fh-background-surface);border:1px solid var(--fh-border-stroke-default)}
.gu-stat b{display:block;font-size:19px;font-weight:500;color:var(--fh-foreground-on-surface-emphasis)}
.gu-stat span{font-size:12px;color:var(--fh-foreground-on-surface-de-emphasis)}
.gu-seg{display:inline-flex;border:1px solid var(--fh-border-stroke-emphasis);border-radius:18px;padding:2px}
.gu-seg button{border:0;background:transparent;padding:6px 14px;border-radius:16px;font-size:13.5px;color:var(--fh-foreground-on-surface-default)}
.gu-seg button.on{background:var(--fh-states-branded-medium-selected);color:var(--fh-foreground-on-highlight);font-weight:500}
.gu-pie-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:12px}
.gu-pie{flex:0 0 auto;max-width:100%;height:auto;overflow:visible}
.gu-sweep{animation:guSweep 1.1s cubic-bezier(.3,.7,.2,1) forwards}
.gu-slice{cursor:pointer;transition:transform .28s cubic-bezier(.2,.8,.2,1.3),opacity .2s;stroke:var(--fh-background-surface);stroke-width:2}
.gu-slice.on{transform:translate(var(--dx),var(--dy))}
.gu-pie.hov .gu-slice:not(.on){opacity:.4}
.gu-pie .ctr{transition:opacity .2s}
.gu-legend{flex:1;min-width:240px;display:grid;gap:2px}
.gu-leg{display:grid;grid-template-columns:12px 28px 62px minmax(0,1fr) 58px;gap:10px;align-items:center;padding:6px 8px;border-radius:10px;
  color:inherit;font-size:13.5px;animation:guIn .45s both;animation-delay:var(--d,0ms)}
.gu-leg:hover,.gu-leg.on{background:var(--fh-states-neutral-hovered);text-decoration:none}
.gu-leg .sw{width:12px;height:12px;border-radius:3px}
.gu-leg .tk,.gu-row .tk{font-weight:600;color:var(--fh-foreground-on-surface-emphasis)}
.gu-leg .cn,.gu-row .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fh-foreground-on-surface-de-emphasis)}
.gu-leg .wt,.gu-row .wt{text-align:right;font-variant-numeric:tabular-nums}
.gu-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 6px}
.gu-tools input{flex:1;min-width:160px;max-width:320px;padding:8px 14px;border-radius:18px;border:1px solid var(--fh-border-stroke-emphasis);background:var(--fh-background-surface);color:inherit;font-size:13.5px}
.gu-list{display:grid;gap:1px}
.gu-row{display:grid;grid-template-columns:30px 28px 70px minmax(90px,1.1fr) minmax(80px,2fr) 58px 62px 76px;gap:10px;align-items:center;
